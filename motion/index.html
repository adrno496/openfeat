/* ============== Recovery Nutrition (Phase 1 — local) ====================== */
const MICRO_LABELS = {
  iron: 'Fer', vitD: 'Vitamine D', vitC: 'Vitamine C', vitB12: 'B12',
  magnesium: 'Magnésium', zinc: 'Zinc', omega3: 'Oméga-3', calcium: 'Calcium',
  ferritin: 'Ferritine', sodium: 'Sodium', potassium: 'Potassium',
};
function computeRecoveryNutrition(sess, profile, weather) {
  const meta = getProfileMetabolism(profile);
  const w = meta.weightKg || 70;
  const fs = getFuelState();
  const type = sess.type || 'easy';
  const load = sess.load || 0;
  const km = sess.actualKm || 0;
  const durMin = (sess.actualDuration || 0) / 60;
  const rpe = sess.rpe || 5;
  const pain = sess.pain || 'none';

  // === Glucides ===
  let carbsPerKg = 0.7;
  if (type === 'long' || type === 'marathon') carbsPerKg = 1.2;
  else if (type === 'interval' || type === 'tempo') carbsPerKg = 1.0;
  else if (load > 50) carbsPerKg = 1.0;
  if (durMin > 90) carbsPerKg = Math.max(carbsPerKg, 1.2);
  const glucides_g = Math.round(w * carbsPerKg);

  // === Protéines ===
  let proteinPerKg = 0.3;
  if (rpe >= 8 || type === 'long' || type === 'marathon') proteinPerKg = 0.4;
  const proteines_g = Math.round(w * proteinPerKg);

  // === Lipides (post-séance modeste, pas le focus) ===
  const lipides_g = Math.round(w * 0.15);

  // === Hydratation ===
  const kcal = Number(sess.kcal) || Math.round(durMin * (type === 'easy' || type === 'endurance' ? 8 : 11) * (w / 70));
  let hydratation_ml = Math.round(Math.max(durMin * 12, kcal * 1.3));

  // === Électrolytes ===
  const elecReasons = [];
  if (durMin >= 60) elecReasons.push('séance > 60 min');
  if (weather && weather.tempC != null && weather.tempC >= 22) elecReasons.push(`chaleur ${Math.round(weather.tempC)}°C`);
  if (weather && weather.humidityPct != null && weather.humidityPct >= 70) elecReasons.push(`humidité ${weather.humidityPct}%`);
  if (km >= 15) elecReasons.push('longue distance');
  if (rpe >= 8) elecReasons.push('effort intense');
  const electroNeeded = elecReasons.length > 0;
  // Sweat sodium: ~500-700mg/L, modulated by intensity
  const sweatLitersEst = Math.max(0.3, durMin / 60 * (rpe >= 7 ? 0.9 : 0.6));
  const sodium_mg = electroNeeded ? Math.round(sweatLitersEst * 600) : Math.round(sweatLitersEst * 300);
  const potassium_mg = electroNeeded ? Math.round(200 + durMin * 1.5) : 100;
  const magnesium_mg = (rpe >= 8 || pain !== 'none' || type === 'long') ? 300 : 150;

  // === Micronutriments focus selon type & douleur ===
  const microFocus = [];
  if (type === 'interval' || type === 'tempo') {
    microFocus.push({ id: 'vitC', name: 'Vitamine C + polyphénols', why: 'Stress oxydatif élevé (effort intense)', action: 'Fruits rouges, agrumes, thé vert post-séance' });
  }
  if (type === 'long' || type === 'marathon' || km >= 15) {
    microFocus.push({ id: 'iron', name: 'Fer héminique', why: 'Hémolyse de l\'effort + sudation', action: 'Viande rouge / abats / lentilles + vit C pour absorption' });
  }
  if (rpe >= 8 || pain !== 'none') {
    microFocus.push({ id: 'omega3', name: 'Oméga-3 (EPA/DHA)', why: 'Anti-inflammatoire naturel', action: 'Poissons gras (saumon, maquereau, sardines) ou huile de colza' });
    microFocus.push({ id: 'magnesium', name: 'Magnésium', why: 'Récup musculaire, anti-crampes', action: 'Amandes, chocolat noir 70%, eau magnésienne (Hépar/Rozana) le soir' });
  }
  if (type === 'long' || durMin >= 90) {
    microFocus.push({ id: 'bcaa', name: 'Acides aminés (leucine)', why: 'Synthèse musculaire post-effort prolongé', action: 'Yaourt grec, œufs, whey si pratique' });
  }
  // Saison hiver → vit D
  const season = (typeof getCurrentSeason === 'function') ? getCurrentSeason() : null;
  if (season === 'winter' || season === 'autumn') {
    microFocus.push({ id: 'vitD', name: 'Vitamine D', why: 'Saison à faible ensoleillement', action: 'À prendre avec un repas gras (lipides facilitent absorption)' });
  }

  // === Cures actives — rappels intelligents ===
  const cureReminders = [];
  (fs.activeCures || []).forEach(c => {
    const label = MICRO_LABELS[c.id] || c.id;
    let tip = '';
    if (c.id === 'iron') tip = 'À prendre avec ta vit C post-séance (orange, kiwi) — évite thé/café 1h avant/après';
    else if (c.id === 'vitD') tip = 'Avec un repas contenant des lipides (œuf, avocat, huile)';
    else if (c.id === 'magnesium') tip = 'Le soir, 1-2h avant le coucher, améliore aussi le sommeil';
    else if (c.id === 'omega3') tip = 'Avec un repas contenant des lipides';
    else if (c.id === 'zinc') tip = 'À jeun ou 2h après un repas, pas avec calcium/fer';
    else if (c.id === 'vitB12') tip = 'Sublingual le matin de préférence';
    else tip = 'Selon ta routine habituelle';
    cureReminders.push({ id: c.id, name: label, tip });
  });

  // === Alertes prises de sang ===
  const bloodAlerts = [];
  const markers = (fs.lastBloodTest && fs.lastBloodTest.parsedMarkers) || {};
  if (markers.ferritin != null && markers.ferritin < 50) {
    bloodAlerts.push({ marker: 'Ferritine basse', value: markers.ferritin, action: 'Fer héminique + vit C ce repas. Vise > 50 µg/L pour la performance.' });
  }
  if (markers.vitD != null && markers.vitD < 30) {
    bloodAlerts.push({ marker: 'Vitamine D basse', value: markers.vitD, action: 'Suppléments + exposition solaire. Vise 30-50 ng/mL.' });
  }
  if (markers.magnesium != null && markers.magnesium < 0.75) {
    bloodAlerts.push({ marker: 'Magnésium bas', value: markers.magnesium, action: 'Risque de crampes 24-48h. Eau magnésienne ce soir + amandes.' });
  }
  if (markers.vitB12 != null && markers.vitB12 < 300) {
    bloodAlerts.push({ marker: 'B12 basse', value: markers.vitB12, action: 'Œufs, produits laitiers, viande. Cure B12 sublinguale si végétarien.' });
  }

  // === Idées de repas concrets ===
  const meals = [];
  if (durMin >= 60) {
    meals.push('🍝 Pâtes complètes + saumon + légumes verts + huile d\'olive');
    meals.push('🍚 Bowl riz + poulet + avocat + brocolis');
  } else {
    meals.push('🥪 Sandwich complet jambon-fromage + fruit');
    meals.push('🥣 Yaourt grec + flocons d\'avoine + miel + fruits rouges');
  }
  if (type === 'interval' || type === 'tempo' || rpe >= 8) {
    meals.push('🥤 Smoothie banane + fruits rouges + amandes + lait (récup rapide)');
  }

  // === Timing ===
  let timing = 'Dans les 30 minutes (fenêtre métabolique)';
  if (durMin < 30 && load < 30) timing = 'Snack léger + repas habituel suffisent';
  else if (type === 'long' || km >= 15) timing = 'Snack glucides+protéines immédiatement, puis vrai repas dans 1-2h';

  return {
    glucides_g, proteines_g, lipides_g,
    hydratation_ml, kcal_estimes: kcal,
    electrolytes: { sodium_mg, potassium_mg, magnesium_mg, needed: electroNeeded, reasons: elecReasons },
    micronutrients_focus: microFocus,
    cure_reminders: cureReminders,
    blood_alerts: bloodAlerts,
    meals,
    timing,
    sessionMeta: { type, km, durMin: Math.round(durMin), rpe, pain, load, kcal },
  };
}

/* ============== Bundle: APIs externes gratuites =========================== */
async function fetchEnvironmentBundle() {
  // Géoloc cachée (réutilise lastGeo)
  let geo = SM.get('lastGeo', null);
  const fresh = geo && (Date.now() - geo.ts) < 7 * 86400000;
  if (!fresh) {
    geo = await new Promise(resolve => {
      if (!navigator.geolocation) return resolve(null);
      navigator.geolocation.getCurrentPosition(
        p => resolve({ lat: p.coords.latitude, lon: p.coords.longitude, ts: Date.now() }),
        () => resolve(null),
        { timeout: 8000, maximumAge: 86400000 }
      );
    });
    if (geo) SM.set('lastGeo', geo);
  }
  if (!geo) return null;
  const out = { ts: Date.now(), geo };

  // Météo + UV (Open-Meteo) — single call étendu
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${geo.lat}&longitude=${geo.lon}&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,weather_code,uv_index&hourly=temperature_2m,precipitation_probability,uv_index&daily=uv_index_max,temperature_2m_max,temperature_2m_min,sunrise,sunset&forecast_days=2&timezone=auto`;
    const r = await fetch(url); if (r.ok) {
      const j = await r.json();
      out.weather = {
        tempC: j.current?.temperature_2m, humidityPct: j.current?.relative_humidity_2m,
        precipMm: j.current?.precipitation, windKmh: j.current?.wind_speed_10m,
        code: j.current?.weather_code, label: weatherCodeLabel(j.current?.weather_code),
        uvNow: j.current?.uv_index,
        hourlyTempC: (j.hourly?.temperature_2m || []).slice(0, 24),
        hourlyUv: (j.hourly?.uv_index || []).slice(0, 24),
        hourlyPrecipPct: (j.hourly?.precipitation_probability || []).slice(0, 24),
        uvMaxToday: j.daily?.uv_index_max?.[0],
        tempMaxToday: j.daily?.temperature_2m_max?.[0],
        tempMinToday: j.daily?.temperature_2m_min?.[0],
        tempMaxTomorrow: j.daily?.temperature_2m_max?.[1],
        sunrise: j.daily?.sunrise?.[0], sunset: j.daily?.sunset?.[0],
        sunriseTomorrow: j.daily?.sunrise?.[1], sunsetTomorrow: j.daily?.sunset?.[1],
      };
    }
  } catch (_) {}

  // Air quality (PM2.5, O3) + pollens
  try {
    const url = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${geo.lat}&longitude=${geo.lon}&current=european_aqi,pm2_5,pm10,ozone,nitrogen_dioxide,alder_pollen,birch_pollen,grass_pollen,ragweed_pollen&timezone=auto`;
    const r = await fetch(url);
    if (r.ok) {
      const j = await r.json();
      out.air = {
        aqi: j.current?.european_aqi, pm25: j.current?.pm2_5, pm10: j.current?.pm10,
        ozone: j.current?.ozone, no2: j.current?.nitrogen_dioxide,
        pollens: {
          alder: j.current?.alder_pollen, birch: j.current?.birch_pollen,
          grass: j.current?.grass_pollen, ragweed: j.current?.ragweed_pollen,
        },
      };
    }
  } catch (_) {}

  // Indice thermique calculé localement (heat index simplifié)
  if (out.weather && out.weather.tempC != null && out.weather.humidityPct != null) {
    out.heatIndex = computeHeatIndex(out.weather.tempC, out.weather.humidityPct);
  }
  SM.set('lastEnvBundle', out);
  return out;
}

function computeHeatIndex(t, h) {
  // °C + %hum → catégorie
  const apparent = t + 0.05 * (h - 50) * Math.max(0, t - 18) / 10;
  let zone = 'safe', label = 'Conditions OK', advice = '';
  if (apparent >= 35) { zone = 'danger'; label = 'Danger hyperthermie'; advice = 'Repousse aux heures fraîches (tôt matin / soirée). Hydratation +50%, sel.'; }
  else if (apparent >= 30) { zone = 'caution'; label = 'Vigilance chaleur'; advice = 'Réduis l\'intensité de 15-20%. Hydrate avant/pendant. Crème solaire.'; }
  else if (apparent >= 25) { zone = 'attention'; label = 'Tiède'; advice = 'Conditions correctes, hydrate-toi bien.'; }
  else if (apparent <= 0) { zone = 'cold'; label = 'Froid'; advice = 'Échauffement long, couches techniques. Prudence sur le verglas.'; }
  return { apparent: Math.round(apparent * 10) / 10, zone, label, advice };
}

function airQualityZone(aqi) {
  if (aqi == null) return null;
  if (aqi <= 20) return { label: 'Excellent', color: '#22c55e', advice: 'Toutes séances OK' };
  if (aqi <= 40) return { label: 'Bon', color: '#84cc16', advice: 'Toutes séances OK' };
  if (aqi <= 60) return { label: 'Moyen', color: '#eab308', advice: 'Séances normales OK' };
  if (aqi <= 80) return { label: 'Médiocre', color: '#f59e0b', advice: 'Évite séances très intenses' };
  if (aqi <= 100) return { label: 'Mauvais', color: '#ef4444', advice: '⚠️ Déconseillé : fractionné/tempo' };
  return { label: 'Très mauvais', color: '#7c2d12', advice: '🚫 Reporte la séance ou intérieur' };
}

function uvAdvice(uv) {
  if (uv == null) return null;
  if (uv < 3) return { label: 'Faible', advice: 'Pas de protection particulière' };
  if (uv < 6) return { label: 'Modéré', advice: 'Casquette, lunettes' };
  if (uv < 8) return { label: 'Élevé', advice: 'Crème SPF 30+, casquette, lunettes' };
  if (uv < 11) return { label: 'Très élevé', advice: 'SPF 50+, vêtements couvrants, évite 11h-15h' };
  return { label: 'Extrême', advice: 'Reporte si possible. SPF 50+, couvert.' };
}

function pollenLevel(p) {
  if (p == null || p === 0) return null;
  if (p < 10) return 'faible';
  if (p < 50) return 'modéré';
  if (p < 100) return 'élevé';
  return 'très élevé';
}

/* ============== Bundle: Stats avancées (calculs purs) ===================== */
function computePolarization(sessions) {
  // 80/20 ratio : easy+endurance+long vs tempo+interval+marathon
  const last30 = sessions.filter(s => {
    if (!s.completedAt) return false;
    return (Date.now() - new Date(s.completedAt).getTime()) <= 30 * 86400000;
  });
  if (!last30.length) return null;
  let easyTime = 0, hardTime = 0;
  last30.forEach(s => {
    const dur = (s.actualDuration || 0) / 60;
    if (['easy','endurance','long'].includes(s.type)) easyTime += dur;
    else if (['tempo','interval','marathon'].includes(s.type)) hardTime += dur;
  });
  const total = easyTime + hardTime;
  if (!total) return null;
  const easyPct = Math.round((easyTime / total) * 100);
  const hardPct = 100 - easyPct;
  let status = 'optimal', advice = '';
  if (easyPct < 70) { status = 'trop_intense'; advice = 'Trop d\'intensité. Augmente l\'endurance fondamentale (objectif 80% easy).'; }
  else if (easyPct > 90) { status = 'trop_facile'; advice = 'Tu peux ajouter du tempo/fractionné pour progresser.'; }
  else { advice = 'Polarisation 80/20 respectée — très bon.'; }
  return { easyPct, hardPct, status, advice, totalMin: Math.round(total) };
}

function computeVDOTTrend(sessions, profile) {
  // Estime un VDOT mensuel via les easy runs (HR/allure proxy)
  const months = {};
  sessions.forEach(s => {
    if (s.type !== 'easy' && s.type !== 'long') return;
    if (!s.actualKm || !s.actualDuration || !s.completedAt) return;
    const ym = s.completedAt.slice(0, 7);
    months[ym] = months[ym] || { paces: [], totalKm: 0 };
    months[ym].paces.push(s.actualDuration / s.actualKm);
    months[ym].totalKm += s.actualKm;
  });
  const series = Object.keys(months).sort().map(ym => {
    const avgPace = months[ym].paces.reduce((a,b)=>a+b,0) / months[ym].paces.length;
    // Approximation: VDOT estimé inversement proportionnel à l'allure easy
    // pace easy ≈ pace VDOT × 1.43 → VDOT ≈ 60 × 60 / pace * factor ; on retourne juste l'allure
    return { month: ym, avgPaceSec: Math.round(avgPace), totalKm: Math.round(months[ym].totalKm) };
  });
  if (series.length < 2) return { series, currentVdot: profile?.vdot || null, trend: null };
  const last = series[series.length - 1];
  const prev = series[series.length - 2];
  const trend = prev.avgPaceSec - last.avgPaceSec; // positif = progression
  return { series, currentVdot: profile?.vdot || null, trend };
}

function computeHourlyHeatmap(sessions) {
  // RPE moyen par heure de la journée (si dispos via completedAt timestamp)
  const buckets = {}; // hour → { rpeSum, count, completionSum }
  sessions.forEach(s => {
    if (!s.completedAt || !s.rpe) return;
    let hour;
    try {
      const d = new Date(s.completedAt);
      if (isNaN(d.getTime())) return;
      hour = d.getHours();
    } catch (_) { return; }
    buckets[hour] = buckets[hour] || { rpeSum: 0, count: 0, completionSum: 0 };
    buckets[hour].rpeSum += s.rpe;
    buckets[hour].completionSum += s.completion || 0;
    buckets[hour].count++;
  });
  const heat = Object.keys(buckets).map(h => ({
    hour: parseInt(h),
    avgRpe: Math.round((buckets[h].rpeSum / buckets[h].count) * 10) / 10,
    avgCompletion: Math.round(buckets[h].completionSum / buckets[h].count),
    count: buckets[h].count,
  })).sort((a,b) => a.hour - b.hour);
  if (!heat.length) return null;
  const best = heat.reduce((a,b) => a.avgCompletion >= b.avgCompletion ? a : b);
  return { heat, bestHour: best.hour };
}

function computeMonthComparison(sessions) {
  const now = new Date();
  const thisMonth = now.toISOString().slice(0,7);
  const lastDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const lastMonth = lastDate.toISOString().slice(0,7);
  const agg = (ym) => {
    const list = sessions.filter(s => (s.completedAt||'').slice(0,7) === ym);
    return {
      sessions: list.length,
      km: Math.round(list.reduce((a,s) => a + (s.actualKm||0), 0) * 10) / 10,
      load: list.reduce((a,s) => a + (s.load||0), 0),
      avgRpe: list.length ? Math.round((list.reduce((a,s) => a + (s.rpe||0),0) / list.length) * 10)/10 : 0,
    };
  };
  return { thisMonth: agg(thisMonth), lastMonth: agg(lastMonth) };
}

function predictRaceTime(vdot, distanceKm) {
  // Tables Daniels approximées : VDOT → temps sur distance (sec)
  // Coefficient de Riegel + facteur VDOT
  // Référence : VDOT 50 → 5km en ~22:30, 10km en ~46:30, semi en ~1:42, marathon en ~3:35
  if (!vdot || vdot < 25) return null;
  const ref = { 5: 22.5*60, 10: 46.5*60, 21.0975: 102*60, 42.195: 215*60 };
  const refVDOT = 50;
  // Trouve la distance de référence la plus proche
  const closestRef = Object.keys(ref).map(Number).reduce((a,b) => Math.abs(b - distanceKm) < Math.abs(a - distanceKm) ? b : a);
  const refTime = ref[closestRef];
  // Loi de Riegel pour passer à la distance demandée
  const t1 = refTime * Math.pow(distanceKm / closestRef, 1.06);
  // Ajuste selon VDOT (linéaire approximé)
  const vdotFactor = refVDOT / vdot;
  const tFinal = t1 * vdotFactor;
  return { seconds: Math.round(tFinal), pacePerKm: Math.round(tFinal / distanceKm) };
}

/* ============== Bundle: Détecteurs (logique pure) ========================= */
function detectAbandonRisk(plan) {
  // 3 séances ratées (planifiées non-rest, pas completed, date passée) consécutives
  if (!plan || !plan.planData) return null;
  const today = todayISO();
  let consecutive = 0;
  const startWeek = (plan.currentWeek || 1) - 1;
  for (let w = 0; w <= startWeek; w++) {
    const wk = plan.planData.weeks[w];
    if (!wk) continue;
    wk.sessions.forEach(s => {
      if (s.type === 'rest') return;
      // estimer la date prévue à partir du début du plan
      // approximation: on saute si pas de mécanisme date par séance
      if (!s.completed && s.expectedDate && s.expectedDate < today) consecutive++;
      else if (s.completed) consecutive = 0;
    });
  }
  // Fallback simple : compte séances non-completed dans les 2 dernières semaines
  let missedRecent = 0;
  for (let w = Math.max(0, startWeek - 1); w <= startWeek; w++) {
    const wk = plan.planData.weeks[w]; if (!wk) continue;
    wk.sessions.forEach(s => { if (s.type !== 'rest' && !s.completed) missedRecent++; });
  }
  return missedRecent >= 3 ? { missed: missedRecent } : null;
}

function detectOvertraining(plan, sessions) {
  const acwr = calculateACWR();
  const last5 = sessions.slice(-5);
  if (last5.length < 5) return null;
  const avgRpe = last5.reduce((a,s) => a + (s.rpe||0), 0) / last5.length;
  const painCount = last5.filter(s => s.pain && s.pain !== 'none').length;
  const sleepLog = SM.get('sleepLog', []);
  const recentSleep = sleepLog.slice(-7);
  const avgSleep = recentSleep.length ? recentSleep.reduce((a,x) => a + (x.hours||0), 0) / recentSleep.length : null;
  const flags = [];
  if (acwr.ratio > 1.5) flags.push('ACWR > 1.5 (risque blessure)');
  if (avgRpe > 7) flags.push('RPE moyen > 7 sur 5 séances');
  if (painCount >= 2) flags.push(painCount + ' séances avec douleur récentes');
  if (avgSleep != null && avgSleep < 6.5) flags.push('Sommeil < 6h30 sur la semaine');
  return flags.length >= 2 ? { acwr: acwr.ratio, avgRpe, painCount, avgSleep, flags } : null;
}

function detectTaperingDue(profile) {
  // Si une race est planifiée et J-14
  const race = SM.get('targetRace', null);
  if (!race || !race.date) return null;
  const today = new Date(todayISO());
  const raceDate = new Date(race.date);
  const daysToRace = Math.round((raceDate - today) / 86400000);
  if (daysToRace > 14 || daysToRace < 0) return null;
  let factor;
  if (daysToRace > 7) factor = 0.7;       // S-2 → -30%
  else if (daysToRace > 3) factor = 0.5;  // S-1 → -50%
  else factor = 0.3;                       // J-3 → -70%
  return { daysToRace, volumeFactor: factor, race };
}

function detectPR(sessions) {
  // PR sur 5km, 10km via les vraies séances (km / pace)
  const prs = SM.get('PRs', { '5km': null, '10km': null, '21km': null, '42km': null });
  let newPR = null;
  sessions.slice(-3).forEach(s => {
    if (!s.actualKm || !s.actualDuration) return;
    const distances = [
      { d: 5, key: '5km', tol: 0.5 },
      { d: 10, key: '10km', tol: 1.0 },
      { d: 21, key: '21km', tol: 1.5 },
      { d: 42, key: '42km', tol: 2.5 },
    ];
    distances.forEach(({d, key, tol}) => {
      if (Math.abs(s.actualKm - d) <= tol) {
        // Estime le temps sur d via la loi de Riegel
        const t = s.actualDuration * Math.pow(d / s.actualKm, 1.06);
        if (!prs[key] || t < prs[key].seconds) {
          const isNew = !!prs[key];
          prs[key] = { seconds: Math.round(t), date: s.completedAt, sessionId: s.id };
          if (isNew) newPR = { distance: key, seconds: Math.round(t), oldSec: prs[key].seconds };
        }
      }
    });
  });
  SM.set('PRs', prs);
  return newPR;
}

function detectCarbLoading() {
  // J-3 d'une longue OU race planifiée
  const race = SM.get('targetRace', null);
  if (race && race.date) {
    const days = Math.round((new Date(race.date) - new Date(todayISO())) / 86400000);
    if (days >= 1 && days <= 3 && race.distance >= 21) {
      return { trigger: 'race', days, distance: race.distance };
    }
  }
  return null;
}

function computeGlycogenReserve(sessions) {
  // Estime un "réservoir" sur 0-100% : load des 3 derniers jours diminue la jauge
  let reserve = 100;
  const today = new Date(todayISO());
  for (let i = 0; i < 3; i++) {
    const d = new Date(today.getTime() - i * 86400000).toISOString().slice(0,10);
    const dayLoad = sessions.filter(s => (s.completedAt||'').slice(0,10) === d).reduce((a,s) => a + (s.load||0), 0);
    reserve -= Math.min(40, dayLoad / 5);
  }
  reserve = Math.max(0, Math.round(reserve));
  let label = 'Plein', color = '#22c55e';
  if (reserve < 30) { label = 'Vide — recharge'; color = '#ef4444'; }
  else if (reserve < 60) { label = 'Bas'; color = '#f59e0b'; }
  else if (reserve < 80) { label = 'Correct'; color = '#84cc16'; }
  return { pct: reserve, label, color };
}

  return recos;
}

/* ============== Auto-detected user profile (Feature #2) =================== */
function computeAutoProfile() {
  const sessions = SM.get('sessions', []);
  if (!sessions.length) return { sampleSize: 0 };
  const last20 = sessions.slice(-20);
  const byType = {};
  let painCount = 0, painByType = {}, totalRpe = 0, totalKm = 0, totalLoad = 0;
  const dowDist = [0,0,0,0,0,0,0]; // dimanche=0
  let elevPainCount = 0, elevTotal = 0;
  last20.forEach(s => {
    const t = s.type || 'easy';
    byType[t] = byType[t] || { count: 0, avgRpe: 0, avgCompletion: 0, avgKm: 0, painRate: 0 };
    byType[t].count++;
    byType[t].avgRpe += s.rpe || 0;
    byType[t].avgCompletion += s.completion || 0;
    byType[t].avgKm += s.actualKm || 0;
    if (s.pain && s.pain !== 'none') { byType[t].painRate++; painCount++; painByType[t] = (painByType[t]||0)+1; }
    totalRpe += s.rpe || 0;
    totalKm += s.actualKm || 0;
    totalLoad += s.load || 0;
    if (s.completedAt) { try { dowDist[new Date(s.completedAt).getDay()]++; } catch(e){} }
    const elev = Number(s.elevationUp) || 0;
    if (elev > 100) { elevTotal++; if (s.pain && s.pain !== 'none') elevPainCount++; }
  });
  Object.keys(byType).forEach(t => {
    const b = byType[t];
    b.avgRpe = Math.round((b.avgRpe / b.count) * 10) / 10;
    b.avgCompletion = Math.round(b.avgCompletion / b.count);
    b.avgKm = Math.round((b.avgKm / b.count) * 10) / 10;
    b.painRate = Math.round((b.painRate / b.count) * 100);
  });
  // Best/worst session type by completion%
  const types = Object.keys(byType);
  let strongestType = null, weakestType = null;
  if (types.length) {
    strongestType = types.reduce((a,b) => byType[a].avgCompletion >= byType[b].avgCompletion ? a : b);
    weakestType = types.reduce((a,b) => byType[a].avgCompletion <= byType[b].avgCompletion ? a : b);
  }
  // Preferred day of week
  let preferredDow = 0, max = 0;
  dowDist.forEach((c, i) => { if (c > max) { max = c; preferredDow = i; } });
  const dowNames = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  // Weekly km estimate (last 4 weeks)
  const last28 = sessions.filter(s => {
    if (!s.completedAt) return false;
    const days = (Date.now() - new Date(s.completedAt).getTime()) / 86400000;
    return days <= 28;
  });
  const avgWeeklyKm = Math.round((last28.reduce((a,s) => a + (s.actualKm||0), 0) / 4) * 10) / 10;
  // VDOT trend estimate (compare avg pace easy first half vs second half of last 10)
  const easyRecent = sessions.filter(s => s.type === 'easy' && s.actualKm > 0 && s.actualDuration > 0).slice(-10);
  let paceTrend = null;
  if (easyRecent.length >= 6) {
    const half = Math.floor(easyRecent.length / 2);
    const oldPace = easyRecent.slice(0, half).reduce((a,s) => a + s.actualDuration/s.actualKm, 0) / half;
    const newPace = easyRecent.slice(half).reduce((a,s) => a + s.actualDuration/s.actualKm, 0) / (easyRecent.length - half);
    paceTrend = { oldPaceSecPerKm: Math.round(oldPace), newPaceSecPerKm: Math.round(newPace), deltaSec: Math.round(newPace - oldPace) };
  }
  return {
    sampleSize: last20.length,
    avgWeeklyKm,
    avgRpe: Math.round((totalRpe / last20.length) * 10) / 10,
    avgLoadPerSession: Math.round(totalLoad / last20.length),
    painRatePct: Math.round((painCount / last20.length) * 100),
    painCorrelatedWithElevation: elevTotal > 2 ? Math.round((elevPainCount / elevTotal) * 100) : null,
    byType,
    strongestType, weakestType,
    preferredDayOfWeek: dowNames[preferredDow],
    easyPaceTrend: paceTrend,
  };
}

async function fetchWeatherForBrief() {
  // Try cached geo if recent (<7 days), else request once
  let geo = SM.get('lastGeo', null);
  const fresh = geo && (Date.now() - geo.ts) < 7 * 86400000;
  if (!fresh) {
    geo = await new Promise(resolve => {
      if (!navigator.geolocation) return resolve(null);
      navigator.geolocation.getCurrentPosition(
        p => resolve({ lat: p.coords.latitude, lon: p.coords.longitude, ts: Date.now() }),
        () => resolve(null),
        { timeout: 8000, maximumAge: 86400000 }
      );
    });
    if (geo) SM.set('lastGeo', geo);
  }
  if (!geo) return null;
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${geo.lat}&longitude=${geo.lon}&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,weather_code&hourly=temperature_2m,precipitation_probability,wind_speed_10m&forecast_days=1&timezone=auto`;
    const res = await fetch(url);
    if (!res.ok) return null;
    const j = await res.json();
    const w = {
      ts: Date.now(),
      tempC: j.current?.temperature_2m,
      humidityPct: j.current?.relative_humidity_2m,
      precipMm: j.current?.precipitation,
      windKmh: j.current?.wind_speed_10m,
      code: j.current?.weather_code,
      label: weatherCodeLabel(j.current?.weather_code),
      hourlyTempC: (j.hourly?.temperature_2m || []).slice(0, 12),
      hourlyPrecipPct: (j.hourly?.precipitation_probability || []).slice(0, 12),
    };
    SM.set('lastWeather', w);
    return w;
  } catch (e) { return null; }
}
function weatherCodeLabel(c) {
  if (c == null) return '';
  if (c === 0) return 'Ciel clair';
  if (c <= 3) return 'Partiellement nuageux';
  if (c <= 48) return 'Brouillard';
  if (c <= 57) return 'Bruine';
  if (c <= 67) return 'Pluie';
  if (c <= 77) return 'Neige';
  if (c <= 82) return 'Averses';
  if (c <= 99) return 'Orage';
  return '—';
}

function updateAIInsight(id, patch) {
  const list = getAIInsights();
  const i = list.findIndex(x => x.id === id);
  if (i < 0) return;
  list[i] = Object.assign({}, list[i], patch);

}
function getAIInsightsForContext() {
  // Last 5 with outcome (effectiveness)
  return getAIInsights().slice(-5).map(x => ({
    date: x.date, sourceSessionType: x.sourceType,
    diagnosisShort: (x.diagnosis||'').slice(0,200),
    recommendation: x.recommendation,
    applied: !!x.applied,
    outcome: x.outcome || null,
  }));
}
function recordOutcomeForRecentInsights(completedSession, weekIdx, dayIndex) {
  const list = getAIInsights();
  let changed = false;
  list.forEach(ins => {
    if (ins.applied && !ins.outcome && ins.appliedRef
        && ins.appliedRef.week === weekIdx + 1 && ins.appliedRef.dayIndex === dayIndex) {
      ins.outcome = {
        rpe: completedSession.rpe, completion: completedSession.completion,
        load: completedSession.load, pain: completedSession.pain,
        actualKm: completedSession.actualKm,
      };
      changed = true;
    }
  });
  if (changed) SM.set('aiInsights', list);
}

function trackAIUsage(feature, usage, model, providerId) {
  if (!usage) return;
  const key = 'fuel_aiUsage';
  let st = SM.get(key, null);
  const month = getCurrentMonthYear();
  if (!st || st.monthYear !== month) {
    st = { monthYear: month, callsCount: 0, estimatedCostEUR: 0, byFeature: {}, byFeatureCost: {}, byProvider: {}, byProviderCost: {} };
  }
  st.byProvider = st.byProvider || {}; st.byProviderCost = st.byProviderCost || {};
  const p = getPricingFor(model, providerId);
  const cost = ((usage.prompt_tokens || 0) * p.in + (usage.completion_tokens || 0) * p.out) / 1000;
  st.callsCount++;
  st.estimatedCostEUR += cost;
  st.byFeature[feature] = (st.byFeature[feature] || 0) + 1;
  st.byFeatureCost[feature] = (st.byFeatureCost[feature] || 0) + cost;
  if (providerId) {
    st.byProvider[providerId] = (st.byProvider[providerId] || 0) + 1;
    st.byProviderCost[providerId] = (st.byProviderCost[providerId] || 0) + cost;
  }
  SM.set(key, st);
}
function getAIUsage() {
  const st = SM.get('fuel_aiUsage', null);
  if (!st || st.monthYear !== getCurrentMonthYear()) {
    return { monthYear: getCurrentMonthYear(), callsCount: 0, estimatedCostEUR: 0, byFeature: {}, byFeatureCost: {} };
  }
  return st;
}

/* ====================== Markdown safe renderer ====================== */
function renderMarkdownInto(container, text) {
  while (container.firstChild) container.removeChild(container.firstChild);
  const lines = String(text || '').split('\n');
  let listEl = null;
  for (const raw of lines) {
    const line = raw.replace(/\r/g, '');
    if (/^##\s+/.test(line)) {
      listEl = null;
      const h = document.createElement('h2');
      _appendInline(h, line.replace(/^##\s+/, ''));
      container.appendChild(h);
    } else if (/^###\s+/.test(line)) {
      listEl = null;
      const h = document.createElement('h3');
      _appendInline(h, line.replace(/^###\s+/, ''));
      container.appendChild(h);
    } else if (/^[-*]\s+/.test(line)) {
      if (!listEl) { listEl = document.createElement('ul'); container.appendChild(listEl); }
      const li = document.createElement('li');
      _appendInline(li, line.replace(/^[-*]\s+/, ''));
      listEl.appendChild(li);
    } else if (line.trim() === '') {
      listEl = null;
    } else {
      listEl = null;
      const p = document.createElement('p');
      _appendInline(p, line);
      container.appendChild(p);
    }
  }
}
function _appendInline(parent, text) {
  const parts = String(text).split(/(\*\*[^*\n]+\*\*|`[^`\n]+`|\[[A-C]\])/g);
  for (const part of parts) {
    if (!part) continue;
    if (/^\*\*.+\*\*$/.test(part)) {
      const b = document.createElement('strong');
      b.textContent = part.slice(2, -2);
      parent.appendChild(b);
    } else if (/^`.+`$/.test(part)) {
      const c = document.createElement('code');
      c.textContent = part.slice(1, -1);
      parent.appendChild(c);
    } else if (/^\[[A-C]\]$/.test(part)) {
      const e = document.createElement('em');
      e.textContent = part;
      parent.appendChild(e);
    } else {
      parent.appendChild(document.createTextNode(part));
    }
  }
}

/* =========================================================================
   ============== MODULE 11.5 — DEFERRED EFFECTS / RENDER POST ============
   ========================================================================= */
const _deferredMarkdownTargets = []; // [{ selector, text }]
const _deferredTextTargets = [];     // [{ selector, text }] — plain textContent
function queueMarkdownRender(selector, text) {
  _deferredMarkdownTargets.push({ selector, text });
}
function flushDeferredEffects() {
  while (_deferredMarkdownTargets.length) {
    const { selector, text } = _deferredMarkdownTargets.shift();
    const el = document.querySelector(selector);
    if (el) renderMarkdownInto(el, text);
  }
  while (_deferredTextTargets.length) {
    const { selector, text } = _deferredTextTargets.shift();
    const el = document.querySelector(selector);
    if (el) el.textContent = text;
  }
  // scroll chat to bottom
  const chat = document.querySelector('.coach-msg-list');
  if (chat) chat.scrollTop = chat.scrollHeight;
}

  const lastCheckin = (fs.weeklyCheckIns || []).slice(-1)[0];
  const out = [];
  if (acwr.ratio >= 1.3) out.push('Comment récupérer plus vite ?');
  if ((fs.activeCures || []).length > 0) {
    const c = fs.activeCures[0];
    const m = MICRONUTRIENTS.find(x => x.id === c.id);
    if (m) out.push('Pourquoi je prends ' + m.name + ' maintenant ?');
  }
  if (lastCheckin && lastCheckin.scores && lastCheckin.scores.crampes >= 4) out.push('J\'ai des crampes, que faire ?');
  out.push('Adapter ma cure si je pars en altitude');
  out.push('Explique-moi mon ACWR');
  return out.slice(0, 4);
}

/* Récupère l'historique complet des bilans (avec migration depuis l'ancien lastBloodTest). */
function getBloodTests() {
  const fs = getFuelState();
  let tests = fs.bloodTests || [];
  // Migration : si l'historique est vide mais qu'un ancien lastBloodTest existe, l'injecter.
  if (tests.length === 0 && fs.lastBloodTest && fs.lastBloodTest.parsedMarkers) {
    const migrated = {
      id: 'blood_legacy_' + (fs.lastBloodTest.date || todayISO()).replace(/-/g, ''),
      date: fs.lastBloodTest.date || todayISO(),
      raw: fs.lastBloodTest.raw || '',
      parsedMarkers: fs.lastBloodTest.parsedMarkers,
      parsedFull: fs.lastBloodTest.parsedFull || {},
      unrecognized: fs.lastBloodTest.unrecognized || [],
      analysis: fs.lastBloodAnalysis || '',
      createdAt: Date.now(),
    };
    tests = [migrated];
    fs.bloodTests = tests;
    setFuelState(fs);
  }
  // Ordonner du plus récent au plus ancien
  return tests.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
}
function getBloodTestById(id) {
  return getBloodTests().find(t => t.id === id) || null;
}

function getISOWeek(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - day);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  const weekNo = Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
  return date.getUTCFullYear() + '-W' + pad2(weekNo);
}

async function tryGenerateWeeklyDebrief() {
  if (!aiAvailable()) return false;
  const today = new Date();
  if (today.getDay() !== 0) return false; // dimanche uniquement
  const weekISO = getISOWeek(today);
  const fs = getFuelState();
  if ((fs.weeklyDebriefs || []).some(d => d.weekISO === weekISO)) return false;
  // ≥ 3 jours de données cette semaine
  const dailyLoad = getDailyLoad();
  let count = 0;
  for (let i = 0; i < 7; i++) { if (dailyLoad[isoDaysAgo(i)]) count++; }
  if (count < 3) return false;

  const ctx = buildUserContext();
  const lastWeekLoad = [];
  for (let i = 7; i < 14; i++) {
    const d = isoDaysAgo(i);
    lastWeekLoad.push([d, dailyLoad[d] || 0]);
  }

  const messages = [
    { role: 'system', content: `Génère le debrief hebdo personnalisé d'un coureur.

Format markdown (max 250 mots) :
## 📈 La semaine en chiffres
[3 lignes : volume km, sessions, ACWR évolution]
## 🎯 Ce qui a bien marché
[2 points concrets, données à l'appui]
## ⚠️ Ce qui mérite attention
[1-2 points avec reco actionnable]
## 🧬 Côté micronutriments
[Status cures actives, prises manquées, reco semaine prochaine]
## 🔮 Plan semaine prochaine
[3 actions prioritaires, ordre d'importance]

Ton : direct, motivant mais pas mielleux. Tutoiement.` },
    { role: 'user', content: 'CONTEXTE_USER:\n' + JSON.stringify(ctx, null, 2) + '\n\nCharge semaine précédente : ' + JSON.stringify(lastWeekLoad) + '\n\nGénère le debrief.' },
  ];

  const res = await askAI(messages, { feature: 'debrief', model: OPENROUTER_CONFIG.models.fast, temperature: 0.5, maxTokens: 1200 });
  if (!res.ok) return false;
  const fs2 = getFuelState();
  fs2.weeklyDebriefs = fs2.weeklyDebriefs || [];
  fs2.weeklyDebriefs.push({
    weekISO,
    date: todayISO(),
    text: res.text,
  });
  if (fs2.weeklyDebriefs.length > 12) fs2.weeklyDebriefs = fs2.weeklyDebriefs.slice(-12);
  setFuelState(fs2);
  showToast('📊 Debrief de la semaine prêt', 'success');
  if (state.view === 'fuel') render();
  return true;
}

    // Add km to selected shoe
    if (fd.shoeId && fd.actualKm) addKmToShoe(fd.shoeId, Number(fd.actualKm) || 0);

    // Compute load (UA)
    const durationMin = (fd.actualDuration || sess.plannedDuration * 60) / 60;
    const load = Math.round(durationMin * fd.rpe * (fd.completion / 100));

      elevationUp: fd.elevationUp, elevationDown: fd.elevationDown,
      load,
      completedAt: todayISO(),
    });
    SM.set('sessions', sessions);

    // Update daily load
    addDailyLoad(todayISO(), load);

    // Record AI insight outcome (Feature #1)
    recordOutcomeForRecentInsights({ rpe: fd.rpe, completion: fd.completion, load, pain: fd.pain, actualKm: fd.actualKm }, ref.weekIdx, sess.dayIndex);

    // XP
    const durMin = (sess.actualDuration || 0) / 60;
    const xpMap = {
      easy: 30 + 3 * sess.actualKm,
      endurance: 35 + 3 * sess.actualKm,
      tempo: 50 + 5 * sess.actualKm,
      interval: 60 + 6 * sess.actualKm,
      marathon: 55 + 5 * sess.actualKm,
      long: 80 + 4 * sess.actualKm,
      walk: 20 + 2 * sess.actualKm,
      strength: 40 + Math.round(durMin),
    };
    XPBridge.addXP(Math.round(xpMap[sess.type] || 30));

    // Apply adaptive rules
    const adaptMessages = applyAdaptiveRules(plan, ref.weekIdx, ref.sessionIdx, fd);
    SM.set('plan', plan);

    // Check if week complete -> auto advance
    const weekRunning = plan.planData.weeks[ref.weekIdx].sessions.filter(s => s.type !== 'rest');
    const allDone = weekRunning.length > 0 && weekRunning.every(s => s.completed);
    if (allDone && plan.currentWeek === ref.weekIdx + 1 && plan.currentWeek < plan.planData.weeks.length) {
      plan.currentWeek += 1;
      SM.set('plan', plan);
    }
    // Check plan completion
    const allWeeksDone = plan.planData.weeks.every(w => w.sessions.filter(s => s.type !== 'rest').every(s => s.completed));
    if (allWeeksDone && plan.status !== 'completed') {
      plan.status = 'completed';

    state.modal = null;
    state.currentSessionRef = null;

    // Auto-ouvrir la reco nutrition post-séance (Phase 1)

      setTimeout(() => {

  applyAIGeneratedWeek() {

    const newSessions = [];
    for (let d = 0; d < 7; d++) {

    if (log.length > 60) log.splice(0, log.length - 60);

  exportCalendar() {
    const plan = SM.get('plan');
    if (!plan || !plan.planData) { showToast('Aucun plan à exporter', 'error'); return; }
    const start = plan.startDate ? new Date(plan.startDate) : new Date();
    const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Motion//FR'];
    plan.planData.weeks.forEach((wk, wi) => {
      wk.sessions.forEach(s => {
        if (s.type === 'rest') return;
        const d = new Date(start.getTime() + (wi*7 + s.dayIndex) * 86400000);
        const ds = d.toISOString().slice(0,10).replace(/-/g,'');
        const uid = `motion-${plan.id}-${wi}-${s.dayIndex}@local`;
        lines.push('BEGIN:VEVENT', `UID:${uid}`, `DTSTART;VALUE=DATE:${ds}`, `DTEND;VALUE=DATE:${ds}`,
          `SUMMARY:${typeIcon(s.type)} ${typeLabel(s.type)} ${s.plannedKm}km`,
          `DESCRIPTION:${s.plannedDuration}min · ${formatPace(s.pace)}/km${s.aiNotes?' · '+s.aiNotes.replace(/\n/g,' '):''}`,
          'END:VEVENT');
      });
    });
    lines.push('END:VCALENDAR');
    const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'motion-plan.ics'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast('📅 plan.ics téléchargé', 'success');
  },

  async fetchRoutes() {
    const geo = SM.get('lastGeo', null);
    if (!geo) {
      const g = await new Promise(res => navigator.geolocation?.getCurrentPosition(p => res({lat:p.coords.latitude,lon:p.coords.longitude,ts:Date.now()}), () => res(null), {timeout:8000}));
      if (g) SM.set('lastGeo', g);
      else { state.routes = { loading: false, items: [], error: 'Géolocalisation refusée' }; state.modal = 'routes'; render(); return; }
    }
    const g = SM.get('lastGeo');
    state.routes = { loading: true, items: [], error: null };
    state.modal = 'routes';
    render();
    const radius = 2500;
    const q = `[out:json][timeout:25];(node["leisure"="park"](around:${radius},${g.lat},${g.lon});way["leisure"="park"](around:${radius},${g.lat},${g.lon});node["leisure"="track"](around:${radius},${g.lat},${g.lon});way["leisure"="track"](around:${radius},${g.lat},${g.lon});node["amenity"="drinking_water"](around:${radius},${g.lat},${g.lon});node["amenity"="toilets"](around:${radius},${g.lat},${g.lon}););out center 40;`;
    const endpoints = [
      'https://overpass-api.de/api/interpreter',
      'https://overpass.kumi.systems/api/interpreter',
      'https://overpass.openstreetmap.fr/api/interpreter',
    ];
    let lastErr = null;
    for (const ep of endpoints) {
      try {
        const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 12000);
        const r = await fetch(ep, { method: 'POST', body: 'data=' + encodeURIComponent(q), headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, signal: ctrl.signal });
        clearTimeout(to);
        if (!r.ok) { lastErr = 'HTTP ' + r.status; continue; }
        const j = await r.json();
        const items = (j.elements || []).map(e => {
          const lat = e.lat || (e.center && e.center.lat); const lon = e.lon || (e.center && e.center.lon);
          if (lat == null || lon == null) return null;
          const dx = (lat - g.lat) * 111000;
          const dy = (lon - g.lon) * 111000 * Math.cos(g.lat * Math.PI/180);
          const distM = Math.round(Math.sqrt(dx*dx + dy*dy));
          let icon = '📍', tag = '';
          if (e.tags?.leisure === 'park') { icon = '🌳'; tag = 'Parc'; }
          else if (e.tags?.leisure === 'track') { icon = '🏃'; tag = 'Piste athlé'; }
          else if (e.tags?.amenity === 'drinking_water') { icon = '🚰'; tag = 'Fontaine'; }
          else if (e.tags?.amenity === 'toilets') { icon = '🚻'; tag = 'Toilettes'; }
          return { name: e.tags?.name || tag, distM, tag, icon };
        }).filter(x => x && x.distM > 0).sort((a,b) => a.distM - b.distM);
        state.routes = { loading: false, items, error: null };
        render();
        return;
      } catch (e) {
        lastErr = e?.name === 'AbortError' ? 'timeout' : 'réseau';
      }
    }
    state.routes = { loading: false, items: [], error: 'Overpass injoignable (' + lastErr + ') — ressaie dans 30s' };
    render();
  },

  async runWeekAnalysis(weekIdx) {
    if (!aiAvailable()) { showToast('IA indisponible : configure ta clé OpenRouter (Fuel → IA)', 'error'); return; }
    const plan = SM.get('plan');
    if (!plan || !plan.planData || !plan.planData.weeks[weekIdx]) { showToast('Semaine introuvable', 'error'); return; }
    const wk = plan.planData.weeks[weekIdx];
    state.weekAnalysis = { loading: true, result: null, error: null, weekIdx };
    state.modal = 'weekAnalysis';
    render();

    // Build week summary
    const weekSessions = (wk.sessions || []).map(s => ({
      day: DAY_SHORT[s.dayIndex],
      type: s.type,
      plannedKm: s.plannedKm || 0,
      plannedMin: s.plannedDuration || 0,
      pace: s.pace || 0,
      done: !!s.completed,
      actualKm: s.actualKm || 0,
      actualMin: Math.round((s.actualDuration||0)/60),
      rpe: s.rpe || 0,
      completion: s.completion || 0,
      pain: s.pain || 'none',
      load: s.load || 0,
      notes: (s.notes||'').slice(0, 120),
    }));
    const completedCount = weekSessions.filter(s => s.done).length;
    const plannedCount = weekSessions.filter(s => s.type !== 'rest').length;
    const totalPlannedKm = weekSessions.reduce((a, s) => a + (s.plannedKm||0), 0);
    const totalActualKm = weekSessions.reduce((a, s) => a + (s.actualKm||0), 0);
    const avgRpe = (() => {
      const done = weekSessions.filter(s => s.done && s.rpe);
      return done.length ? (done.reduce((a, s) => a + s.rpe, 0) / done.length).toFixed(1) : null;
    })();
    const acwr = calculateACWR();
    const slim = (typeof buildSlimContext === 'function') ? buildSlimContext() : null;

    const sys = `Coach running expert. Analyse une semaine d'entraînement (passée, en cours ou planifiée) et fournis un retour concret. Ton: factuel, bienveillant, direct. Français.

JSON UNIQUEMENT (pas de markdown):

  "warnings": ["alerte ou risque détecté", "..."] | [],
  "load_assessment": "2-3 lignes sur la charge cumulée, ACWR, fatigue/récupération",
  "recommendations": ["reco concrète pour la suite", "..."]
}`;
    const usr = `SEMAINE_${weekIdx+1}:${JSON.stringify({ completedCount, plannedCount, totalPlannedKm, totalActualKm, avgRpe, sessions: weekSessions })}
ACWR:${JSON.stringify({ ratio: Math.round(acwr.ratio*100)/100, zone: acwrZone(acwr.ratio).label })}
${slim ? 'CTX:' + JSON.stringify(slim) : ''}`;

    const res = await askAI(
      [{ role: 'system', content: sys }, { role: 'user', content: usr }],
      { feature: 'week_analysis', model: OPENROUTER_CONFIG.models.fast, expectJSON: true, maxTokens: 1100, temperature: 0.4 }
    );
    if (!res.ok) {
      state.weekAnalysis = { loading: false, result: null, error: aiErrorMsg(res.reason || 'inconnue'), weekIdx };

  async testAllFreeModels() {
    const cfg = getAIConfig();
    const key = cfg.providers.openrouter?.key;
    if (!key) { showToast('Aucune clé OpenRouter configurée', 'error'); return; }
    // Liste des modèles à tester (stables payants + gratuits courants)
    const all = [
      { id: 'openai/gpt-4o-mini', tier: 'fast' },
      { id: 'google/gemini-2.0-flash-001', tier: 'fast' },
      { id: 'google/gemini-flash-1.5-8b', tier: 'fast' },
      { id: 'anthropic/claude-3-5-haiku', tier: 'fast' },
      { id: 'mistralai/mistral-small-latest', tier: 'fast' },
      { id: 'google/gemini-2.0-flash-exp:free', tier: 'fast' },
      { id: 'google/gemma-2-9b-it:free', tier: 'fast' },
      { id: 'meta-llama/llama-3.1-8b-instruct:free', tier: 'fast' },
      { id: 'meta-llama/llama-3.3-70b-instruct:free', tier: 'deep' },
      { id: 'qwen/qwen-2.5-72b-instruct:free', tier: 'deep' },
      { id: 'meta-llama/llama-3.3-70b-instruct', tier: 'deep' },
      { id: 'anthropic/claude-sonnet-4.6', tier: 'deep' },
    ];
    state.aiProvSettings.modelTestResults = [];
    render();
    showToast('🧪 Test en cours (~30s)...', 'info');
    // Référence valide : utilise location.origin si HTTPS, sinon "https://motion.app"
    const referer = (location.protocol === 'https:' && location.origin) ? location.origin : 'https://motion.app';
    for (const m of all) {
      let attempt = 0;
      let result = null;
      // Jusqu'à 2 tentatives par modèle (1 retry après rate limit)
      while (attempt < 2 && !result) {
        attempt++;
        try {
          const ctrl = new AbortController();
          const to = setTimeout(() => ctrl.abort(), 15000);
          const r = await fetch('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Authorization': 'Bearer ' + key,
              'Content-Type': 'application/json',
              'HTTP-Referer': referer,
              'X-Title': 'Motion',
            },
            body: JSON.stringify({
              model: m.id,
              messages: [{ role: 'user', content: 'Réponds juste "ok"' }],
              max_tokens: 32,
              temperature: 0,
            }),
            signal: ctrl.signal,
          });
          clearTimeout(to);
          let bodyText = '';
          try { bodyText = await r.text(); } catch (_) {}
          let bodyJson = null;
          try { bodyJson = JSON.parse(bodyText); } catch (_) {}
          if (r.ok) {
            // Vérifie qu'il y a vraiment du contenu (pas juste 200 avec erreur dans le body)
            if (bodyJson?.error) {
              result = { ok: false, err: (bodyJson.error.message || bodyJson.error.code || 'erreur').toString().slice(0,40) };
            } else if (bodyJson?.choices?.[0]?.message) {
              result = { ok: true, err: '' };
            } else {
              result = { ok: false, err: 'réponse vide' };
            }
          } else if (r.status === 429) {
            // Rate limit : retry après 4s
            if (attempt === 1) {
              await new Promise(res => setTimeout(res, 4500));
              continue;
            }
            result = { ok: false, err: 'rate limit' };
          } else if (r.status === 404) {
            result = { ok: false, err: '404 introuvable' };
          } else if (r.status === 402) {
            result = { ok: false, err: 'crédit insuffisant' };
          } else if (r.status === 401 || r.status === 403) {
            result = { ok: false, err: 'clé refusée' };
          } else {
            const detail = bodyJson?.error?.message ? ' ' + String(bodyJson.error.message).slice(0,30) : '';
            result = { ok: false, err: 'http ' + r.status + detail };
          }
        } catch (e) {
          result = { ok: false, err: e?.name === 'AbortError' ? 'timeout' : 'réseau' };
        }
      }
      state.aiProvSettings.modelTestResults.push({ model: m.id, tier: m.tier, ok: result.ok, err: result.err });
      render();
      // Délai entre 2 modèles : 2.5s pour respecter les limites OpenRouter free tier
      await new Promise(res => setTimeout(res, 2500));
    }
    // Auto-applique le 1er modèle qui marche (l'ordre de la liste reflète déjà la préférence)
    const fastOk = state.aiProvSettings.modelTestResults.filter(r => r.ok && r.tier === 'fast');
    const deepOk = state.aiProvSettings.modelTestResults.filter(r => r.ok && r.tier === 'deep');
    if (fastOk.length || deepOk.length) {
      const cfg2 = getAIConfig();
      if (fastOk[0]) cfg2.providers.openrouter.fastModel = fastOk[0].model;
      if (deepOk[0]) cfg2.providers.openrouter.deepModel = deepOk[0].model;
      setAIConfig(cfg2);
      showToast(`✓ Appliqué : ${fastOk[0]?.model.split('/').pop()||'-'} + ${deepOk[0]?.model.split('/').pop()||'-'}`, 'success');
    } else {
      // Diagnostic : si TOUTES en rate limit, le compte est juste limité maintenant
      const allRateLimit = state.aiProvSettings.modelTestResults.every(r => r.err && r.err.includes('rate'));
      if (allRateLimit) {
        showToast('⏳ Toutes en rate limit. Patiente 1-2 min puis re-teste.', 'warning');
      } else {
        const allKeyRefused = state.aiProvSettings.modelTestResults.every(r => r.err && (r.err.includes('clé') || r.err.includes('401') || r.err.includes('403')));
        if (allKeyRefused) showToast('🔑 Clé refusée par OpenRouter. Vérifie qu\'elle est valide.', 'error');
        else showToast('Aucun modèle gratuit ne répond — vois les détails dans la liste', 'error');
      }
    }
    render();
  },

      cmj: r.cmj ? Number(r.cmj) : null,
      hrLying: r.hrLying ? Number(r.hrLying) : null,
      hrStanding: r.hrStanding ? Number(r.hrStanding) : null,
      weight: r.weight ? Number(r.weight) : null,
      score,
    };
    if (idx >= 0) log[idx] = entry; else log.push(entry);
    // keep last 180 days (besoin d'historique long pour les baselines)
    const cutoff = Date.now() - 180 * 86400 * 1000;
    const trimmed = log.filter(e => new Date(e.date).getTime() >= cutoff);
    SM.set('readinessLog', trimmed);
    state.modal = null;
    state.modalStack = [];

    this._pushPrevModal();

    state.modal = 'vdotRecalibrate';

  setVdotTestField(key, val) {
    state.vdotTest[key] = val;

  submitVdotTest() {
    const t = state.vdotTest;
    let computed = null;
    let summary = '';
    if (t.kind === 'cooper' && t.distance) {
      computed = vdotFromCooperMeters(parseInt(t.distance));
      summary = `Cooper 12' : ${t.distance} m`;
    } else if (t.kind === '5k' && (t.timeMin || t.timeSec)) {
      const sec = (parseInt(t.timeMin)||0)*60 + (parseInt(t.timeSec)||0);
      if (sec > 600) { computed = calculateVDOT(5, sec); summary = `5K en ${t.timeMin||0}:${String(t.timeSec||0).padStart(2,'0')}`; }
    } else if (t.kind === '10k' && (t.timeMin || t.timeSec)) {
      const sec = (parseInt(t.timeMin)||0)*60 + (parseInt(t.timeSec)||0);
      if (sec > 1800) { computed = calculateVDOT(10, sec); summary = `10K en ${t.timeMin||0}:${String(t.timeSec||0).padStart(2,'0')}`; }
    }
    if (!computed) { showToast('Données invalides', 'error'); return; }
    const profile = SM.get('profile');
    if (!profile) { showToast('Profil introuvable', 'error'); return; }
    const oldVdot = profile.vdot;
    profile.vdot = computed;
    SM.set('profile', profile);
    // Mettre à jour les paces des futures séances non complétées du plan en cours
    const plan = SM.get('plan');
    if (plan && plan.planData) {
      plan.planData.weeks.forEach((wk, wi) => {
        if (wi < (plan.currentWeek - 1)) return; // semaines passées : intactes
        wk.sessions.forEach(s => {
          if (s.completed) return;
          if (isCardioType(s.type)) s.pace = getPaceForType(computed, s.type);
        });
      });
      SM.set('plan', plan);
    }
    const tests = SM.get('vdotTests', []);
    tests.push({ date: todayISO(), kind: t.kind, summary, oldVdot, newVdot: computed });
    SM.set('vdotTests', tests);
    state.modal = null;
    state.modalStack = [];
    render();
    showToast(`✓ VDOT mis à jour : ${oldVdot} → ${computed}`, 'success');
  },

  async sendChatPlanned() {
    const c = state.chatPlanned;
    if (!c) return;
    if (!aiAvailable()) { showToast('IA indisponible', 'error'); return; }
    const inp = document.getElementById('chat-planned-input');
    const text = inp ? inp.value.trim() : '';
    if (!text) return;
    c.messages.push({ role: 'user', content: text });
    c.loading = true;
    c.pendingChanges = null;
    if (inp) inp.value = '';
    render();

    const plan = SM.get('plan');
    const sess = plan.planData.weeks[c.ref.weekIdx].sessions[c.ref.sessionIdx];
    const slimCtx = buildSlimContext();
    const sys = `Coach running. L'utilisateur veut modifier une séance planifiée. Comprends sa demande, propose des modifications JSON ou pose une question de clarif.

SÉANCE: ${JSON.stringify({type:sess.type,km:sess.plannedKm,dur:sess.plannedDuration,pace:sess.pace,day:sess.dayIndex,notes:sess.aiNotes||null})}
TYPES: easy, endurance, tempo, interval, marathon, long, walk, strength, rest

JSON UNIQUEMENT:
{"reply":"réponse courte","changes":null|{"type"?,"plannedKm"?,"plannedDuration"?,"pace"?,"dayIndex"?(0=Dim..6=Sam),"aiNotes"?}}
- Demande claire → "changes" rempli
- Besoin d'info → "changes":null + question dans reply`;

    const messages = [{ role: 'system', content: sys }];
    c.messages.forEach(m => messages.push({ role: m.role, content: m.content }));
    const res = await askAI(messages, {
      feature: 'chat_planned', model: OPENROUTER_CONFIG.models.fast,
      expectJSON: true, maxTokens: 800, temperature: 0.4,
    });
    c.loading = false;
    if (!res.ok) {
      c.messages.push({ role: 'assistant', content: '❌ Erreur IA : ' + (res.reason || 'inconnue') });
    } else {
      const r = res.data || {};
      c.messages.push({ role: 'assistant', content: r.reply || '...' });
      if (r.changes && typeof r.changes === 'object') c.pendingChanges = r.changes;
    }
    render();
  },
  acceptChatChanges() {
    const c = state.chatPlanned;
    if (!c || !c.pendingChanges || !c.ref) return;
    const plan = SM.get('plan');
    const wk = plan.planData.weeks[c.ref.weekIdx];
    const sess = wk.sessions[c.ref.sessionIdx];
    const ch = c.pendingChanges;
    // Si dayIndex change : swap avec le slot cible (logique identique à movePlanned)
    if (ch.dayIndex != null && ch.dayIndex !== c.ref.sessionIdx) {
      const dst = wk.sessions[ch.dayIndex];
      if (dst && !dst.completed) {
        wk.sessions[c.ref.sessionIdx] = Object.assign({}, dst, { dayIndex: c.ref.sessionIdx });
        wk.sessions[ch.dayIndex] = Object.assign({}, sess, { dayIndex: ch.dayIndex });
        c.ref.sessionIdx = ch.dayIndex;
      }
    }
    const target = wk.sessions[c.ref.sessionIdx];
    ['type','plannedKm','plannedDuration','pace','aiNotes'].forEach(k => {
      if (ch[k] != null) target[k] = ch[k];
    });
    target.aiAdjusted = true;
    SM.set('plan', plan);
    c.pendingChanges = null;
    c.messages.push({ role: 'assistant', content: '✓ Modifications appliquées.' });
    render();
    showToast('✓ Séance mise à jour par l\'IA', 'success');

    const plan = SM.get('plan');
    const wk = plan.planData.weeks[ref.weekIdx];
    if (!wk) return;
    const src = wk.sessions[ref.sessionIdx];
    const dst = wk.sessions[targetDayIdx];
    if (!src || !dst) return;
    if (dst.completed) { showToast('Le jour cible contient une séance déjà réalisée', 'error'); return; }
    if (targetDayIdx === ref.sessionIdx) { state.modal = null; render(); return; }
    // Échange complet : place src sur targetDayIdx et dst sur ref.sessionIdx
    wk.sessions[ref.sessionIdx] = Object.assign({}, dst, { dayIndex: ref.sessionIdx });
    wk.sessions[targetDayIdx]   = Object.assign({}, src, { dayIndex: targetDayIdx });

    state.movePlanned = null;

    const next = cur === 'light' ? 'dark' : 'light';

    try { localStorage.setItem('pace.theme', next); } catch (e) {}

  async forceRefresh() {
    const btn = document.getElementById('force-refresh-btn');
    if (btn) { btn.classList.add('spin'); btn.disabled = true; }
    try {
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }
    } catch (e) {}
    const url = new URL(window.location.href);
    url.searchParams.set('_cb', Date.now().toString(36));
    window.location.replace(url.toString());

  closeModal() {
    // Pop modal stack first if any (return to previous modal)
    if (state.modalStack && state.modalStack.length > 0) {
      const prev = state.modalStack.pop();
      state.modal = prev.modal;
      state.modalData = prev.modalData;
      if (prev.currentSessionRef !== undefined) state.currentSessionRef = prev.currentSessionRef;
      if (prev.editPlannedRef !== undefined) state.editPlannedRef = prev.editPlannedRef;
      if (prev.helpKey !== undefined) state.helpKey = prev.helpKey;
      render();
      return;
    }
    state.modal = null;
    state.modalData = null;
    state.helpKey = null;
    if (state._queuedBadges && state._queuedBadges.length > 0) {
      const next = state._queuedBadges.shift();
      setTimeout(() => {
        state.modal = 'badgeUnlock';
        state.modalData = next;
        render();
      }, 300);
    }
    render();

  goBack() {
    // Programmatic back: closes modal if any, else navigates between views
    if (state.modal) { this.closeModal(); return; }
    // No modal: try to step back the wizard, or fall back to home view
    if (state.view === 'wizard' && state.wizardStep > 1) {
      state.wizardStep -= 1;
      render();
      return;
    }
    if (state.view !== 'home') {
      state.view = 'home';
      render();
    }

  _pushPrevModal() {
    // Snapshot current modal context so closeModal pops back to it.
    if (!state.modal) {
      // No active modal: any stale stack entries (from prior save/close flows that
      // bypassed closeModal) are no longer valid parents. Discard them.
      state.modalStack = [];
      return;
    }
    state.modalStack = state.modalStack || [];
    state.modalStack.push({
      modal: state.modal,
      modalData: state.modalData,
      currentSessionRef: state.currentSessionRef,
      editPlannedRef: state.editPlannedRef,
      helpKey: state.helpKey,
    });

  async sendCoachMessage() {
    const text = _fuelUI.coachInput.trim();

      showToast('Coach IA indisponible — vérifie ta clé', 'warning');

    if (fs.coachHistory.length > 50) fs.coachHistory = fs.coachHistory.slice(-50);

    _fuelUI.coachInput = '';
    _fuelUI.coachPending = true;

    const ctx = buildUserContext();
    const recent = fs.coachHistory.slice(-12); // 6 last exchanges = 12 messages max
    const messages = [
      { role: 'system', content: COACH_SYSTEM_PROMPT },
      { role: 'system', content: 'CONTEXTE_USER:\n' + JSON.stringify(ctx, null, 2) },
      ...recent.map(m => ({ role: m.role, content: m.content })),
    ];

    const res = await askAI(messages, { feature: 'coach', model: OPENROUTER_CONFIG.models.fast, temperature: 0.4, maxTokens: 700 });
    _fuelUI.coachPending = false;

  bloodSetText(t) { _fuelUI.bloodInputText = t; /* no rerender */ },
  async bloodLoadPdf(file) {
    if (!file) return;
    if (file.type && file.type !== 'application/pdf' && !/\.pdf$/i.test(file.name || '')) {
      showToast('Fichier non PDF', 'error');
      return;
    }
    if (file.size > 25 * 1024 * 1024) {
      showToast('PDF trop lourd (>25 Mo)', 'error');
      return;
    }
    _fuelUI.bloodPdfPending = true;
    _fuelUI.bloodPdfStatus = 'Chargement de la lib PDF...';
    render();
    try {
      const pdfjs = await loadPDFJS();
      _fuelUI.bloodPdfStatus = 'Lecture du PDF...';
      render();
      const ab = await file.arrayBuffer();
      const pdf = await pdfjs.getDocument({ data: ab }).promise;
      const numPages = pdf.numPages || 0;
      let text = '';
      for (let p = 1; p <= numPages; p++) {
        _fuelUI.bloodPdfStatus = `Extraction page ${p}/${numPages}...`;
        // Re-render only every other page to avoid flicker
        if (p === 1 || p === numPages || p % 3 === 0) render();
        const page = await pdf.getPage(p);
        const content = await page.getTextContent();
        // Reconstruct lines from items: PDF.js streams items by position;
        // join with space, insert newlines between items that look line-broken.
        const items = content.items || [];
        let lastY = null;
        let line = '';
        const lines = [];
        for (const it of items) {
          const y = it.transform ? it.transform[5] : null;
          if (lastY != null && y != null && Math.abs(y - lastY) > 2) {
            if (line.trim()) lines.push(line.trim());
            line = '';
          }
          line += (it.str || '') + ' ';
          lastY = y;
        }
        if (line.trim()) lines.push(line.trim());
        text += lines.join('\n') + '\n\n';
      }
      const cleaned = text.replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
      if (!cleaned) {
        _fuelUI.bloodPdfPending = false;
        _fuelUI.bloodPdfStatus = "Aucun texte détecté — c'est peut-être un PDF scanné. Photo le bilan et utilise un OCR, puis colle le texte.";
        render();
        return;
      }
      // Append (or replace if textarea was empty)
      const existing = (_fuelUI.bloodInputText || '').trim();
      _fuelUI.bloodInputText = existing ? (existing + '\n\n' + cleaned) : cleaned;
      _fuelUI.bloodPdfPending = false;
      _fuelUI.bloodPdfStatus = `✓ ${numPages} page${numPages > 1 ? 's' : ''} extraite${numPages > 1 ? 's' : ''} (${cleaned.length} caractères) — vérifie et clique « Analyser ».`;
      render();
      // Scroll textarea to top so user sees the start
      setTimeout(() => {
        const ta = document.getElementById('blood-text-area');
        if (ta) { ta.scrollTop = 0; }
      }, 50);
    } catch (e) {
      console.error('PDF extract error', e);
      _fuelUI.bloodPdfPending = false;
      _fuelUI.bloodPdfStatus = '❌ Erreur de lecture du PDF : ' + (e.message || 'inconnue');
      render();
      showToast('Erreur lecture PDF', 'error');
    }
    // Reset the file input so re-selecting the same file works
    const inp = document.getElementById('blood-pdf-input');
    if (inp) inp.value = '';
  },
  bloodToggleConsent() {
    _fuelUI.bloodConsentChecked = !_fuelUI.bloodConsentChecked;
    render();
  },
  async analyzeBloodWithAI() {
    if (!_fuelUI.bloodConsentChecked) { showToast('Coche la confirmation d\'envoi', 'warning'); return; }
    if (!aiAvailable()) { showToast('IA indisponible', 'warning'); return; }
    const text = _fuelUI.bloodInputText.trim();
    if (!text) return;
    _fuelUI.bloodPending = true;
    render();

    // PASS 1 — extraction
    // Tronque l'input (PDF parfois très long → token explosion). Garde 12k caractères max.
    const inputForParse = text.length > 12000 ? text.slice(0, 12000) + '\n[...tronqué...]' : text;
    const parseRes = await askAI([
      { role: 'system', content: BLOOD_PARSE_PROMPT },
      { role: 'user', content: inputForParse },
    ], { feature: 'blood_parse', model: OPENROUTER_CONFIG.models.fast, temperature: 0.1, maxTokens: 2000, expectJSON: true });

    if (!parseRes.ok) {
      _fuelUI.bloodPending = false;
      render();
      const rawSnippet = parseRes.raw ? ' — réponse: ' + String(parseRes.raw).slice(0, 200) : '';
      const reason = parseRes.reason === 'json_parse'
        ? "le modèle n'a pas renvoyé de JSON valide. Réessaie ou change de modèle dans Fuel → IA."
        : (parseRes.reason || '?');
      console.error('Blood parse error', parseRes);
      showToast('Erreur extraction : ' + reason, 'error');
      if (parseRes.raw) console.log('AI raw response:', parseRes.raw);
      return;
    }
    const parsed = parseRes.data || {};
    const markers = parsed.markers || {};
    const unrec = parsed.unrecognized || [];

    // Normalize parsedMarkers to flat values for engine
    const flatMarkers = {};
    Object.keys(markers).forEach(k => {
      if (markers[k] && markers[k].value != null) flatMarkers[k] = markers[k].value;
    });

    // Aberrant value warning
    if (flatMarkers.ferritin && (flatMarkers.ferritin > 1000 || flatMarkers.ferritin < 0)) {
      const ok = confirm('Ferritine = ' + flatMarkers.ferritin + ' ng/mL — valeur inhabituelle. Continuer ?');
      if (!ok) { _fuelUI.bloodPending = false; render(); return; }
    }
    if (unrec.length > 5) {
      showToast('⚠️ ' + unrec.length + ' lignes non reconnues — vérifier la saisie', 'warning');
    }

    // PASS 2 — interprétation
    const ctx = buildUserContext();
    const interpRes = await askAI([
      { role: 'system', content: BLOOD_INTERPRET_PROMPT },
      { role: 'user', content: 'BILAN_PARSÉ:\n' + JSON.stringify(parsed, null, 2) + '\n\nCONTEXTE_USER:\n' + JSON.stringify(ctx, null, 2) },
    ], { feature: 'blood_interpret', model: OPENROUTER_CONFIG.models.fast, temperature: 0.3, maxTokens: 1500 });

    _fuelUI.bloodPending = false;
    if (!interpRes.ok) {
      render();
      showToast('Erreur interprétation : ' + (interpRes.reason || '?'), 'error');
      return;
    }

    // Persist : pousse dans l'historique + maintient lastBloodTest pour la rétrocompat
    const fs = getFuelState();
    const newEntry = {
      id: 'blood_' + Date.now(),
      date: parsed.date || todayISO(),
      raw: text.slice(0, 4000),
      parsedMarkers: flatMarkers,
      parsedFull: markers,
      unrecognized: unrec,
      analysis: interpRes.text,
      createdAt: Date.now(),
    };
    fs.bloodTests = (fs.bloodTests || []).concat([newEntry]);
    // backward-compat fields utilisés par d'autres modules
    fs.lastBloodTest = {
      date: newEntry.date,
      raw: newEntry.raw,
      parsedMarkers: newEntry.parsedMarkers,
      parsedFull: newEntry.parsedFull,
      unrecognized: newEntry.unrecognized,
    };
    fs.lastBloodAnalysis = newEntry.analysis;
    setFuelState(fs);
    XPBridge.addXP(50);
    _fuelUI.bloodInputText = '';
    _fuelUI.bloodConsentChecked = false;
    _fuelUI.bloodPdfStatus = '';
    _fuelUI.bloodViewingId = newEntry.id;
    render();
    showToast('✓ Bilan analysé et ajouté à l\'historique', 'success');
  },

/* ====================== Bootstrap ====================== */
function init() {
  // Sync theme toggle icon with whatever the head script applied pre-paint
  const themeBtn = document.getElementById('theme-toggle-btn');
  if (themeBtn) {
    const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    themeBtn.textContent = cur === 'light' ? '☀️' : '🌙';
  }
  const profile = SM.get('profile');
  const plan = SM.get('plan');
  if (profile && plan) {
    state.view = 'home';
  } else {
    state.view = 'welcome';
    // restore wizard if available
    const saved = SM.get('wizardState');
    if (saved && saved.savedAt && (Date.now() - saved.savedAt) < 24 * 3600 * 1000 && saved.data && saved.step) {
      // do not auto-jump to wizard; just have data ready in startWizard
    }
  }
  render();
  console.log('🏃 Pace standalone ready. Use App._debug.* for testing.');

  /* AI: réagir aux clés invalidées en cours de session */
  window.addEventListener('ai:keyInvalid', () => {
    showToast('Clé OpenRouter invalide ou expirée', 'error');
    if (state.view === 'fuel') render();
  });

  /* Pricing freshness check (>90j → toast discret) */
  try {
    const last = new Date(PRICING_LAST_UPDATED).getTime();
    if (Date.now() - last > 90 * 86400 * 1000) {
      setTimeout(() => showToast('ⓘ Tarifs IA peut-être obsolètes — vérifie openrouter.ai/models', 'warning'), 1500);
    }
  } catch (_) {}

  /* Tentative debrief hebdo (asynchrone, silencieux) */
  if (profile && plan) {
    setTimeout(() => { tryGenerateWeeklyDebrief().catch(() => {}); }, 2500);
  }

  /* Premier lancement après onboarding terminé : ouvre le guide de démarrage */
  if (profile && plan && !SM.get('guideViewed', false) && !state.modal) {
    setTimeout(() => {
      if (!state.modal) {
        state.modal = 'startupGuide';
        state.guideStep = 0;
        render();
      }
    }, 800);
  }

  /* Long-press sur une séance du programme → modale Déplacer */
  setupLongPressHandlers();

  /* Back nav (history/escape/swipe-down) */
  setupBackNavHandlers();

  /* Détecteurs auto : abandon, surentraînement, tapering, PR, supplémentation, carb-loading */
  setTimeout(() => {
    if (state.modal) return;
    const plan = SM.get('plan'); const sessions = SM.get('sessions', []);
    if (!plan) return;
    const today = todayISO();
    const sevenDaysAgo = new Date(); sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
    const sevenISO = sevenDaysAgo.toISOString().slice(0,10);

    // 1. Abandon (1× par 7 jours)
    const lastAb = SM.get('lastAbandonAlert', null);
    if (!lastAb || lastAb < sevenISO) {
      const ab = detectAbandonRisk(plan);
      if (ab) { state.modal = 'abandonAlert'; state.modalData = ab; render(); return; }
    }
    // 2. Surentraînement (1× par 5 jours)
    const lastOt = SM.get('lastOvertrainingAlert', null);
    if (!lastOt || (new Date(today) - new Date(lastOt)) > 5 * 86400000) {
      const ot = detectOvertraining(plan, sessions);
      if (ot) { state.modal = 'overtrainingAlert'; state.modalData = ot; render(); return; }
    }
    // 3. Tapering (1× par course)
    const tap = detectTaperingDue();
    const lastTap = SM.get('lastTaperingApplied', null);
    if (tap && (!lastTap || (new Date(today) - new Date(lastTap)) > 3 * 86400000)) {
      state.modal = 'taperingProposal'; state.modalData = tap; render(); return;
    }
    // 4. Carb-loading
    const cl = detectCarbLoading();
    const lastCl = SM.get('lastCarbLoadingShown', null);
    if (cl && (!lastCl || lastCl < today)) {
      SM.set('lastCarbLoadingShown', today);
      state.modal = 'carbLoading'; state.modalData = cl; render(); return;
    }
    // 5. PR (toujours après une nouvelle séance)
    const newPR = detectPR(sessions);
    if (newPR) { state.prCelebration = newPR; state.modal = 'prCelebration'; render(); return; }
    // 6. Supplémentation saisonnière (1× par 14 jours)
    const lastSup = SM.get('lastSupReco', null);
    if (!lastSup || (new Date(today) - new Date(lastSup)) > 14 * 86400000) {
      const recos = detectSeasonalSupplementation(SM.get('profile'));
      if (recos.length) { SM.set('lastSupReco', today); state.modal = 'seasonalSupp'; state.modalData = recos; render(); return; }
    }
    // 7. Replan mensuel auto (proposer toutes les 30 jours)
    const lastMr = SM.get('lastMonthlyReplan', null);
    if (!lastMr || (new Date(today) - new Date(lastMr)) > 30 * 86400000) {
      // ne lance pas auto, mais notif douce
      setTimeout(() => showToast('💡 Bilan mensuel disponible (Outils → Bilan mois)', 'info'), 2000);
      SM.set('lastMonthlyReplan', today);
    }
  }, 5500);

  /* Check-in récup dû ? (Phase 3) */
  setTimeout(() => {
    if (state.modal) return;
    const fs = getFuelState();
    const due = fs.recoveryCheckinDue;
    if (!due) return;
    const today = todayISO();
    if (due.scheduledFor && due.scheduledFor <= today) {
      state.recoveryCheckin = { sessionId: due.sessionId, sessionType: due.sessionType, load: due.load, dueDate: due.scheduledFor };
      state.modal = 'recoveryCheckin';
      render();
    }
  }, 4500);

  /* PWA: injecter manifest dynamique (Blob URL pour passer la CSP) */
  try {
    const iconSvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0d0d0f"/><text x="256" y="370" font-family="-apple-system,system-ui,sans-serif" font-size="360" font-weight="900" text-anchor="middle" fill="#d4af37">M</text></svg>';
    const iconUrl = 'data:image/svg+xml;utf8,' + encodeURIComponent(iconSvg);
    const manifest = {
      name: 'Motion — Coach running IA',
      short_name: 'Motion',
      description: 'Plan running personnalisé par IA',
      start_url: '.',
      display: 'standalone',
      orientation: 'portrait',
      background_color: '#0d0d0f',
      theme_color: '#0d0d0f',
      icons: [
        { src: iconUrl, sizes: '192x192', type: 'image/svg+xml', purpose: 'any maskable' },
        { src: iconUrl, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' },
      ],
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  } catch (e) {}

  /* PWA: capturer l'event d'installation Android */
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    PWA.deferredPrompt = e;
  });
  window.addEventListener('appinstalled', () => {
    SM.set('pwa_installed', true);
    PWA.deferredPrompt = null;
    if (state.modal === 'installPWA') { state.modal = null; render(); }
  });

  /* PWA: proposer l'install au démarrage si pertinent */
  setTimeout(() => {
    if (isStandalone()) return;                       // déjà installée
    if (SM.get('pwa_installed')) return;
    const dism = SM.get('pwa_dismissed');
    if (dism && dism.permanent) return;                // refus définitif
    if (dism && (Date.now() - dism.ts) < 7 * 86400000) return; // re-proposer après 7j
    if (state.view === 'welcome' || state.view === 'wizard') return; // pas pendant l'onboarding
    if (state.modal) return;                           // pas pardessus une modale
    state.modal = 'installPWA';
    render();
  }, 3500);
}

document.addEventListener('DOMContentLoaded', init);
if (document.readyState !== 'loading') init();
</script>
</body>
</html>
