function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ====================== Home ====================== */
function renderHome() {
  const profile = SM.get('profile');
  const plan = SM.get('plan');
  if (!profile || !plan) {
    return renderWelcome();
  }
  const tmpl = PLAN_TEMPLATES[plan.goal];
  const totalSessions = plan.planData.weeks.reduce((acc, w) => acc + w.sessions.filter(s => s.type !== 'rest').length, 0);
  const completed = plan.planData.weeks.reduce((acc, w) => acc + w.sessions.filter(s => s.completed).length, 0);
  const progressPct = totalSessions > 0 ? Math.round(completed / totalSessions * 100) : 0;
  const currentWeek = plan.currentWeek;
  const totalWeeks = plan.planData.weeks.length;
  const viewedWeek = Math.max(1, Math.min(totalWeeks, state.viewedWeek || currentWeek));
  const week = plan.planData.weeks[viewedWeek - 1];
  // next session = first non-completed non-rest from real currentWeek onward (independent of navigation)
  let next = null, nextWeekIdx = -1, nextSessIdx = -1;
  outer: for (let w = currentWeek - 1; w < plan.planData.weeks.length; w++) {
    for (let s = 0; s < plan.planData.weeks[w].sessions.length; s++) {
      const sess = plan.planData.weeks[w].sessions[s];
      if (!sess.completed && sess.type !== 'rest') {
        next = sess; nextWeekIdx = w; nextSessIdx = s;
        break outer;
      }
    }
  }

  const weekRunning = week.sessions.filter(s => s.type !== 'rest');
  const weekCompleted = weekRunning.filter(s => s.completed).length;
  const weekKm = weekRunning.filter(s => s.completed).reduce((a, s) => a + (s.actualKm || s.plannedKm), 0);
  const weekPct = weekRunning.length > 0 ? Math.round(weekCompleted / weekRunning.length * 100) : 0;

  const goalLabel = { '5k': '5 KM', '10k': '10 KM', 'semi': 'SEMI-MARATHON', 'marathon': 'MARATHON' }[plan.goal] || plan.goal.toUpperCase();
  const isViewingCurrent = viewedWeek === currentWeek;
  const weekKmTotal = week.sessions.reduce((a, s) => a + (s.plannedKm || 0), 0);

  // Readiness card
  const readinessToday = getTodayReadiness();
  const rZone = readinessToday ? readinessZone(readinessToday.score) : null;
  // VDOT recalibration banner
  const daysSinceVdot = daysSinceLastVdotTest();
  const showVdotBanner = daysSinceVdot != null && daysSinceVdot >= 35;
  // Shoe alerts (any active shoe over 90% of maxKm)
  const overdueShoes = getActiveShoes().filter(s => (s.totalKm || 0) >= (s.maxKm || 700) * 0.9);

  return `
    <div class="home-header">
      <h1 class="home-title">🎯 ${goalLabel} · ${tmpl.weeks} SEMAINES</h1>
      <div class="home-meta">VDOT ${profile.vdot} · Semaine ${currentWeek}/${tmpl.weeks} · ${completed}/${totalSessions} séances</div>
      <div class="progress-bar"><div class="progress-bar-fill" style="width:${progressPct}%"></div></div>
    </div>

    ${readinessToday ? `
      <div class="card mt-8" style="border-left:3px solid ${rZone.color};cursor:pointer" onclick="App.openReadinessCheckin()">
        <div class="flex-between">
          <div>
            <b style="font-size:13px">${rZone.emoji} Readiness aujourd'hui ${helpIcon('readiness')}</b>
            <div class="muted" style="font-size:11px;margin-top:3px">${rZone.label}</div>
          </div>
          <b style="font-size:22px;color:${rZone.color}">${readinessToday.score}/100</b>
        </div>
      </div>
    ` : `
      <button class="btn btn-secondary" style="width:100%;margin-top:8px;background:linear-gradient(135deg,#facc15,#f59e0b);color:#000" onclick="App.openReadinessCheckin()">
        🌅 Faire mon check-in du matin ${helpIcon('readiness')}
      </button>
    `}

    ${showVdotBanner ? `
      <div class="card mt-8" style="background:linear-gradient(135deg,rgba(124,58,237,.15),rgba(37,99,235,.15));border:1px solid rgba(124,58,237,.4);cursor:pointer" onclick="App.openVdotRecalibrate()">
        <div class="flex-between">
          <div>
            <b style="font-size:13px">🎯 Recalibration VDOT recommandée ${helpIcon('vdotRecalibrate')}</b>
            <div class="muted" style="font-size:11px;margin-top:3px">Dernier test il y a ${daysSinceVdot}j — tes allures dérivent</div>
          </div>
          <span style="font-size:18px">→</span>
        </div>
      </div>
    ` : ''}

    ${overdueShoes.length ? `
      <div class="card mt-8" style="border-left:3px solid #ef4444;cursor:pointer" onclick="App.openShoes()">
        <b style="font-size:13px;color:#ef4444">👟 ${overdueShoes.length} paire${overdueShoes.length>1?'s':''} en fin de vie</b>
        <div class="muted" style="font-size:11px;margin-top:3px">${overdueShoes.map(s => escapeHtml(s.name) + ' (' + (s.totalKm||0).toFixed(0) + ' km)').join(' · ')}</div>
      </div>
    ` : ''}

    ${next ? `
      <div class="section-label">Prochaine séance</div>
      <div class="next-session-card">
        <div class="next-session-type">${typeIcon(next.type)} ${typeLabel(next.type)} · ${DAY_LONG[next.dayIndex]}${nextWeekIdx + 1 !== currentWeek ? ' (S' + (nextWeekIdx + 1) + ')' : ''}${next.aiAdjusted ? ' · 🤖' : ''}</div>
        <div class="next-session-stats">
          <span><b>${next.plannedKm}</b><em> km</em></span>
          <span><b>${next.plannedDuration}</b><em> min</em></span>
          <span><b>${formatPace(next.pace)}</b><em>/km</em></span>
        </div>
        ${next.aiNotes ? `<div class="muted" style="font-size:12px;margin-top:6px;font-style:italic">🤖 ${escapeHtml(next.aiNotes)}</div>` : ''}
        <div class="btn-row">
          <button class="btn btn-primary" style="flex:1" onclick="App.openSessionFeedback(${nextWeekIdx},${nextSessIdx})">Démarrer →</button>
        </div>
        <div class="btn-row mt-8">
          <button class="btn btn-secondary" style="flex:1" onclick="App.openEditPlanned(${nextWeekIdx},${nextSessIdx})">✏️ Modifier</button>
          <button class="btn btn-secondary" style="flex:1;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff" onclick="App.openChatPlanned(${nextWeekIdx},${nextSessIdx})">💬 IA</button>
        </div>
        <div class="btn-row mt-8">
          <button class="btn btn-secondary" style="flex:1;background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff" onclick="App.openDailyBrief()">🌤️ Brief du jour</button>
          <button class="btn btn-secondary" style="flex:1;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff" onclick="App.aiGenerateNextWeek()">🤖 Régénérer la semaine</button>
        </div>
      </div>
    ` : `
      <div class="card center">
        <div style="font-size:48px;margin-bottom:12px">🎉</div>
        <div style="font-family:'Bebas Neue',system-ui,sans-serif;font-size:22px;letter-spacing:1.5px;color:var(--gold)">Plan complété !</div>
        <div class="muted mt-8">Tu peux générer un nouveau plan depuis les réglages.</div>
        <button class="btn btn-secondary mt-16" onclick="App.resetPlan()">Nouveau plan</button>
      </div>
    `}

    <div class="week-nav">
      <button class="week-nav-btn" onclick="App.viewPrevWeek()" ${viewedWeek <= 1 ? 'disabled' : ''} aria-label="Semaine précédente">←</button>
      <div class="week-nav-label">
        <div class="week-nav-title">Semaine ${viewedWeek}<span class="muted">/${totalWeeks}</span></div>
        <div class="week-nav-sub">${weekKmTotal.toFixed(1)} km prévus${isViewingCurrent ? ' · en cours' : (viewedWeek < currentWeek ? ' · passée' : ' · à venir')}</div>
      </div>
      <button class="week-nav-btn" onclick="App.viewNextWeek()" ${viewedWeek >= totalWeeks ? 'disabled' : ''} aria-label="Semaine suivante">→</button>
    </div>
    ${!isViewingCurrent ? `<button class="btn btn-ghost" style="width:100%;margin-bottom:8px" onclick="App.viewCurrentWeek()">↺ Revenir à la semaine en cours (S${currentWeek})</button>` : ''}

    <div class="mini-stats">
      <div class="mini-stat"><div class="mini-stat-value">${weekCompleted}/${weekRunning.length}</div><div class="mini-stat-label">Séances</div></div>
      <div class="mini-stat"><div class="mini-stat-value">${weekKm.toFixed(1)}</div><div class="mini-stat-label">km faits</div></div>
      <div class="mini-stat"><div class="mini-stat-value">${weekPct}%</div><div class="mini-stat-label">Progression</div></div>
    </div>

    ${(() => {
      const wkObj = plan.planData.weeks[viewedWeek - 1];
      const phase = wkObj && wkObj.phase ? wkObj.phase : getPhaseForWeek(viewedWeek, tmpl);
      const pi = phaseInfo(phase);
      const totalBaseWeeks = Math.max(2, Math.round(tmpl.peakWeek * 0.4));
      const totalSpecificWeeks = tmpl.peakWeek - totalBaseWeeks;
      const totalTaperWeeks = tmpl.weeks - tmpl.peakWeek;
      let phaseProgress = '';
      if (phase === 'base') phaseProgress = `${viewedWeek}/${totalBaseWeeks}`;
      else if (phase === 'specific') phaseProgress = `${viewedWeek - totalBaseWeeks}/${totalSpecificWeeks}`;
      else phaseProgress = `${viewedWeek - tmpl.peakWeek}/${totalTaperWeeks}`;
      return `
        <div class="card mt-8" style="border-left:3px solid ${pi.color};background:linear-gradient(135deg,${pi.color}15,transparent)">
          <div class="flex-between">
            <div>
              <b style="color:${pi.color};letter-spacing:1.5px;font-family:'Bebas Neue',system-ui,sans-serif">${pi.emoji} PHASE ${pi.label} ${pi.helpKey ? helpIcon(pi.helpKey) : ''}</b>
              <div class="muted" style="font-size:11px;margin-top:3px">Semaine ${phaseProgress} de la phase · cible polarisation ${pi.target}/${100-pi.target}</div>
            </div>
          </div>
        </div>
      `;
    })()}

    <div class="section-label">Programme S${viewedWeek} ${helpIcon('longPressMove')} ${helpIcon('addCustom')}</div>
    <div class="day-list">
      ${week.sessions.map((s, idx) => renderDayRow(s, idx, viewedWeek - 1, nextWeekIdx, nextSessIdx)).join('')}
    </div>

    <button class="btn btn-secondary" style="width:100%;margin-top:10px;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff" onclick="App.runWeekAnalysis(${viewedWeek - 1})">🤖 Analyser ma semaine ${helpIcon('weekAnalysis')}</button>

    <div class="divider"></div>
    <div class="section-label">Outils</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">
      <button class="btn btn-secondary" style="padding:10px 4px;font-size:11px" onclick="App.openTargetRace()">🎯 Objectif</button>
      <button class="btn btn-secondary" style="padding:10px 4px;font-size:11px" onclick="App.openGlycogen()">🍝 Glycogène</button>
      <button class="btn btn-secondary" style="padding:10px 4px;font-size:11px" onclick="App.openSleepLog()">😴 Sommeil</button>
      <button class="btn btn-secondary" style="padding:10px 4px;font-size:11px" onclick="App.fetchRoutes()">🗺️ Lieux</button>
      <button class="btn btn-secondary" style="padding:10px 4px;font-size:11px" onclick="App.openStrengthExos()">💪 Renfo</button>
      <button class="btn btn-secondary" style="padding:10px 4px;font-size:11px" onclick="App.runWeeklyCoachAI()">🎯 Focus IA</button>
      <button class="btn btn-secondary" style="padding:10px 4px;font-size:11px" onclick="App.runPatternsAI()">🔍 Patterns</button>

const ALL_TYPES = ['easy','endurance','tempo','interval','marathon','long','walk','strength','rest'];
function isStrengthType(t) { return t === 'strength'; }
function isCardioType(t) { return t !== 'rest' && t !== 'strength'; }
function typeIcon(t) {
  return { easy: '🏃', endurance: '🌿', tempo: '⚡', interval: '🔥', marathon: '🎯', long: '🥇', walk: '🚶', strength: '💪', rest: '💤' }[t] || '🏃';
}
function typeLabel(t) {
  return { easy: 'FOOTING', endurance: 'ENDURANCE', tempo: 'TEMPO', interval: 'FRACTIONNÉ', marathon: 'ALLURE MARATHON', long: 'SORTIE LONGUE', walk: 'MARCHE', strength: 'MUSCU', rest: 'REPOS' }[t] || t.toUpperCase();
}
function helpIcon(key) {
  return `<span class="help-icon" onclick="event.stopPropagation();App.showHelp('${key}')" style="display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--card-2);color:var(--text-2);font-size:11px;font-weight:700;cursor:pointer;margin-left:6px;vertical-align:middle;border:1px solid var(--border);user-select:none">?</span>`;
}

function renderDayRow(s, idx, weekIdx, nextW, nextS) {
  const isNext = (weekIdx === nextW && idx === nextS);
  const isRest = s.type === 'rest';
  const isStrength = isStrengthType(s.type);
  const cls = (s.completed ? 'completed' : '') + (isNext ? ' next' : '') + (isRest ? ' rest' : '');
  const status = s.completed ? '✓' : (isNext ? '→' : '·');
  const dayLabel = DAY_SHORT[s.dayIndex];
  // data-* attrs pour la détection d'appui long (déplacer la séance)
  const dragAttrs = `data-day-row="1" data-week-idx="${weekIdx}" data-session-idx="${idx}" data-completed="${s.completed?1:0}"`;
  if (isRest) {
    // Cliquable : ajoute une séance custom (muscu, marche, footing additionnel...)
    return `
      <div class="day-row rest" onclick="App.openAddCustom(${weekIdx},${idx})" ${dragAttrs} style="cursor:pointer">
        <div class="day-row-day">${dayLabel}</div>
        <div class="day-row-status">·</div>
        <div class="day-row-type rest">REPOS</div>
        <div class="day-row-km" style="color:var(--text-3);font-size:11px">＋ ajouter</div>
        <div></div>
      </div>`;
  }
  const onClick = `onclick="App.openSessionInfo(${weekIdx},${idx})"`;
  const kmCol = isStrength ? `${s.plannedDuration||0} min` : `${s.plannedKm} km`;
  const paceCol = isStrength ? '' : formatPace(s.pace);
  return `
    <div class="day-row ${cls}" ${onClick} ${dragAttrs}>
      <div class="day-row-day">${dayLabel}</div>
      <div class="day-row-status">${status}</div>
      <div class="day-row-type ${s.type}">${typeLabel(s.type)}</div>
      <div class="day-row-km">${kmCol}</div>
      <div class="day-row-pace">${paceCol}</div>
    </div>
  `;
}

/* ====================== Stats ====================== */
function renderStats() {
  const sessions = SM.get('sessions', []);
  const profile = SM.get('profile');
  const plan = SM.get('plan');
  const dailyLoad = getDailyLoad();
  // overview
  const totalKm = sessions.reduce((a, s) => a + (s.actualKm || 0), 0);
  const totalSessions = sessions.length;
  const avgRpe = totalSessions > 0 ? (sessions.reduce((a, s) => a + (s.rpe || 0), 0) / totalSessions).toFixed(1) : '-';
  const perfectCount = sessions.filter(s => s.completion === 100).length;
  const perfectPct = totalSessions > 0 ? Math.round(perfectCount / totalSessions * 100) : 0;
  const vdot = profile ? profile.vdot : '-';
  const currentWeek = plan ? plan.currentWeek : 0;

  // ACWR chart : 14 days
  const acwrData = [];
  for (let i = 13; i >= 0; i--) {
    const dateStr = isoDaysAgo(i);
    let acute = 0, chronic = 0;
    for (let j = 0; j < 7; j++) acute += (dailyLoad[isoDaysAgo(i + j)] || 0);
    for (let j = 0; j < 28; j++) chronic += (dailyLoad[isoDaysAgo(i + j)] || 0);
    chronic /= 4;
    const ratio = chronic > 0 ? acute / chronic : 0;
    acwrData.push({ date: dateStr, ratio });
  }
  const maxRatio = Math.max(2, ...acwrData.map(d => d.ratio));
  const heightAt = (r) => Math.max(2, (r / maxRatio) * 100);

  // distrib
  const typeMap = { easy: 0, tempo: 0, interval: 0, long: 0, walk: 0, strength: 0 };
  sessions.forEach(s => {
    if (typeMap[s.type] === undefined) return;
    // Pour la muscu : pas de km, on additionne la durée en min/10 pour rester comparable visuellement
    if (s.type === 'strength') typeMap[s.type] += (s.actualDuration || 0) / 600;
    else typeMap[s.type] += s.actualKm || 0;
  });
  const totalDistrib = Object.values(typeMap).reduce((a, b) => a + b, 0) || 1;

  const acwrCurrent = calculateACWR();
  const zone = acwrZone(acwrCurrent.ratio);

  return `
    <div class="home-header">
      <h1 class="home-title">📊 Stats</h1>
      <div class="home-meta">${totalSessions} séances · ${totalKm.toFixed(1)} km cumulés</div>
    </div>

    <div class="section-label">Overview</div>
    <div class="stats-grid">
      <div class="stats-card"><div class="stats-card-value">${totalKm.toFixed(0)}</div><div class="stats-card-label">km total</div></div>
      <div class="stats-card"><div class="stats-card-value">${totalSessions}</div><div class="stats-card-label">Séances complétées</div></div>
      <div class="stats-card"><div class="stats-card-value">${avgRpe}</div><div class="stats-card-label">RPE moyen</div></div>
      <div class="stats-card"><div class="stats-card-value">${perfectPct}%</div><div class="stats-card-label">Complétion 100%</div></div>
      <div class="stats-card"><div class="stats-card-value">${vdot}</div><div class="stats-card-label">VDOT actuel</div></div>
      <div class="stats-card"><div class="stats-card-value">${currentWeek}</div><div class="stats-card-label">Semaine en cours</div></div>
    </div>

    <div class="section-label">Charge ACWR (14 derniers jours) ${helpIcon('acwr')}</div>
    <div class="acwr-chart">
      <div class="flex-between mb-8">
        <div style="font-family:'Bebas Neue',system-ui,sans-serif;letter-spacing:1px">Ratio : <span style="color:${zone.color}">${acwrCurrent.ratio.toFixed(2)}</span></div>
        <div style="font-size:11px;color:${zone.color};text-transform:uppercase;letter-spacing:0.5px;font-weight:600">${zone.label}</div>
      </div>
      <div class="acwr-bars">
        ${acwrData.map(d => {
          const z = acwrZone(d.ratio);
          const h = d.ratio > 0 ? heightAt(d.ratio) : 0;
          return `<div class="acwr-bar ${z.cls}" style="height:${h}%" title="${d.date} : ${d.ratio.toFixed(2)}"></div>`;
        }).join('')}
        <div class="acwr-line" style="bottom:${heightAt(0.8)}%;border-color:#22c55e"><span class="acwr-line-label" style="color:#22c55e">0.8</span></div>
        <div class="acwr-line" style="bottom:${heightAt(1.3)}%;border-color:#f59e0b"><span class="acwr-line-label" style="color:#f59e0b">1.3</span></div>
        <div class="acwr-line" style="bottom:${heightAt(1.5)}%;border-color:#ef4444"><span class="acwr-line-label" style="color:#ef4444">1.5</span></div>
      </div>
      <div class="acwr-axis-label"><span>-14j</span><span>aujourd'hui</span></div>
    </div>

    <div class="section-label">Répartition par type</div>
    <div class="card">
      ${['easy', 'tempo', 'interval', 'long'].map(t => {
        const km = typeMap[t] || 0;
        const pct = Math.round(km / totalDistrib * 100);
        return `
          <div class="distrib-row">
            <div class="distrib-label-row">
              <span class="day-row-type ${t}" style="font-family:'Bebas Neue',system-ui,sans-serif;letter-spacing:1px">${typeLabel(t)}</span>
              <span class="muted">${km.toFixed(1)} km · ${pct}%</span>
            </div>
            <div class="distrib-bar"><div class="distrib-bar-fill ${t}" style="width:${pct}%"></div></div>
          </div>
        `;
      }).join('')}
    </div>

    ${(()=>{
      const pol = computePolarization(sessions);
      const trend = computeVDOTTrend(sessions, profile);
      const heat = computeHourlyHeatmap(sessions);
      const cmp = computeMonthComparison(sessions);
      const vd = profile?.vdot;
      const out = [];
      if (pol) {
        // Cible dynamique selon la phase de la semaine en cours
        let phaseTarget = 80;
        let phaseLabel = '80/20';
        if (plan && plan.planData) {
          const wk = plan.planData.weeks[plan.currentWeek - 1];
          const phase = (wk && wk.phase) || getPhaseForWeek(plan.currentWeek, PLAN_TEMPLATES[plan.goal]);
          const pi = phaseInfo(phase);
          phaseTarget = pi.target;
          phaseLabel = `${pi.target}/${100 - pi.target} (phase ${pi.label})`;
        }
        const dev = Math.abs(pol.easyPct - phaseTarget);
        const c = dev <= 5 ? '#22c55e' : dev <= 12 ? '#f59e0b' : '#ef4444';
        out.push(`
          <div class="section-label">⚖️ Polarisation (30 derniers jours) ${helpIcon('polarization')}</div>
          <div class="card" style="background:var(--card-2)">
            <div style="position:relative;height:22px;border-radius:11px;overflow:hidden;background:var(--card)">
              <div style="display:flex;height:100%">
                <div style="width:${pol.easyPct}%;background:#22c55e"></div>
                <div style="width:${pol.hardPct}%;background:#ef4444"></div>
              </div>
              <div style="position:absolute;top:-2px;bottom:-2px;left:${phaseTarget}%;width:2px;background:#fff;box-shadow:0 0 0 1px #000" title="Cible ${phaseTarget}%"></div>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:12px;margin-top:6px">
              <span>Easy <b>${pol.easyPct}%</b></span><span><b>${pol.hardPct}%</b> Hard</span>
            </div>
            <div class="muted" style="font-size:11px;margin-top:4px">Cible actuelle : ${phaseLabel}</div>
            <div style="font-size:12px;color:${c};margin-top:6px">${escapeHtml(pol.advice)}${dev > 5 ? ' · écart ' + dev + 'pts vs cible' : ' · cible respectée ✓'}</div>
          </div>
        `);
      }
      if (trend.series.length >= 2) {
        out.push(`
          <div class="section-label">📈 Tendance allure easy (mensuelle)</div>
          <div class="card" style="background:var(--card-2)">
            ${trend.series.slice(-6).map(m => `<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0"><span>${m.month}</span><span><b>${formatPace(m.avgPaceSec)}</b>/km · ${m.totalKm}km</span></div>`).join('')}
            ${trend.trend != null ? `<div class="muted" style="font-size:11px;margin-top:6px">${trend.trend > 0 ? '✅ Tu progresses : -' + trend.trend + 's/km vs mois précédent' : trend.trend < 0 ? '📉 Allure plus lente : +' + Math.abs(trend.trend) + 's/km' : 'Allure stable'}</div>` : ''}
          </div>
        `);
      }
      if (heat) {
        const max = Math.max(...heat.heat.map(h => h.count));
        out.push(`
          <div class="section-label">⏰ Heatmap horaire (heure de tes séances)</div>
          <div class="card" style="background:var(--card-2)">
            <div style="display:flex;align-items:flex-end;gap:2px;height:60px;margin-top:4px">
              ${Array.from({length:24}, (_,h)=>{const d=heat.heat.find(x=>x.hour===h);const ratio=d?d.count/max:0;const c=d&&d.avgCompletion>=85?'#22c55e':d&&d.avgCompletion>=70?'#f59e0b':d?'#ef4444':'transparent';return `<div style="flex:1;height:${ratio*100}%;background:${c};min-height:${d?2:0}px;border-radius:2px" title="${h}h${d?' · '+d.count+' séances · RPE '+d.avgRpe:''}"></div>`;}).join('')}
            </div>
            <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--text-3);margin-top:2px"><span>0h</span><span>6h</span><span>12h</span><span>18h</span><span>23h</span></div>
            <div class="muted" style="font-size:11px;margin-top:6px">🌟 Tu performes le mieux à <b>${heat.bestHour}h</b></div>
          </div>
        `);
      }
      out.push(`
        <div class="section-label">📅 Comparaison mois</div>
        <div class="card" style="background:var(--card-2)">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
            <div><div class="muted" style="font-size:11px">Ce mois</div><div style="font-size:13px"><b>${cmp.thisMonth.km}</b>km · ${cmp.thisMonth.sessions} séances · ${cmp.thisMonth.load} UA</div></div>
            <div><div class="muted" style="font-size:11px">Mois dernier</div><div style="font-size:13px"><b>${cmp.lastMonth.km}</b>km · ${cmp.lastMonth.sessions} séances · ${cmp.lastMonth.load} UA</div></div>
          </div>
          ${cmp.lastMonth.km > 0 ? `<div class="muted" style="font-size:11px;margin-top:6px">Évolution km : <b style="color:${cmp.thisMonth.km>=cmp.lastMonth.km?'#22c55e':'#f59e0b'}">${cmp.thisMonth.km>=cmp.lastMonth.km?'+':''}${Math.round((cmp.thisMonth.km/cmp.lastMonth.km - 1)*100)}%</b></div>` : ''}
        </div>
      `);
      if (vd) {
        const distances = [{d:5,n:'5K'},{d:10,n:'10K'},{d:21.0975,n:'Semi'},{d:42.195,n:'Marathon'}];
        out.push(`
          <div class="section-label">🔮 Prédiction temps de course (VDOT ${vd})</div>
          <div class="card" style="background:var(--card-2)">
            <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px">
              ${distances.map(d => { const p = predictRaceTime(vd, d.d); if (!p) return ''; return `<div style="text-align:center;padding:8px;background:var(--card);border-radius:6px"><div style="font-size:10px;color:var(--text-3)">${d.n}</div><div style="font-size:14px;font-weight:700">${formatTimeShort(p.seconds)}</div><div style="font-size:10px;color:var(--text-3)">${formatPace(p.pacePerKm)}/km</div></div>`; }).join('')}
            </div>
            <div class="muted" style="font-size:10px;margin-top:6px">Loi de Riegel — référence Daniels</div>
          </div>
        `);
      }
      return out.join('');
    })()}

    <div class="section-label">Historique (20 dernières séances)</div>
    ${sessions.length === 0 ? `
      <div class="empty-state">
        <div class="empty-state-icon">🏃</div>
        <div>Aucune séance enregistrée pour l'instant.</div>
      </div>
    ` : sessions.slice(-20).reverse().map(s => `
      <div class="history-row" style="cursor:pointer" onclick="App.openSessionActions('${s.id}')" title="Analyser, modifier, déplacer ou supprimer">

        <div class="h-type day-row-type ${s.type}">${typeLabel(s.type)}</div>
        <div class="h-km">${(s.actualKm || 0).toFixed(1)}km</div>
        <div class="h-stat">RPE ${s.rpe || '-'} · ${s.completion || 0}%</div>
        <div class="h-stat">${s.pain && s.pain !== 'none' ? '⚠️ ' + s.pain : ''} · ${s.load || 0} UA</div>
      </div>
    `).join('')}
  `;
}

          const env = SM.get('lastEnvBundle', null);
          const out = [];

            const c = env.heatIndex.zone === 'danger' ? '#ef4444' : env.heatIndex.zone === 'caution' ? '#f59e0b' : '#22c55e';

/* ============== Long-press to move planned session ======================== */
const LongPress = {
  timer: null, startX: 0, startY: 0, target: null, fired: false,
  THRESHOLD_MS: 500, MOVE_TOLERANCE: 10,
};
function setupLongPressHandlers() {
  const start = (e) => {
    const isTouch = e.type === 'touchstart';
    const pt = isTouch ? e.touches[0] : e;
    const row = e.target.closest && e.target.closest('[data-day-row]');
    if (!row) return;
    if (row.getAttribute('data-completed') === '1') return; // pas de drag sur séance faite
    LongPress.target = row;
    LongPress.startX = pt.clientX; LongPress.startY = pt.clientY;
    LongPress.fired = false;
    clearTimeout(LongPress.timer);
    LongPress.timer = setTimeout(() => {
      LongPress.fired = true;
      row.classList.add('long-pressing');
      try { if (navigator.vibrate) navigator.vibrate(30); } catch(_) {}
      const wi = parseInt(row.getAttribute('data-week-idx'));
      const si = parseInt(row.getAttribute('data-session-idx'));
      setTimeout(() => {
        row.classList.remove('long-pressing');
        App.openMovePlanned(wi, si);
      }, 150);
    }, LongPress.THRESHOLD_MS);
  };
  const move = (e) => {
    if (!LongPress.target) return;
    const isTouch = e.type === 'touchmove';
    const pt = isTouch ? e.touches[0] : e;
    if (Math.abs(pt.clientX - LongPress.startX) > LongPress.MOVE_TOLERANCE
     || Math.abs(pt.clientY - LongPress.startY) > LongPress.MOVE_TOLERANCE) {
      cancel();
    }
  };
  const cancel = () => {
    clearTimeout(LongPress.timer);
    if (LongPress.target) LongPress.target.classList.remove('long-pressing');
    LongPress.target = null;
  };
  const end = (e) => {
    if (LongPress.fired) {
      // Empêcher le clic associé après long-press
      e.preventDefault();
      e.stopPropagation();
    }
    cancel();
  };
  document.addEventListener('touchstart', start, { passive: true });
  document.addEventListener('touchmove', move, { passive: true });
  document.addEventListener('touchend', end, true);
  document.addEventListener('touchcancel', cancel, { passive: true });
  document.addEventListener('mousedown', start);
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', end, true);
  document.addEventListener('contextmenu', (e) => {
    // empêche le menu contextuel sur appui long mobile pendant le drag
    if (LongPress.fired) e.preventDefault();
  });
}

/* ============== PDF.js loader (for blood test PDF attachment) ============ */
const PDFJS_VERSION = '3.11.174';
const PDFJS_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/' + PDFJS_VERSION;
let _pdfjsPromise = null;
function loadPDFJS() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (_pdfjsPromise) return _pdfjsPromise;
  _pdfjsPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = PDFJS_BASE + '/pdf.min.js';
    s.async = true;
    s.onload = () => {
      const lib = window.pdfjsLib || window['pdfjs-dist/build/pdf'];
      if (!lib) { reject(new Error('PDF.js non disponible après chargement')); return; }
      try { lib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + '/pdf.worker.min.js'; } catch (_) {}
      window.pdfjsLib = lib;
      resolve(lib);
    };
    s.onerror = () => { _pdfjsPromise = null; reject(new Error('Impossible de charger PDF.js (réseau ?)')); };
    document.head.appendChild(s);
  });
  return _pdfjsPromise;
}

/* ============== Back navigation: history + Escape + swipe-down =========== */
const ModalNav = {
  suppressNextPop: false,
  swipe: { active: false, startY: 0, startX: 0, currentY: 0, target: null },
};

function pushModalHistoryEntry() {
  try { history.pushState({ pace: 'modal', t: Date.now() }, ''); } catch (_) {}
}

function setupBackNavHandlers() {
  // Trampoline: ensures one extra history entry exists so first "back" closes a modal instead of exiting the PWA.
  try {
    if (!history.state || history.state.pace !== 'home') {
      history.replaceState({ pace: 'home' }, '');
    }
    pushModalHistoryEntry();
  } catch (_) {}

  window.addEventListener('popstate', () => {
    if (ModalNav.suppressNextPop) { ModalNav.suppressNextPop = false; return; }
    if (state.modal) {
      // Pop one modal level (returns to parent if any, else closes fully).
      App.closeModal();
      pushModalHistoryEntry();
      return;
    }
    if (state.view === 'wizard' && state.wizardStep > 1) {
      state.wizardStep -= 1;
      render();
      pushModalHistoryEntry();
      return;
    }
    if (state.view !== 'home' && state.view !== 'welcome') {
      state.view = 'home';
      render();
      pushModalHistoryEntry();
      return;
    }
    // No back target — re-arm so user has to press back again to exit.
    pushModalHistoryEntry();
  });

  // Escape closes modal
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && state.modal) {
      e.preventDefault();
      App.closeModal();
    }
  });

  // Swipe-down on .modal-handle (or top of .modal) closes modal
  const onStart = (e) => {
    const isTouch = e.type === 'touchstart';
    const pt = isTouch ? e.touches[0] : e;
    const handle = e.target.closest && e.target.closest('.modal-handle');
    if (!handle) return;
    const modalEl = handle.closest('.modal');
    if (!modalEl) return;
    ModalNav.swipe.active = true;
    ModalNav.swipe.startY = pt.clientY;
    ModalNav.swipe.startX = pt.clientX;
    ModalNav.swipe.currentY = pt.clientY;
    ModalNav.swipe.target = modalEl;
    modalEl.style.transition = 'none';
  };
  const onMove = (e) => {
    if (!ModalNav.swipe.active || !ModalNav.swipe.target) return;
    const isTouch = e.type === 'touchmove';
    const pt = isTouch ? e.touches[0] : e;
    ModalNav.swipe.currentY = pt.clientY;
    const dy = pt.clientY - ModalNav.swipe.startY;
    if (dy > 0) ModalNav.swipe.target.style.transform = 'translateY(' + dy + 'px)';
  };
  const onEnd = () => {
    if (!ModalNav.swipe.active || !ModalNav.swipe.target) { ModalNav.swipe.active = false; return; }
    const dy = ModalNav.swipe.currentY - ModalNav.swipe.startY;
    const tgt = ModalNav.swipe.target;
    tgt.style.transition = 'transform .2s ease';
    if (dy > 80) {
      tgt.style.transform = 'translateY(120vh)';
      setTimeout(() => { try { App.closeModal(); } catch (_) {} }, 180);
    } else {
      tgt.style.transform = '';
    }
    ModalNav.swipe.active = false;
    ModalNav.swipe.target = null;
  };
  document.addEventListener('touchstart', onStart, { passive: true });
  document.addEventListener('touchmove', onMove, { passive: true });
  document.addEventListener('touchend', onEnd, { passive: true });
  document.addEventListener('touchcancel', onEnd, { passive: true });
  document.addEventListener('mousedown', onStart);
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onEnd);
}

function rpeLabel(r) {
  if (r <= 2) return 'Très facile · récupération';
  if (r <= 4) return 'Facile · conversationnel';
  if (r <= 6) return 'Modéré · effort soutenu';
  if (r <= 7) return 'Dur · phrases courtes';
  if (r <= 8) return 'Très dur · concentration';
  return 'Maximal · effort total';
}

function renderSessionInfoModal() {
  const ref = state.currentSessionRef;

  const desc = SESSION_DESCRIPTIONS[sess.type];
  const loc = SESSION_LOCATIONS[sess.type];
  const isStrength = isStrengthType(sess.type);
  const intervalWk = sess.type === 'interval' ? buildIntervalWorkout(sess.plannedKm, sess.pace) : null;
  return `

  `;
}

function renderEnvDetailModal() {

  const w = env.weather, a = env.air, hi = env.heatIndex;
  const aqz = a ? airQualityZone(a.aqi) : null;
  const uv = uvAdvice(w?.uvNow);
  return `
    <div class="modal-title">🌤️ Conditions environnement</div>
    <div class="modal-sub">${env.geo.lat.toFixed(2)}, ${env.geo.lon.toFixed(2)}</div>

    ${w ? `

        <div class="section-label" style="margin-top:0">🌡️ Météo</div>
        <div style="font-size:13px;line-height:1.6">
          ${Math.round(w.tempC)}°C · ${w.label} · Humidité ${w.humidityPct}% · Vent ${Math.round(w.windKmh)} km/h
        </div>
        ${w.tempMaxToday != null ? `<div class="muted" style="font-size:11px">Max ${Math.round(w.tempMaxToday)}°C / Min ${Math.round(w.tempMinToday)}°C</div>` : ''}
      </div>
    ` : ''}

    ${hi ? `
      <div class="card mt-8" style="background:var(--card-2);border-left:3px solid ${hi.zone==='danger'?'#ef4444':hi.zone==='caution'?'#f59e0b':'#22c55e'}">
        <div class="section-label" style="margin-top:0">🥵 Indice thermique : ${hi.label}</div>
        <div style="font-size:13px">Ressenti ${hi.apparent}°C</div>
        ${hi.advice ? `<div style="font-size:12px;margin-top:4px">${escapeHtml(hi.advice)}</div>` : ''}
      </div>
    ` : ''}

    ${aqz ? `
      <div class="card mt-8" style="background:var(--card-2);border-left:3px solid ${aqz.color}">
        <div class="section-label" style="margin-top:0">💨 Qualité de l'air</div>
        <div style="font-size:13px"><b>AQI ${a.aqi}</b> · ${aqz.label}</div>
        <div style="font-size:11px;color:var(--text-3);margin-top:4px">PM2.5 ${a.pm25?.toFixed(1)||'-'} · O3 ${a.ozone?.toFixed(0)||'-'} · NO2 ${a.no2?.toFixed(0)||'-'}</div>
        <div style="font-size:12px;margin-top:6px">${aqz.advice}</div>
      </div>
    ` : ''}

    ${uv ? `
      <div class="card mt-8" style="background:var(--card-2);border-left:3px solid #f59e0b">
        <div class="section-label" style="margin-top:0">☀️ UV : ${uv.label}</div>
        <div style="font-size:13px">Index actuel ${w.uvNow?.toFixed(1)||'-'} · Max jour ${w.uvMaxToday?.toFixed(1)||'-'}</div>
        <div style="font-size:12px;margin-top:4px">${uv.advice}</div>
      </div>
    ` : ''}

    ${a && a.pollens ? (() => {
      const items = Object.keys(a.pollens).filter(k => pollenLevel(a.pollens[k]));
      if (!items.length) return '';
      return `
        <div class="card mt-8" style="background:var(--card-2);border-left:3px solid #84cc16">
          <div class="section-label" style="margin-top:0">🌾 Pollens</div>
          ${items.map(k => `<div style="font-size:13px">${k} : <b>${pollenLevel(a.pollens[k])}</b> (${a.pollens[k]?.toFixed(0)} grains/m³)</div>`).join('')}

      `;

    ${w && w.sunrise ? `

        <div class="section-label" style="margin-top:0">🌅 Soleil</div>

      </div>
    ` : ''}

    <div class="btn-row mt-16">
      <button class="btn btn-primary" onclick="App.closeModal()">Fermer</button>
    </div>
  `;
}

function renderEditPlannedModal() {

  const sess = wk && wk.sessions[ref.sessionIdx];
  if (!sess) return '';
  const isStrength = isStrengthType(sess.type);
  const isCustomAdd = !!ref.isCustom;
  const title = isCustomAdd
    ? `➕ Ajouter une séance — S${ref.weekIdx+1}`
    : `✏️ Modifier la séance — S${ref.weekIdx+1}`;
  return `
    <div class="modal-title">${title}</div>

    <div class="field">
      <label class="label">Type ${helpIcon('editType')}</label>
      <select class="input" onchange="App.setPlannedField('type', this.value)">
        ${ALL_TYPES.map(t => `<option value="${t}" ${sess.type===t?'selected':''}>${typeIcon(t)} ${typeLabel(t)}</option>`).join('')}
      </select>
    </div>
    ${isStrength ? `
      <div class="field">
        <label class="label">Durée (min)</label>

      <div class="field">
        <label class="label">Notes / exercices ${helpIcon('strength')}</label>

          <label class="label">Distance (km)</label>
          <input type="number" min="0" step="0.1" class="input" value="${sess.plannedKm||0}" oninput="App.setPlannedField('plannedKm', parseFloat(this.value)||0)">

        <div class="field" style="flex:1">
          <label class="label">Durée (min)</label>

  const sess = wk && wk.sessions[c.ref.sessionIdx];

  const aiOk = aiAvailable();
  return `

          Explique à l'IA ce que tu veux changer.<br>
          <span style="font-size:11px">Ex : « j'ai mal aux mollets, réduis de 3km », « transforme en endurance fondamentale », « passe en fractionné 8x400m »</span>

        </div>
      `).join('')}
      ${c.loading ? '<div class="muted center" style="font-size:12px">⏳ L\'IA réfléchit...</div>' : ''}

    ${c.pendingChanges ? `
      <div class="card mt-8" style="background:linear-gradient(135deg,rgba(124,58,237,.15),rgba(37,99,235,.15));border:1px solid rgba(124,58,237,.4)">
        <div class="section-label" style="margin-top:0">🔧 Modifications proposées</div>
        ${Object.keys(c.pendingChanges).map(k => {
          const v = c.pendingChanges[k];
          if (v == null || v === '') return '';
          let label = k, display = v;
          if (k === 'type') { label = 'Type'; display = typeIcon(v) + ' ' + typeLabel(v); }
          else if (k === 'plannedKm') { label = 'Distance'; display = v + ' km'; }
          else if (k === 'plannedDuration') { label = 'Durée'; display = v + ' min'; }
          else if (k === 'pace') { label = 'Allure'; display = formatPace(v) + '/km'; }
          else if (k === 'dayIndex') { label = 'Jour'; display = DAY_LONG[v]; }
          else if (k === 'aiNotes') { label = 'Notes'; display = v; }
          return `<div style="font-size:13px"><b>${label} :</b> ${escapeHtml(String(display))}</div>`;
        }).join('')}
        <div class="btn-row mt-8">
          <button class="btn btn-secondary" style="flex:1" onclick="App.rejectChatChanges()">✗ Refuser</button>
          <button class="btn btn-primary" style="flex:2" onclick="App.acceptChatChanges()">✓ Appliquer</button>

    ` : ''}

    <div class="field mt-8">
      <textarea class="textarea" id="chat-planned-input" rows="2" placeholder="${aiOk ? 'Tape ton message...' : 'Configure ta clé OpenRouter (Fuel → IA)'}" ${aiOk?'':'disabled'}></textarea>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="App.closeModal()">Fermer</button>
      <button class="btn btn-primary" style="flex:2" onclick="App.sendChatPlanned()" ${aiOk && !c.loading ? '' : 'disabled'}>${c.loading ? '⏳' : 'Envoyer →'}</button>
    </div>
  `;
}

function renderHelpModal() {
  const h = HELP_TEXTS[state.helpKey];
  if (!h) return '';
  return `
    <div class="modal-title">💡 ${h.title}</div>
    <div class="card mt-8" style="line-height:1.6;font-size:14px">${h.body}</div>
    <div class="btn-row mt-16"><button class="btn btn-primary" onclick="App.closeModal()">Compris</button></div>
  `;
}

function renderStartupGuideModal() {
  const step = state.guideStep || 0;
  const total = STARTUP_GUIDE_PAGES.length;
  const page = STARTUP_GUIDE_PAGES[Math.min(step, total - 1)];
  const isFirst = step === 0;
  const isLast = step >= total - 1;
  return `
    <div class="modal-title">📖 Guide de démarrage</div>
    <div class="modal-sub">Page ${step + 1}/${total}</div>

    <div style="display:flex;align-items:center;justify-content:center;font-size:64px;margin:8px 0 4px">${page.emoji}</div>
    <div style="text-align:center;font-family:'Bebas Neue',system-ui,sans-serif;font-size:24px;letter-spacing:1.5px;color:var(--gold);margin-bottom:8px">${escapeHtml(page.title)}</div>
    <div class="muted center" style="font-size:13px;line-height:1.5;margin-bottom:14px">${page.intro}</div>

    ${page.sections.map(s => `
      <div class="card" style="background:var(--card-2);margin-bottom:8px">
        <div style="font-size:13px;font-weight:600;margin-bottom:5px;color:var(--text)">${s.h}</div>
        <div style="font-size:12px;line-height:1.6;color:var(--text-2)">${s.body}</div>

    ${page.cta ? `
      <div class="btn-row mt-8">
        <button class="btn btn-secondary" style="width:100%;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff" onclick="${page.cta.action}">${page.cta.label} →</button>
      </div>
    ` : ''}

    <div style="display:flex;justify-content:center;gap:6px;margin:14px 0">

        <button onclick="App.guideJumpTo(${i})" style="width:8px;height:8px;border-radius:50%;border:none;padding:0;cursor:pointer;background:${i === step ? 'var(--gold)' : 'var(--border)'};transition:background .2s"></button>
      `).join('')}
    </div>

    <div class="btn-row mt-8">
      <button class="btn btn-secondary" style="flex:1" onclick="App.guidePrev()" ${isFirst ? 'disabled' : ''}>← Précédent</button>

function renderReadinessCheckinModal() {
  const r = state.readiness;
  const tab = state.readinessTab || 'subjectif';
  const date = todayISO();
  const score = computeReadinessScore({ ...r, date });
  const z = readinessZone(score);
  const today = getTodayReadiness();
  const sig = computeReadinessSignals({ ...r, date });
  const alerts = getReadinessAlerts(sig);

  const renderStars = (key, label) => {
    const val = r[key] || 0;
    let bar = '';
    for (let i = 1; i <= 5; i++) {
      bar += `<button class="rpe-btn ${val === i ? 'selected' : ''}" onclick="App.setReadiness('${key}',${i})" style="font-size:13px">${i}</button>`;
    }
    return `<div class="field"><label class="label">${label}</label><div class="rpe-grid" style="grid-template-columns:repeat(5,1fr)">${bar}</div></div>`;
  };

  const subjTab = `
    ${renderStars('sleep', '😴 Sommeil')}
    ${renderStars('soreness', '💪 Récup musculaire (5 = aucune courbature)')}
    ${renderStars('energy', '⚡ Énergie / motivation')}
    ${renderStars('stress', '🧘 Niveau de stress (5 = zen)')}
  `;

  const renderObjLine = (label, val, baseline, delta, unit, helpKey, alertWhen) => {
    const isAlert = alertWhen != null;
    return `<div class="muted mt-8" style="font-size:11px;color:${isAlert ? '#f59e0b' : 'var(--text-3)'}">
      ${label} : <b style="color:${isAlert ? '#f59e0b' : 'var(--text-2)'}">${val}${unit}</b>
      ${baseline != null ? ` · baseline ${baseline}${unit}` : ' · baseline en cours de construction'}
      ${delta != null ? ` · ${delta > 0 ? '+' : ''}${delta}%` : ''}
    </div>`;
  };

  const objTab = `
    <div class="field">
      <label class="label">🦘 CMJ — saut hauteur (cm) ${helpIcon('cmj')}</label>
      <input type="number" min="0" step="0.5" class="input" value="${r.cmj || ''}" oninput="App.setReadiness('cmj', this.value)" placeholder="ex: 38">
      ${sig.cmj ? renderObjLine('Saut', sig.cmj.value, sig.cmj.baseline, sig.cmj.deltaPct, ' cm', 'cmj', sig.cmj.deltaPct != null && sig.cmj.deltaPct < -5 ? true : null) : ''}
    </div>
    <div class="field">
      <label class="label">🩺 Test orthostatique (FC bpm) ${helpIcon('orthoTest')}</label>
      <div class="row-inputs">
        <input type="number" min="30" max="150" class="input center" value="${r.hrLying || ''}" placeholder="couché 1 min" oninput="App.setReadiness('hrLying', this.value)">
        <input type="number" min="30" max="180" class="input center" value="${r.hrStanding || ''}" placeholder="debout 1 min" oninput="App.setReadiness('hrStanding', this.value)">
      </div>
      ${sig.ortho ? `<div class="muted mt-8" style="font-size:11px;color:${sig.ortho.diff > 20 ? '#f59e0b' : 'var(--text-3)'}">Écart : <b style="color:${sig.ortho.diff > 20 ? '#f59e0b' : 'var(--text-2)'}">+${sig.ortho.diff} bpm</b>${sig.ortho.baselineDiff != null ? ` · baseline +${sig.ortho.baselineDiff} bpm` : ' · baseline en cours'}</div>` : '<div class="muted mt-8" style="font-size:11px">Couché 1 min, puis debout 1 min, puis lis ta FC. Écart >20 bpm = signal de fatigue.</div>'}
    </div>
    <div class="field">
      <label class="label">⚖️ Poids matinal (kg) ${helpIcon('morningWeight')}</label>
      <input type="number" min="30" max="200" step="0.1" class="input" value="${r.weight || ''}" oninput="App.setReadiness('weight', this.value)" placeholder="ex: 72.4">
      ${sig.weight ? renderObjLine('Poids', sig.weight.value, sig.weight.baseline, sig.weight.deltaPct, ' kg', 'morningWeight', sig.weight.deltaPct != null && sig.weight.deltaPct < -2 ? true : null) : ''}
    </div>
    <div class="field">
      <label class="label">💓 HRV — RMSSD (ms, optionnel) ${helpIcon('hrv')}</label>
      <input type="number" min="0" step="1" class="input" value="${r.hrv || ''}" oninput="App.setReadiness('hrv', this.value)" placeholder="ex: 48">
      ${sig.hrv ? renderObjLine('HRV', sig.hrv.value, sig.hrv.baseline, sig.hrv.deltaPct, ' ms', 'hrv', sig.hrv.deltaPct != null && sig.hrv.deltaPct < -7 ? true : null) : ''}
    </div>
  `;

  return `
    <div class="modal-title">🌅 Check-in du matin ${helpIcon('readiness')}</div>
    <div class="modal-sub">Subjectif (4 questions) + objectif (mesures de 90s)</div>
    <div class="modal-tabs">
      <div class="modal-tab ${tab === 'subjectif' ? 'active' : ''}" onclick="App.setReadinessTab('subjectif')">Subjectif</div>
      <div class="modal-tab ${tab === 'objectif' ? 'active' : ''}" onclick="App.setReadinessTab('objectif')">Objectif</div>
    </div>
    ${tab === 'subjectif' ? subjTab : objTab}

    ${alerts.length ? `
      <div class="card mt-8" style="background:rgba(245,158,11,0.1);border-color:#f59e0b">
        <div class="section-label" style="margin-top:0;color:#f59e0b">⚠️ Alertes objectives</div>
        <ul style="margin:0;padding-left:18px;font-size:12px;line-height:1.6;color:#f59e0b">
          ${alerts.map(a => `<li><b>${a.key}</b> : ${escapeHtml(a.msg)}</li>`).join('')}
        </ul>
      </div>
    ` : ''}

    <div class="card mt-8" style="background:linear-gradient(135deg,${z.color}33,${z.color}11);border:1px solid ${z.color}">
      <div class="flex-between">
        <span class="muted" style="font-size:13px">Score readiness</span>
        <b style="color:${z.color};font-size:22px">${score}/100</b>
      </div>
      <div class="muted mt-8" style="font-size:13px">${z.emoji} ${z.label}</div>
    </div>
    ${today ? `<div class="muted center mt-8" style="font-size:11px">⚠️ Tu as déjà fait un check-in aujourd'hui — celui-ci écrasera l'ancien.</div>` : ''}
    <div class="btn-row mt-16">
      <button class="btn btn-secondary" onclick="App.closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="App.submitReadiness()">✓ Valider</button>
    </div>
  `;
}

function renderVdotRecalibrateModal() {
  const t = state.vdotTest;
  const profile = SM.get('profile');
  const currentVdot = profile?.vdot || '?';
  const days = daysSinceLastVdotTest();
  let computed = null;
  if (t.kind === 'cooper' && t.distance) {
    computed = vdotFromCooperMeters(parseInt(t.distance));
  } else if (t.kind === '5k' && (t.timeMin || t.timeSec)) {
    const sec = (parseInt(t.timeMin)||0)*60 + (parseInt(t.timeSec)||0);
    if (sec > 600) computed = calculateVDOT(5, sec);
  } else if (t.kind === '10k' && (t.timeMin || t.timeSec)) {
    const sec = (parseInt(t.timeMin)||0)*60 + (parseInt(t.timeSec)||0);
    if (sec > 1800) computed = calculateVDOT(10, sec);
  }
  return `
    <div class="modal-title">🎯 Recalibration VDOT</div>
    <div class="modal-sub">VDOT actuel : <b>${currentVdot}</b>${days != null ? ` · dernier test il y a ${days}j` : ''}</div>

    <div class="field">
      <label class="label">Choisis un test ${helpIcon('vdotRecalibrate')}</label>
      <div class="option-grid cols-3">
        <button class="option-card ${t.kind==='cooper'?'selected':''}" onclick="App.setVdotTestField('kind','cooper')">
          <span class="option-card-emoji">⏱️</span>
          <div class="option-card-title">Cooper 12'</div>
        </button>
        <button class="option-card ${t.kind==='5k'?'selected':''}" onclick="App.setVdotTestField('kind','5k')">
          <span class="option-card-emoji">🏃</span>
          <div class="option-card-title">5K time trial</div>
        </button>
        <button class="option-card ${t.kind==='10k'?'selected':''}" onclick="App.setVdotTestField('kind','10k')">
          <span class="option-card-emoji">🥇</span>
          <div class="option-card-title">10K time trial</div>
        </button>
      </div>
    </div>

    ${t.kind === 'cooper' ? `
      <div class="field">
        <label class="label">Distance parcourue en 12 min (mètres)</label>
        <input type="number" min="1500" max="5000" class="input" value="${t.distance||''}" oninput="App.setVdotTestField('distance', this.value)" placeholder="ex: 2800">
      </div>
      <div class="muted" style="font-size:11px">Fais 12 min à fond sur piste ou parcours plat connu. Échauffement obligatoire (15-20 min easy + lignes droites).</div>
    ` : `
      <div class="field">
        <label class="label">Temps réalisé (mm:ss)</label>
        <div class="row-inputs">
          <input type="number" min="0" max="120" class="input center" value="${t.timeMin||''}" placeholder="MM" oninput="App.setVdotTestField('timeMin', this.value)">
          <input type="number" min="0" max="59" class="input center" value="${t.timeSec||''}" placeholder="SS" oninput="App.setVdotTestField('timeSec', this.value)">
        </div>
      </div>
      <div class="muted" style="font-size:11px">Effort maximal sur ${t.kind === '5k' ? '5 km' : '10 km'} plat. Échauffement obligatoire.</div>
    `}

    ${computed ? `
      <div class="card mt-8" style="background:linear-gradient(135deg,rgba(124,58,237,.15),rgba(37,99,235,.15));border:1px solid rgba(124,58,237,.4)">
        <div class="flex-between"><span class="muted">Nouveau VDOT</span><b style="font-size:22px;color:var(--accent)">${computed}</b></div>
        <div class="flex-between mt-8"><span class="muted">Variation</span><b style="color:${computed > currentVdot ? '#22c55e' : (computed < currentVdot ? '#ef4444' : 'var(--text-2)')}">${computed > currentVdot ? '+' : ''}${computed - currentVdot}</b></div>
        <div class="muted mt-8" style="font-size:11px">Toutes tes allures cibles seront recalculées. Le plan en cours conservera son volume.</div>
      </div>
    ` : `<div class="muted center mt-8" style="font-size:12px">Saisis les données pour voir ton nouveau VDOT</div>`}

    <div class="btn-row mt-16">
      <button class="btn btn-secondary" onclick="App.closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="App.submitVdotTest()" ${computed ? '' : 'disabled'}>✓ Appliquer (VDOT ${computed||'?'})</button>
    </div>
  `;
}

function renderIntervalSplitsModal() {
  const ref = state.intervalSplits.ref;
  if (!ref) return '';
  const plan = SM.get('plan');
  const sess = plan && plan.planData && plan.planData.weeks[ref.weekIdx] && plan.planData.weeks[ref.weekIdx].sessions[ref.sessionIdx];
  if (!sess) return '';
  const txt = state.intervalSplits.splits || (sess.splits ? sess.splits.join(' ') : '');
  const splits = parseIntervalSplits(txt);
  const variability = computeVariability(splits);
  const z = variabilityZone(variability);
  return `
    <div class="modal-title">⏱️ Splits du fractionné</div>
    <div class="modal-sub">${typeIcon(sess.type)} ${typeLabel(sess.type)} · ${DAY_LONG[sess.dayIndex]}</div>
    <div class="field">
      <label class="label">Temps de chaque fraction ${helpIcon('intervalSplits')}</label>
      <textarea class="textarea" rows="3" placeholder="Format : mm:ss séparés par espace, virgule ou retour ligne. Ex: 1:32 1:30 1:31 1:33 1:34 1:32 1:35 1:33" oninput="App.setIntervalSplitsText(this.value)">${escapeHtml(txt)}</textarea>
    </div>
    ${splits.length > 0 ? `
      <div class="card mt-8" style="background:var(--card-2)">
        <div class="section-label" style="margin-top:0">${splits.length} fraction${splits.length>1?'s':''} détectée${splits.length>1?'s':''}</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;margin-top:8px">
          ${splits.map((s, i) => `<div style="background:var(--card);padding:8px 4px;border-radius:6px;text-align:center;font-size:12px"><b>${formatTimeShort(s)}</b><div class="muted" style="font-size:10px">#${i+1}</div></div>`).join('')}
        </div>
        ${variability != null ? `
          <div class="flex-between mt-8">
            <span class="muted">Variabilité</span>
            <b style="color:${z.color}">${variability}%</b>
          </div>
          <div class="muted mt-8" style="font-size:11px">${z.label}</div>
          <div class="flex-between mt-8">
            <span class="muted">Plus rapide / plus lent</span>
            <b>${formatTimeShort(Math.min(...splits))} / ${formatTimeShort(Math.max(...splits))}</b>
          </div>
          <div class="flex-between mt-8">
            <span class="muted">Moyenne</span>
            <b>${formatTimeShort(splits.reduce((a,b)=>a+b,0)/splits.length)}</b>
          </div>
        ` : ''}
      </div>
    ` : ''}
    <div class="btn-row mt-16">
      <button class="btn btn-secondary" onclick="App.closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="App.saveIntervalSplits()" ${splits.length === 0 ? 'disabled' : ''}>💾 Enregistrer</button>
    </div>
  `;
}

function renderWeekAnalysisModal() {

  const wIdx = m.weekIdx;

  if (m.loading) return `

  if (m.error) return `

    <div class="btn-row mt-16"><button class="btn btn-primary" onclick="App.closeModal()">Fermer</button></div>
  `;
  const r = m.result || {};

function buildIntervalWorkout(totalKm, paceSec) {
  if (!totalKm || totalKm < 3) return null;
  const wu = Math.max(1.5, Math.round(totalKm * 0.22 * 10) / 10);
  const cd = Math.max(1.0, Math.round(totalKm * 0.18 * 10) / 10);
  const quality = Math.max(1.0, Math.round((totalKm - wu - cd) * 10) / 10);
  let repM;
  if (quality > 8) repM = 1000;
  else if (quality > 5.5) repM = 800;
  else if (quality > 3.5) repM = 600;
  else repM = 400;
  let reps = Math.max(4, Math.round((quality * 1000) / repM));
  if (reps > 16) { repM = 800; reps = Math.round((quality * 1000) / repM); }
  const recM = Math.round(repM / 2 / 50) * 50;
  const repSec = Math.round((repM / 1000) * paceSec);
  return { warmupKm: wu, cooldownKm: cd, qualityKm: quality, reps, repMeters: repM, recoveryMeters: recM, repSec };
}

function getCurrentSeason() {
  const m = new Date().getMonth(); // 0..11
  if (m === 11 || m <= 1) return 'winter';
  if (m >= 2 && m <= 4) return 'spring';
  if (m >= 5 && m <= 7) return 'summer';
  return 'autumn';
}
function seasonLabel(s) {
  return { winter: 'Hiver', spring: 'Printemps', summer: 'Été', autumn: 'Automne' }[s] || s;
}
function seasonEmoji(s) {
  return { winter: '❄️', spring: '🌸', summer: '☀️', autumn: '🍂' }[s] || '🌿';
}
function getCurrentMonthYear() {
  const d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
}
function getProfileMetabolism(profile) {
  const fs = getFuelState();
  const pref = fs.preferences || {};
  const p = profile || {};
  return {
    sex: p.sex || pref.sex || 'male',
    age: p.age || pref.age || 30,
    weightKg: p.weightKg || p.weight || pref.weightKg || 70,
    heightCm: p.heightCm || pref.heightCm || null,
    restingHR: p.restingHR || null,

    vdot: p.vdot || null,
  };
}

/* =========================================================================
   ============== MODULE 3 — MOTEUR D'INFÉRENCE ============================
   ========================================================================= */
function computeMicronutrientNeeds(profile, last7DaysLoad, season, subjectiveSignals) {
  const meta = getProfileMetabolism(profile);
  const acwr = calculateACWR();
  const fuelState = getFuelState();
  const overrides = fuelState.customRDAOverrides || {};
  const blood = fuelState.lastBloodTest || null;
  const checkin = subjectiveSignals
    || ((fuelState.weeklyCheckIns || []).slice(-1)[0] && (fuelState.weeklyCheckIns || []).slice(-1)[0].scores)
    || null;
  const activeIds = (fuelState.activeCures || []).map(c => c.id);

  const last7Total = Object.values(last7DaysLoad || {}).reduce((a, b) => a + (b || 0), 0);
  const highLoad = last7Total > 600;

  const results = MICRONUTRIENTS.map(m => {
    const rdaBase = (m.rda[meta.sex] != null ? m.rda[meta.sex] : m.rda.male);
    let target = rdaBase;
    const reasons = [];

    if (m.modulators && m.modulators.season && m.modulators.season[season]) {
      const f = m.modulators.season[season];
      target *= f;
      if (f > 1.05) reasons.push(seasonLabel(season).toLowerCase());
    }
    if (m.modulators && m.modulators.enduranceLoad) {
      const e = m.modulators.enduranceLoad;
      if (acwr.ratio >= 0.8 && acwr.ratio < 1.3) target *= 1 + (e - 1) * 0.5;
      else if (acwr.ratio >= 1.3 && acwr.ratio < 1.5) { target *= e; reasons.push('charge ACWR ' + acwr.ratio.toFixed(2)); }
      else if (acwr.ratio >= 1.5) { target *= e * 1.1; reasons.push('zone rouge ACWR'); }
    }
    if (m.modulators && m.modulators.sweatLoss && season === 'summer' && highLoad) {
      target *= m.modulators.sweatLoss;
      reasons.push('chaleur + volume');
    }
    if (m.id === 'vitamin_d3' && meta.weightKg > 75) target *= (meta.weightKg / 75);
    if (meta.age >= 35 && (m.id === 'coq10' || m.id === 'b12' || m.id === 'vitamin_k2')) {
      target *= 1.2;
      reasons.push('âge ≥ 35');
    }
    if (meta.sex === 'female' && m.id === 'iron') reasons.push('profil femme');

    let currentEstimate = rdaBase * 0.8;
    if (blood && blood.parsedMarkers && blood.parsedMarkers[m.id] != null) {
      currentEstimate = blood.parsedMarkers[m.id];
      reasons.push('bilan sanguin');
    }
    if (overrides[m.id] != null) currentEstimate = overrides[m.id];

    if (checkin) {
      if (m.id === 'magnesium' && (checkin.crampes >= 4 || checkin.sommeil >= 4)) {
        currentEstimate *= 0.6;
        if (checkin.crampes >= 4) reasons.push('crampes signalées');
        if (checkin.sommeil >= 4) reasons.push('sommeil dégradé');
      }
      if (m.id === 'iron' && checkin.energie >= 4) { currentEstimate *= 0.75; reasons.push('fatigue persistante'); }
      if (m.id === 'b12' && checkin.energie >= 4) currentEstimate *= 0.8;
      if (m.id === 'vitamin_d3' && checkin.infections >= 3) { currentEstimate *= 0.7; reasons.push('infections récentes'); }
      if (m.id === 'zinc' && checkin.infections >= 4) { currentEstimate *= 0.7; reasons.push('immunité fragile'); }
      if (m.id === 'omega3' && checkin.recup >= 4) { currentEstimate *= 0.75; reasons.push('récupération lente'); }
      if (m.id === 'potassium' && checkin.crampes >= 4) currentEstimate *= 0.75;
    }

    const ratio = currentEstimate / target;
    let status;
    if (ratio < 0.5) status = 'critical';
    else if (ratio < 0.85) status = 'low';
    else if (ratio < 1.5) status = 'optimal';
    else status = 'excess';

    const deficitScore = Math.max(0, Math.min(1, 1 - ratio));
    const cureRecommended = (status === 'critical' || status === 'low');
    const isActive = activeIds.includes(m.id);

    return {
      id: m.id,
      name: m.name,
      emoji: m.emoji,
      unit: m.unit,
      status,
      currentEstimate: Math.round(currentEstimate * 10) / 10,
      target: Math.round(target),
      targetRange: [Math.round(target * 0.85), Math.round(target * 1.15)],
      deficitScore,
      cureRecommended,
      isActive,
      reasoning: reasons.length ? reasons.slice(0, 3).join(' + ') : 'profil de base',
      priority: m.priorityRunner * (1 + deficitScore * 2.5),
      ref: m,
    };
  });

  results.sort((a, b) => b.priority - a.priority);
  return results;
}

function computeFuelScore(needs) {
  if (!needs || !needs.length) return 0;
  let weighted = 0, totalW = 0;
  for (const n of needs) {
    const w = n.ref.priorityRunner;
    let s = 100;
    if (n.status === 'critical') s = 25;
    else if (n.status === 'low') s = 60;
    else if (n.status === 'excess') s = 80;
    weighted += s * w;
    totalW += w;
  }
  return totalW > 0 ? Math.round(weighted / totalW) : 0;
}

   ============== MODULE 4 — CURES (start / log / complete) ================
   ========================================================================= */
function getCureDurationDays(microId) {
  const m = MICRONUTRIENTS.find(x => x.id === microId);
  if (!m) return 42;
  const txt = m.cureProtocol.duration || '';
  const match = txt.match(/(\d+)/g);
  if (!match) return 42;
  // moyenne des deux nombres si "6-8 semaines" → 7
  const nums = match.map(Number);
  const avg = nums.reduce((a, b) => a + b, 0) / nums.length;
  if (/mois/i.test(txt)) return Math.round(avg * 30);
  if (/semaine/i.test(txt)) return Math.round(avg * 7);
  return Math.round(avg);
}
function startCure(microId) {
  const fs = getFuelState();
  if (fs.activeCures.length >= 2) {
    showToast('Maximum 2 cures simultanées — termine-en une avant', 'warning');
    return false;
  }
  if (fs.activeCures.some(c => c.id === microId)) {
    showToast('Cure déjà active', 'info');
    return false;
  }
  // antagonisme
  const antagonist = detectAntagonist(microId, fs.activeCures.map(c => c.id));
  if (antagonist) {
    showToast('⚠️ Antagonisme avec ' + antagonist + ' — espacer 2h les prises', 'warning');
  }
  fs.activeCures.push({
    id: microId,
    startDate: todayISO(),
    durationDays: getCureDurationDays(microId),
    dailyLog: [],
  });
  setFuelState(fs);
  XPBridge.addXP(20);
  showToast('🚀 Cure démarrée — bonne route !', 'success');
  return true;
}
function logCureToday(microId) {
  const fs = getFuelState();
  const cure = fs.activeCures.find(c => c.id === microId);
  if (!cure) return false;
  const t = todayISO();
  if (cure.dailyLog.includes(t)) {
    showToast('Déjà loggé aujourd\'hui', 'info');
    return false;
  }
  cure.dailyLog.push(t);
  setFuelState(fs);
  XPBridge.addXP(5);
  showToast('+5 XP — bien joué', 'success');
  // auto-complete si fin atteinte
  const elapsed = daysBetween(cure.startDate, t);
  if (elapsed >= cure.durationDays) {
    completeCure(microId);
  }
  return true;
}
function completeCure(microId) {
  const fs = getFuelState();
  const idx = fs.activeCures.findIndex(c => c.id === microId);
  if (idx < 0) return;
  const c = fs.activeCures.splice(idx, 1)[0];
  c.completedAt = todayISO();
  fs.completedCures.push(c);
  setFuelState(fs);
  showToast('🏁 Cure terminée — bilan dispo dans Stats', 'success');
}
function stopCure(microId) {
  const fs = getFuelState();
  const idx = fs.activeCures.findIndex(c => c.id === microId);
  if (idx < 0) return;
  fs.activeCures.splice(idx, 1);
  setFuelState(fs);
  showToast('Cure arrêtée', 'info');
}
function daysBetween(iso1, iso2) {
  const d1 = new Date(iso1), d2 = new Date(iso2);
  return Math.round((d2 - d1) / 86400000);
}
function cureProgress(cure) {
  const elapsed = Math.max(0, daysBetween(cure.startDate, todayISO()));
  const pct = Math.min(100, Math.round((elapsed / cure.durationDays) * 100));
  return { elapsed, total: cure.durationDays, pct };
}

  weekly_coach: 24 * 3600 * 1000,          // 1 jour

function _aiCacheGet(feature, key) {
  if (!AI_CACHE_TTL[feature]) return null;
  const all = SM.get('aiResponseCache', {});
  const e = all[feature + '|' + key];
  if (!e) return null;
  if (Date.now() - e.ts > AI_CACHE_TTL[feature]) return null;
  return e.data;
}
function _aiCacheSet(feature, key, data) {
  if (!AI_CACHE_TTL[feature]) return;
  const all = SM.get('aiResponseCache', {});
  all[feature + '|' + key] = { ts: Date.now(), data };
  // garde max 50 entrées
  const keys = Object.keys(all);
  if (keys.length > 50) keys.slice(0, keys.length - 50).forEach(k => delete all[k]);
  SM.set('aiResponseCache', all);
}

function _tryParseJSONFromAI(content) {
  if (content == null) return { ok: false, error: 'empty' };
  let s = String(content).trim();
  // Strip code fences (```json ... ``` or ``` ... ```)
  s = s.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
  // Direct parse first
  try { return { ok: true, data: JSON.parse(s) }; } catch (_) {}
  // Find the largest balanced {...} or [...] in the text
  const tryRange = (open, close) => {
    const start = s.indexOf(open);
    if (start < 0) return null;
    let depth = 0, inStr = false, esc = false;
    for (let i = start; i < s.length; i++) {
      const ch = s[i];
      if (inStr) {
        if (esc) { esc = false; continue; }
        if (ch === '\\') { esc = true; continue; }
        if (ch === '"') inStr = false;
        continue;
      }
      if (ch === '"') { inStr = true; continue; }
      if (ch === open) depth++;
      else if (ch === close) {
        depth--;
        if (depth === 0) return s.slice(start, i + 1);
      }
    }
    return null;
  };
  const obj = tryRange('{', '}');
  if (obj) { try { return { ok: true, data: JSON.parse(obj) }; } catch (_) {} }
  const arr = tryRange('[', ']');
  if (arr) { try { return { ok: true, data: JSON.parse(arr) }; } catch (_) {} }
  // Try removing trailing commas (common LLM mistake)
  const noTrail = s.replace(/,(\s*[}\]])/g, '$1');
  try { return { ok: true, data: JSON.parse(noTrail) }; } catch (e) { return { ok: false, error: e.message }; }
}

async function askAI(messages, options) {
  options = options || {};
  const provider = getActiveProvider();
  const apiKey = getApiKey();
  if (!apiKey) return { ok: false, reason: 'no_key' };
  if (!aiAvailable()) return { ok: false, reason: 'unavailable' };

  // Cache hit ?
  if (options.feature && options.cacheKey && AI_CACHE_TTL[options.feature]) {
    const cached = _aiCacheGet(options.feature, options.cacheKey);
    if (cached && !options._bypassCache) return { ok: true, data: cached, fromCache: true };
  }

  const model = resolveModel(options.model);
  const ctrl = new AbortController();
  const timeout = setTimeout(() => ctrl.abort(), OPENROUTER_CONFIG.timeoutMs);

  const body = provider.buildBody(model, messages, options);

  try {
    const res = await fetch(provider.baseURL, {
      method: 'POST',
      headers: provider.headers(apiKey),
      body: JSON.stringify(body),
      signal: ctrl.signal,
    });
    clearTimeout(timeout);

    if (res.status === 401 || res.status === 403) {
      window.dispatchEvent(new CustomEvent('ai:keyInvalid'));
      return { ok: false, reason: 'invalid_key' };
    }
    if (res.status === 402) {
      // Cascade auto sur 402 : ultra-cheap puis modèles :free (consomment 0 crédit)
      const CREDIT_FALLBACKS = [
        'google/gemini-flash-1.5-8b',                       // ultra-cheap payant
        'google/gemini-2.0-flash-exp:free',                 // gratuit
        'meta-llama/llama-3.3-70b-instruct:free',           // gratuit
        'google/gemma-2-9b-it:free',                        // gratuit
        'meta-llama/llama-3.1-8b-instruct:free',            // gratuit
      ];
      if (provider.id === 'openrouter') {
        options._creditTried = options._creditTried || [];
        options._creditTried.push(model);
        const next = CREDIT_FALLBACKS.find(m => !options._creditTried.includes(m));
        if (next) {
          clearTimeout(timeout);
          await new Promise(r => setTimeout(r, 200));
          return askAI(messages, Object.assign({}, options, { model: next, _modelOverridden: true }));
        }
      }
      return { ok: false, reason: 'insufficient_credit' };
    }
    if (res.status === 429) return { ok: false, reason: 'rate_limited' };
    // Auto-fallback sur 404/400 : modèle inexistant → cascade de modèles stables, puis :free en ultime
    if ((res.status === 404 || res.status === 400) && provider.id === 'openrouter') {
      const STABLE_FALLBACKS = [
        // Payants ultra-stables (présents depuis longtemps)
        'openai/gpt-4o-mini',
        'google/gemini-2.0-flash-001',
        'google/gemini-flash-1.5-8b',
        'anthropic/claude-3-5-haiku',
        'mistralai/mistral-small-latest',
        'meta-llama/llama-3.3-70b-instruct',
        // Si tous les payants échouent, tente les :free (consomment 0 crédit)
        'google/gemini-2.0-flash-exp:free',
        'google/gemma-2-9b-it:free',
        'meta-llama/llama-3.3-70b-instruct:free',
        'meta-llama/llama-3.1-8b-instruct:free',
        'qwen/qwen-2.5-72b-instruct:free',
      ];
      options._modelTried = options._modelTried || [];
      options._modelTried.push(model);
      const next = STABLE_FALLBACKS.find(m => !options._modelTried.includes(m));
      if (next) {
        clearTimeout(timeout);
        return askAI(messages, Object.assign({}, options, { model: next, _modelOverridden: true }));
      }
    }
    if (!res.ok) return { ok: false, reason: 'http_' + res.status };

    const data = await res.json();
    const content = provider.parseContent(data);
    const usage = provider.parseUsage(data);
    trackAIUsage(options.feature || 'unknown', usage, model, provider.id);

    if (options.expectJSON) {
      const parsed = _tryParseJSONFromAI(content);
      if (parsed.ok) {
        if (options.feature && options.cacheKey) _aiCacheSet(options.feature, options.cacheKey, parsed.data);
        return { ok: true, data: parsed.data, raw: content };
      }
      return { ok: false, reason: 'json_parse', raw: content, parseError: parsed.error };
    }
    if (options.feature && options.cacheKey) _aiCacheSet(options.feature, options.cacheKey, content);
    return { ok: true, text: content };
  } catch (err) {
    clearTimeout(timeout);
    return { ok: false, reason: err && err.name === 'AbortError' ? 'timeout' : 'network' };
  }
}

async function validateApiKey(rawKey, providerId) {
  const prov = providerId ? AI_PROVIDERS[providerId] : getActiveProvider();
  if (!prov) return { valid: false, reason: 'provider_inconnu' };
  if (!rawKey || rawKey.length < 10) return { valid: false, reason: 'format_invalide' };
  if (prov.keyPrefix && !rawKey.startsWith(prov.keyPrefix)) return { valid: false, reason: 'mauvais_prefixe' };
  if (!prov.validateUrl) {
    // Pas d'endpoint de validation : tente une requête minimale
    const tmpKey = rawKey;
    try {
      const res = await fetch(prov.baseURL, {
        method: 'POST',
        headers: prov.headers(tmpKey),
        body: JSON.stringify(prov.buildBody(prov.defaultFast, [{ role: 'user', content: 'hi' }], { maxTokens: 5 })),
      });
      if (res.status === 401 || res.status === 403) return { valid: false, reason: 'cle_refusee' };
      if (res.status === 402) return { valid: true, creditRemaining: 0, label: 'crédit insuffisant mais clé valide' };
      if (!res.ok) return { valid: false, reason: 'erreur_serveur' };
      return { valid: true, creditRemaining: null, label: prov.name };
    } catch (e) { return { valid: false, reason: 'reseau' }; }
  }
  try {
    const res = await fetch(prov.validateUrl, { method: 'GET', headers: prov.headers(rawKey) });
    if (res.status === 401 || res.status === 403) return { valid: false, reason: 'cle_refusee' };
    if (!res.ok) return { valid: false, reason: 'erreur_serveur' };
    if (prov.id === 'openrouter') {
      const data = await res.json();
      const d = (data && data.data) || {};
      return { valid: true, creditRemaining: d.limit_remaining != null ? d.limit_remaining : null, limit: d.limit, label: d.label || null };
    }
    return { valid: true, creditRemaining: null, label: prov.name };
  } catch (e) {
    return { valid: false, reason: 'reseau' };
  }
}

/* ===================== Pricing lookup (multi-provider) ==================== */
function getPricingFor(model, providerId) {
  const prov = providerId ? AI_PROVIDERS[providerId] : null;
  if (prov) {
    const m = prov.models.find(x => x.id === model);
    if (m) return { in: m.in, out: m.out };
  }
  // fallback : recherche dans tous les providers
  for (const pid of Object.keys(AI_PROVIDERS)) {
    const m = AI_PROVIDERS[pid].models.find(x => x.id === model);
    if (m) return { in: m.in, out: m.out };
  }
  return { in: 0.001, out: 0.005 };
}
