<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Background -->
  <rect width="1024" height="1024" fill="#0a0b0d"/>

  <!-- Subtle gradient overlay -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#d4a843" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0a0b0d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8be58"/>
      <stop offset="100%" stop-color="#b88a2c"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- Main F + period (financial ticker style) -->
  <g transform="translate(512, 540)">
    <!-- Letter F -->
    <text x="-160" y="60"
          text-anchor="middle"
          font-family="Georgia, serif"
          font-style="italic"
          font-weight="800"
          font-size="560"
          fill="url(#gold)"
          letter-spacing="-20">F</text>
    <!-- Period (ticker dot) -->
    <circle cx="170" cy="100" r="55" fill="#0db77b"/>
  </g>

  <!-- Bottom corner ticker label -->
  <text x="512" y="900"
        text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', monospace"
        font-weight="600"
        font-size="44"
        fill="#50525a"
        letter-spacing="14">FINMOT</text>

  <!-- Top-left grain accent (3 small tiles like the wordle grid) -->
  <g transform="translate(80, 80)" opacity="0.55">
    <rect x="0"   y="0" width="60" height="60" rx="6" fill="#0db77b"/>
    <rect x="74"  y="0" width="60" height="60" rx="6" fill="#d4a843"/>
    <rect x="148" y="0" width="60" height="60" rx="6" fill="#25282e"/>
  </g>
</svg>
