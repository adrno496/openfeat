<style>
/* ===== TOKENS ===== */
:root{
  --radius:14px;--radius-sm:8px;--radius-lg:20px;
  --easing:cubic-bezier(.2,.7,.2,1);
  --user-accent:#FF6B35;
  --font-display:"Bebas Neue",system-ui,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --topbar-h:56px;--sidebar-w:248px;
}
:root[data-theme="dark"],:root[data-theme="auto"]{
  --bg:#0A0A0F;--bg-alt:#0E0E14;--surface:#161616;--surface-2:#1c1c22;
  --border:#2a2a2a;--text:#F5F5F7;--text-dim:#9a9aa6;--text-mute:#6a6a76;
  --accent:var(--user-accent);--accent-glow:rgba(255,107,53,.35);
  --green:#00CC88;--red:#FF4444;--gold:#FFCC00;--blue:#4A9EFF;--purple:#B847FF;
  --shadow-card:0 1px 0 rgba(255,255,255,.04) inset,0 8px 24px rgba(0,0,0,.4);
}
:root[data-theme="light"]{
  --bg:#FAFAFB;--bg-alt:#F2F2F5;--surface:#FFFFFF;--surface-2:#F5F5F7;
  --border:#E5E5E8;--text:#0A0A0F;--text-dim:#4a4a52;--text-mute:#8a8a92;
  --accent:var(--user-accent);--accent-glow:rgba(255,107,53,.25);
  --green:#00A66B;--red:#D93636;--gold:#B89400;--blue:#2680E8;--purple:#8E2FE5;
  --shadow-card:0 1px 0 rgba(0,0,0,.02) inset,0 4px 12px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: light){:root[data-theme="auto"]{--bg:#FAFAFB;--bg-alt:#F2F2F5;--surface:#FFFFFF;--surface-2:#F5F5F7;--border:#E5E5E8;--text:#0A0A0F;--text-dim:#4a4a52;--text-mute:#8a8a92;--green:#00A66B;--red:#D93636;--gold:#B89400;--blue:#2680E8;--purple:#8E2FE5;--shadow-card:0 1px 0 rgba(0,0,0,.02) inset,0 4px 12px rgba(0,0,0,.06);}}

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .3s var(--easing),color .3s var(--easing)}
body{min-height:100vh;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ===== LAYOUT ===== */
html,body{width:100%;height:100%}
.app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;width:100%}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;height:var(--topbar-h);padding:0 16px;background:var(--bg-alt);border-bottom:1px solid var(--border);backdrop-filter:blur(8px);width:100%;flex-shrink:0}
.topbar .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:22px;letter-spacing:.04em}
.topbar .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent-glow)}
.topbar .spacer{flex:1}
.topbar button.icon-btn,.topbar select.profile-select{background:var(--surface);border:1px solid var(--border);color:var(--text);height:36px;border-radius:var(--radius-sm);padding:0 10px;cursor:pointer}
.topbar select.profile-select{min-width:140px;max-width:220px}
.topbar button.icon-btn:hover{background:var(--surface-2)}
.shell{display:flex;flex:1;min-height:0;width:100%}
.sidebar{background:var(--bg-alt);border-right:1px solid var(--border);padding:16px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;width:var(--sidebar-w);flex-shrink:0}
.sidebar .group{margin-top:12px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-mute);padding:0 8px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;color:var(--text-dim);border:1px solid transparent;transition:all .15s var(--easing)}
.nav-item:hover{background:var(--surface);color:var(--text)}
.nav-item.active{background:var(--surface);color:var(--text);border-color:var(--border);box-shadow:inset 3px 0 0 var(--accent)}
.nav-item .ico{width:18px;text-align:center;font-size:15px;flex-shrink:0}
.main{padding:28px 32px;overflow-y:auto;flex:1;min-width:0}
.main .container{max-width:1280px;margin:0 auto;width:100%}
@media (max-width:880px){.main{padding:18px}}
@media (max-width:880px){
  .sidebar{position:fixed;left:0;top:var(--topbar-h);bottom:0;width:84vw;max-width:320px;z-index:50;transform:translateX(-100%);transition:transform .25s var(--easing);flex-shrink:1}
  .sidebar.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.5)}
  .scrim{position:fixed;inset:var(--topbar-h) 0 0 0;background:rgba(0,0,0,.5);z-index:45;opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.show{opacity:1;pointer-events:auto}
  .main{padding:16px}
  .topbar .menu-btn{display:inline-flex!important}
}
.menu-btn{display:none;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);cursor:pointer}

/* ===== COMPONENTS ===== */
h1,h2,h3{font-family:var(--font-display);letter-spacing:.02em;margin:0 0 12px}
h1{font-size:36px;line-height:1.1}
h2{font-size:24px}
h3{font-size:18px;font-family:var(--font-body);font-weight:700}
p{margin:0 0 10px;color:var(--text-dim)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-card)}
.container > .card+.card,.container > .card+.grid,.container > .grid+.card,.container > .grid+.grid,.container > h1+.card,.container > h1+.grid,.container > p+.card,.container > p+.grid{margin-top:18px}
.grid{display:grid;gap:16px}
.grid > .card,.grid > .module-card,.grid > .qp-card,.grid > .kpi-card{margin-top:0!important}
.grid.cols-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.grid.cols-3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid.cols-4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.container h1{margin-bottom:6px}
.container h1+p.dim{margin-top:0;margin-bottom:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-weight:600;transition:all .15s var(--easing)}
.btn:hover{background:var(--surface-2);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff;box-shadow:0 6px 18px var(--accent-glow)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.sm{padding:6px 10px;font-size:12px}
input[type=text],input[type=url],input[type=password],input[type=email],input[type=number],input[type=color],select,textarea{width:100%;padding:9px 11px;background:var(--bg-alt);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{min-height:90px;resize:vertical;font-family:var(--font-body)}
label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:4px;font-weight:600}
.field{margin-bottom:12px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);font-size:11px;color:var(--text-dim)}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .num{font-family:var(--font-mono);font-size:28px;font-weight:700;color:var(--text)}
.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-mute)}
.bizcard{padding:16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);cursor:pointer;transition:all .15s var(--easing);position:relative}
.bizcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.bizcard.selected{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.bizcard .emoji{font-size:28px}
.bizcard h4{margin:6px 0 4px;font-size:14px}
.bizcard p{font-size:12px;margin:0}
.steps{display:flex;gap:8px;margin-bottom:24px}
.step{flex:1;height:6px;border-radius:3px;background:var(--surface-2)}
.step.done{background:var(--accent)}
.step.active{background:linear-gradient(90deg,var(--accent),transparent 90%)}

/* toasts */
.toasts{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);padding:10px 14px;border-radius:var(--radius-sm);box-shadow:var(--shadow-card);animation:slidein .25s var(--easing)}
.toast.error{border-left-color:var(--red)}
.toast.success{border-left-color:var(--green)}
@keyframes slidein{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

/* modal */
.modal-root{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
.modal-root.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);max-width:560px;width:100%;max-height:85vh;overflow-y:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h2{margin-top:0}

/* command palette */
.palette-root{position:fixed;inset:0;z-index:280;display:none;align-items:flex-start;justify-content:center;padding:80px 20px 20px;background:rgba(0,0,0,.5)}
.palette-root.show{display:flex}
.palette{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);width:100%;max-width:520px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.palette input{border:none;border-radius:0;border-bottom:1px solid var(--border);background:transparent;padding:14px 16px;font-size:15px}
.palette ul{list-style:none;padding:6px;margin:0;max-height:50vh;overflow-y:auto}
.palette li{padding:9px 12px;border-radius:var(--radius-sm);cursor:pointer;display:flex;gap:10px;align-items:center}
.palette li.sel,.palette li:hover{background:var(--surface-2)}
.palette li .hint{margin-left:auto;font-size:11px;color:var(--text-mute);font-family:var(--font-mono)}

/* skeleton */
.skel{background:linear-gradient(90deg,var(--surface-2) 0%,var(--border) 50%,var(--surface-2) 100%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:var(--radius-sm);height:14px;margin:6px 0}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* streamed output */
.gen-output{white-space:pre-wrap;font-family:var(--font-body);background:var(--bg-alt);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;min-height:60px;line-height:1.6}
.gen-output.streaming::after{content:"▎";color:var(--accent);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.cursor{display:inline-block;width:2px;height:1em;background:var(--accent);vertical-align:text-bottom;animation:blink 1s steps(2) infinite}

/* hooks/cards */
.day-cell{background:var(--bg-alt);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;cursor:grab}
.day-cell .d{font-family:var(--font-mono);font-size:11px;color:var(--text-mute)}
.day-cell h4{margin:4px 0 6px;font-size:13px}
.day-cell.dragging{opacity:.4}

@media print{
  .topbar,.sidebar,.scrim,.toasts,.modal-root,.palette-root,.no-print{display:none!important}
  .main{padding:0}
  body{background:#fff;color:#000}
}

@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

body.focus-mode .topbar,body.focus-mode .sidebar{display:none}
body.focus-mode .main{padding:40px}
body.focus-mode .container{max-width:840px}
.focus-exit{display:none;position:fixed;top:14px;right:14px;z-index:300;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.focus-exit:hover{background:var(--surface-2);border-color:var(--accent)}
body.focus-mode .focus-exit{display:inline-flex;align-items:center;gap:6px}
body.onboarding .sidebar{display:none}
body.onboarding .main{padding:32px}
body.onboarding .container{max-width:960px}

.gen-output h1,.gen-output h2,.gen-output h3{margin:.8em 0 .4em;font-family:var(--font-body);font-weight:700}
.gen-output h1{font-size:20px}.gen-output h2{font-size:17px}.gen-output h3{font-size:15px}
.gen-output p{margin:.5em 0;color:var(--text)}
.gen-output ul,.gen-output ol{margin:.4em 0;padding-left:24px}
.gen-output code{background:var(--surface-2);padding:1px 5px;border-radius:4px;font-family:var(--font-mono);font-size:.9em}
.gen-output pre{background:var(--surface-2);padding:10px;border-radius:var(--radius-sm);overflow-x:auto}
.gen-output blockquote{border-left:3px solid var(--accent);margin:.6em 0;padding:.2em 12px;color:var(--text-dim)}
.budget-alert{background:var(--red);color:#fff;padding:8px 16px;text-align:center;font-weight:600;font-size:13px}

/* Jobs drawer */
.jobs-drawer{position:fixed;top:var(--topbar-h);right:0;bottom:0;width:380px;max-width:100vw;background:var(--surface);border-left:1px solid var(--border);transform:translateX(100%);transition:transform .25s var(--easing);z-index:60;display:flex;flex-direction:column;box-shadow:-8px 0 32px rgba(0,0,0,.3)}
.jobs-drawer.open{transform:translateX(0)}
.jobs-drawer header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.jobs-drawer .body{flex:1;overflow-y:auto;padding:10px}
.job{padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;background:var(--bg-alt)}
.job .head{display:flex;gap:8px;align-items:center;font-size:12px}
.job .lbl{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job .status{font-size:10px;padding:2px 7px;border-radius:999px;background:var(--surface-2);text-transform:uppercase;letter-spacing:.06em}
.job .status.running{background:var(--accent);color:#fff}
.job .status.done{background:var(--green);color:#fff}
.job .status.error{background:var(--red);color:#fff}
.job .preview{margin-top:6px;font-size:11px;color:var(--text-dim);max-height:60px;overflow:hidden;line-height:1.4}
.job .actions{margin-top:6px;display:flex;gap:6px}

/* Badge */
.icon-btn .badge{display:inline-block;background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;margin-left:4px;min-width:16px;text-align:center}

/* Sidebar collapse */
:root[data-sidebar="collapsed"]{--sidebar-w:64px}
[data-sidebar="collapsed"] .nav-item span:not(.ico){display:none}
[data-sidebar="collapsed"] .sidebar .group{display:none}
[data-sidebar="collapsed"] .nav-item{justify-content:center}
@media (min-width:881px){.collapse-btn{display:inline-flex!important;align-items:center;justify-content:center;width:36px;height:36px}}
[data-sidebar="collapsed"] #collapseBtn{transform:rotate(180deg)}

/* Voice button */
.voice-btn{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;z-index:2}
.voice-btn.recording{background:var(--red);border-color:var(--red);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,68,68,.6)}50%{box-shadow:0 0 0 8px rgba(255,68,68,0)}}
.ta-wrap{position:relative}

/* Cost confirm */
.cost-warn{background:var(--gold);color:#000;padding:8px 12px;border-radius:var(--radius-sm);margin-bottom:10px;font-size:13px}

/* Empty state */
.empty{text-align:center;padding:40px 20px;color:var(--text-mute)}
.empty .em{font-size:48px;margin-bottom:10px;opacity:.4}

/* Module cards on dashboard */
.module-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;cursor:pointer;transition:all .18s var(--easing);display:flex;flex-direction:column;gap:6px;min-height:120px}
.module-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px var(--accent-glow)}
.module-card .ico{font-size:28px;line-height:1}
.module-card h3{margin:4px 0 0;font-size:15px}
.module-card p{margin:0;font-size:12px;color:var(--text-mute)}

/* Quick prompts grid */
.qp-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;cursor:pointer;text-align:left;transition:all .18s var(--easing);font-size:13px;font-weight:600;line-height:1.3;display:flex;flex-direction:column;gap:4px;min-height:78px}
.qp-card:hover{border-color:var(--accent);background:var(--surface-2);transform:translateY(-1px)}
.qp-card .em{font-size:22px;line-height:1}

/* KPI cards */
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}

.field+.field{margin-top:14px}
.row{gap:12px}
h3{margin-top:0}
.card h3:first-child{margin-top:0;margin-bottom:14px}
hr{margin:18px 0}

.dim{color:var(--text-dim)}
.mute{color:var(--text-mute)}
.mono{font-family:var(--font-mono)}
.right{margin-left:auto}
.hidden{display:none!important}
hr{border:none;border-top:1px solid var(--border);margin:14px 0}
</style>
</head>
<body>
<div class="app" id="appRoot">
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
    <div class="brand"><span class="dot"></span><span>BuilderAi</span></div>
    <div class="spacer"></div>
    <button class="icon-btn" id="backBtn" aria-label="Retour" title="Retour" style="display:none">←</button>
    <button class="icon-btn collapse-btn" id="collapseBtn" aria-label="Replier la sidebar" title="Replier (⌘B)" style="display:none">«</button>
    <select class="profile-select" id="profileSelect" aria-label="Profil actif"></select>
    <button class="icon-btn" id="jobsBtn" aria-label="Tâches en cours" title="Tâches">
      <span>⚡</span><span class="badge" id="jobsBadge" style="display:none">0</span>
    </button>
    <button class="icon-btn" id="focusBtn" aria-label="Mode focus" title="Mode focus (⌘F)">🎯</button>

function migrateProfile(p){
  if(!p.providers)return;
  p.providers.keyVaults=p.providers.keyVaults||{};
  p.providers.defaultKeyId=p.providers.defaultKeyId||{};
  p.providers.moduleOverrides=p.providers.moduleOverrides||{}; // {moduleId: {provider, keyId}}
  for(const provId in (p.providers.keys||{})){
    const v=p.providers.keys[provId];
    if(!v)continue;
    const list=p.providers.keyVaults[provId]||[];
    if(!list.some(k=>k.key===v)){
      const id=uid('k');list.push({id,label:'Défaut',key:v});p.providers.keyVaults[provId]=list;
      if(!p.providers.defaultKeyId[provId])p.providers.defaultKeyId[provId]=id;
    }
  }
}

function getKeyForCall(provId,moduleId){

async function openaiLike(url,{key,model,system,user,onChunk,signal},extra={}){
  const r=await fetch(url,{method:'POST',signal,headers:Object.assign({Authorization:'Bearer '+key,'content-type':'application/json'},extra),body:JSON.stringify({model,messages:[{role:'system',content:system},{role:'user',content:user}],stream:true})});
  if(!r.ok){let m='HTTP '+r.status;try{const j=await r.json();m=j.error?.message||m}catch(e){}throw new Error(m)}
  return await sseRead(r,onChunk,'openai');
}

async function sseRead(response,onChunk,format){
  const reader=response.body.getReader();const dec=new TextDecoder();
  let buf='';let full='';let tin=0,tout=0;
  while(true){
    const {done,value}=await reader.read();if(done)break;
    buf+=dec.decode(value,{stream:true});
    const lines=buf.split('\n');buf=lines.pop();
    for(const line of lines){
      const m=line.match(/^data:\s*(.*)$/);if(!m)continue;
      const data=m[1].trim();if(data==='[DONE]')continue;
      try{
        const j=JSON.parse(data);
        let delta='';
        if(format==='claude'){
          if(j.type==='content_block_delta'&&j.delta?.text)delta=j.delta.text;
          if(j.type==='message_start'&&j.message?.usage)tin=j.message.usage.input_tokens||0;
          if(j.type==='message_delta'&&j.usage?.output_tokens)tout=j.usage.output_tokens;
        }else if(format==='gemini'){
          delta=j.candidates?.[0]?.content?.parts?.[0]?.text||'';
          if(j.usageMetadata){tin=j.usageMetadata.promptTokenCount||tin;tout=j.usageMetadata.candidatesTokenCount||tout}
        }else{// openai-like
          delta=j.choices?.[0]?.delta?.content||'';
          if(j.usage){tin=j.usage.prompt_tokens||tin;tout=j.usage.completion_tokens||tout}
        }
        if(delta){full+=delta;onChunk&&onChunk(delta,full)}
      }catch(e){/* ignore parse */}
    }
  }
  if(!tin)tin=Math.ceil((full.length)/4);
  if(!tout)tout=Math.ceil(full.length/4);
  return{text:full,tokensIn:tin,tokensOut:tout};
}

// AI gateway: chooses provider+model, tracks cost, supports fallback
async function aiCall({moduleId,system,user,onChunk,modelOverride,controller}){
  const p=activeProfile();if(!p)throw new Error('Pas de profil');
  const provId=getProviderForModule(moduleId)||p.providers?.active||'demo';
  const provider=PROVIDERS[provId];if(!provider)throw new Error('Provider inconnu: '+provId);
  const key=getKeyForCall(provId,moduleId);
  let modelId=modelOverride||getModelForModule(moduleId,provId)||provider.models[0].id;
  if(p.providers?.autoRouting&&!modelOverride){const auto=autoRouteModel(provId,moduleId,(system+user).length);if(auto)modelId=auto}
  const t0=performance.now();
  const ctrl=controller||new AbortController();
  let res;let usedProv=provId;let usedModel=modelId;let usedPricing=provider.pricing;
  try{
    res=await provider.call({key,model:modelId,system,user,onChunk,signal:ctrl.signal});
  }catch(e){
    // do NOT fallback on user-initiated abort
    if(e.name==='AbortError'||/aborted/i.test(e.message||''))throw e;
    const fb=p.providers?.fallback;
    if(fb&&fb!==provId&&PROVIDERS[fb]){
      toast('Bascule sur '+PROVIDERS[fb].label,'success');
      const k2=getKeyForCall(fb,moduleId);
      const fbModel=getModelForModule(moduleId,fb)||PROVIDERS[fb].models[0].id;
      res=await PROVIDERS[fb].call({key:k2,model:fbModel,system,user,onChunk,signal:ctrl.signal});
      usedProv=fb;usedModel=fbModel;usedPricing=PROVIDERS[fb].pricing;
    }else throw e;
  }
  const dt=Math.round(performance.now()-t0);
  const cost=((res.tokensIn||0)*usedPricing.input+(res.tokensOut||0)*usedPricing.output)/1e6;
  // history
  const h={id:uid('h'),profileId:p.id,moduleId,input:{system,user},output:res.text,provider:usedProv,model:usedModel,tokensIn:res.tokensIn,tokensOut:res.tokensOut,costUSD:cost,durationMs:dt,favorite:false,tags:[],createdAt:new Date().toISOString()};
  STORE.history.unshift(h);if(STORE.history.length>500)STORE.history.length=500;
  // usage
  const ym=new Date().toISOString().slice(0,7);
  STORE.usage.byMonth[ym]=STORE.usage.byMonth[ym]||{totalUSD:0,byProvider:{},byModule:{}};

const JOBS=[];const JOB_LISTENERS=new Set();
function jobsSubscribe(fn){JOB_LISTENERS.add(fn);return()=>JOB_LISTENERS.delete(fn)}
function jobsNotify(){JOB_LISTENERS.forEach(f=>{try{f()}catch(e){}});updateJobsBadge()}
function updateJobsBadge(){const n=JOBS.filter(j=>j.status==='running').length;const b=document.getElementById('jobsBadge');if(!b)return;if(n>0){b.style.display='';b.textContent=n}else b.style.display='none'}
function newJob({moduleId,label}){
  const job={id:uid('j'),moduleId,label:label||moduleId,status:'running',output:'',startedAt:Date.now(),controller:new AbortController(),listeners:new Set()};
  JOBS.unshift(job);if(JOBS.length>30)JOBS.length=30;
  jobsNotify();return job;
}
function jobOnChunk(job,full){job.output=full;job.listeners.forEach(l=>{try{l(full)}catch(e){}})}
function jobDone(job,err){
  job.status=err?'error':'done';job.error=err?err.message:null;job.durationMs=Date.now()-job.startedAt;
  jobsNotify();
}
function jobAbort(job){if(job.status==='running'){try{job.controller.abort()}catch(e){}job.status='aborted';jobsNotify()}}
function abortGen(){const r=JOBS.filter(j=>j.status==='running');r.forEach(jobAbort);if(r.length)toast(r.length+' génération(s) arrêtée(s)')}

function el(tag,attrs={},...children){
  const e=document.createElement(tag);
  for(const k in attrs){
    if(k==='style'&&typeof attrs[k]==='object')Object.assign(e.style,attrs[k]);
    else if(k.startsWith('on')&&typeof attrs[k]==='function')e.addEventListener(k.slice(2).toLowerCase(),attrs[k]);
    else if(k==='html')e.innerHTML=attrs[k];
    else if(attrs[k]!==undefined&&attrs[k]!==null)e.setAttribute(k,attrs[k]);
  }
  for(const c of children.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}
  return e;
}
function toast(msg,type='info',ms=2800){
  const root=document.getElementById('toasts');
  const t=el('div',{class:'toast '+type,role:'status'},msg);
  root.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(20px)';setTimeout(()=>t.remove(),250)},ms);
}
function modal(content,opts={}){
  const root=document.getElementById('modalRoot');root.innerHTML='';
  const m=el('div',{class:'modal'});
  if(opts.title)m.appendChild(el('h2',{},opts.title));
  if(typeof content==='string')m.insertAdjacentHTML('beforeend',content);
  else m.appendChild(content);
  if(opts.actions){
    const row=el('div',{class:'row',style:{justifyContent:'flex-end',marginTop:'14px'}});
    for(const a of opts.actions){row.appendChild(el('button',{class:'btn '+(a.primary?'primary':''),onclick:()=>{closeModal();a.onClick&&a.onClick()}},a.label))}
    m.appendChild(row);
  }
  root.appendChild(m);root.classList.add('show');
  // focus trap minimal
  const focusable=m.querySelectorAll('input,select,textarea,button,[tabindex]');if(focusable[0])focusable[0].focus();
  root.onclick=e=>{if(e.target===root)closeModal()};
}
function closeModal(){const r=document.getElementById('modalRoot');r.classList.remove('show');r.innerHTML=''}
function confirmDialog(msg,onYes){
  modal(el('p',{},msg),{title:'Confirmation',actions:[{label:t('cancel')},{label:'OK',primary:true,onClick:onYes}]});
}
function copyText(s){
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(s).then(()=>toast(t('copy')+' ✓','success'),()=>fallbackCopy(s));
  else fallbackCopy(s);
}
function fallbackCopy(s){const ta=el('textarea',{style:{position:'fixed',top:'-1000px'}});ta.value=s;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(t('copy')+' ✓','success')}catch(e){}ta.remove()}
function download(filename,content,mime='text/plain'){
  const blob=content instanceof Blob?content:new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=el('a',{href:url,download:filename});document.body.appendChild(a);a.click();
  requestAnimationFrame(()=>{URL.revokeObjectURL(url);a.remove()});
}
function escHtml(s){return (s||'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function mdToHtml(s){
  if(window.marked&&window.marked.parse)return window.marked.parse(s);
  // minimal fallback
  return escHtml(s).replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\n/g,'<br>');
}

function confetti(){

async function summarizeKnowledge(){
  const p=activeProfile();if(!p)return;
  const src=(p.knowledgeBase.paste||'')+'\n\n'+(p.knowledgeBase.sources||[]).map(s=>s.text||'').join('\n\n');
  if(!src.trim())return;
  const sys='Tu es un analyste marketing. Extrait du texte fourni un BRIEF BUSINESS structuré JSON avec ces clés: brief (200-400 mots), persona (3-5 traits), usps (3-5 bullets), competitors (array), tone (5 adjectifs), vocabulary (10-15 mots-clés). Réponds STRICTEMENT en JSON valide, rien d\'autre.';
  const usr='Voici les sources:\n\n'+src.slice(0,12000);
  const res=await aiCall({moduleId:'knowledge',system:sys,user:usr});
  let parsed=null;
  try{const m=res.text.match(/\{[\s\S]*\}/);if(m)parsed=JSON.parse(m[0])}catch(e){}
  if(parsed){
    Object.assign(p.knowledgeBase,parsed);p.knowledgeBase.lastSummaryAt=new Date().toISOString();saveStore();
    toast('Brief business généré ✓','success');
  }else{
    p.knowledgeBase.brief=res.text;saveStore();
    toast('Brief enregistré (parsing partiel)','info');
  }
}

let LAST_CONTEXT='';let LAST_RUN=null;

async function runGen({moduleId,system,user,target,label}){
  let sys=system;
  if(LAST_CONTEXT){sys+='\n\nCONTEXTE PRÉCÉDENT (utilise-le si pertinent):\n'+LAST_CONTEXT.slice(0,4000);LAST_CONTEXT=''}
  LAST_RUN={moduleId,system:sys,user};
  // cost-aware pre-flight
  const ok=await preflightCost(sys+user,moduleId);
  if(!ok){target.onDone&&target.onDone();return}
  const job=newJob({moduleId,label:label||(t(MODULE_LABELS[moduleId]||moduleId)+' · '+(user||'').slice(0,40))});
  target.onStart&&target.onStart(job);
  // bridge job listener → target
  const unsub=(()=>{const l=full=>target.onChunk&&target.onChunk('',full);job.listeners.add(l);return()=>job.listeners.delete(l)})();
  try{
    await aiCall({moduleId,system:sys,user,onChunk:(d,f)=>{jobOnChunk(job,f);target.onChunk&&target.onChunk(d,f)},controller:job.controller});
    jobDone(job);
  }catch(e){
    jobDone(job,e);
    if(e.name!=='AbortError'&&!/aborted/i.test(e.message||''))toast('Erreur: '+e.message,'error',5000);
  }finally{unsub();target.onDone&&target.onDone(job)}
}

async function preflightCost(text,moduleId){
  const p=activeProfile();const provId=p.providers.active;const pv=PROVIDERS[provId];
  if(!pv||!pv.pricing||(pv.pricing.input===0&&pv.pricing.output===0))return true;
  const inTok=Math.ceil(text.length/4);const estOut=2000;
  const est=(inTok*pv.pricing.input+estOut*pv.pricing.output)/1e6;
  if(est<0.05)return true;
  return new Promise(res=>{
    modal(el('div',{},
      el('div',{class:'cost-warn'},`💰 Coût estimé : ~${est.toFixed(3)}$ (${pv.label})`),
      el('p',{},'Cette génération est potentiellement coûteuse. Continuer ?')
    ),{title:'Confirmation',actions:[
      {label:'Annuler',onClick:()=>res(false)},
      {label:'Continuer',primary:true,onClick:()=>res(true)}
    ]});
  });
}

          (d.hashtags?el('div',{class:'mute',style:{fontSize:'11px',marginTop:'4px'}},Array.isArray(d.hashtags)?d.hashtags.join(' '):d.hashtags):null));
        cell.addEventListener('dragstart',e=>{cell.classList.add('dragging');e.dataTransfer.setData('text/plain',cell.dataset.i)});
        cell.addEventListener('dragend',()=>cell.classList.remove('dragging'));
        cell.addEventListener('dragover',e=>e.preventDefault());
        cell.addEventListener('drop',e=>{e.preventDefault();const from=parseInt(e.dataTransfer.getData('text/plain'));const to=parseInt(cell.dataset.i);if(from===to||isNaN(from))return;const it=arr.splice(from,1)[0];arr.splice(to,0,it);redrawCal()});
        return cell;
      }
      function redrawCal(){grid.innerHTML='';arr.forEach((d,i)=>grid.appendChild(makeCell(d,i)))}
      redrawCal();
      out.appendChild(grid);
      // exports
      const exp=el('div',{class:'row',style:{marginTop:'10px'}});
      exp.appendChild(el('button',{class:'btn sm',onclick:()=>download('calendar.csv',toCSV(arr),'text/csv')},'⬇️ CSV'));

      exp.appendChild(el('button',{class:'btn sm primary',onclick:()=>batchGenerateCalendar(arr,out)},'⚡ Batch — générer les '+arr.length+' posts'));
      out.appendChild(exp);

});
function toCSV(arr){
  const cols=['day','date','network','type','theme','hook','content','hashtags','best_time'];
  const esc=v=>'"'+String(v==null?'':Array.isArray(v)?v.join(' '):v).replace(/"/g,'""')+'"';
  return cols.join(',')+'\n'+arr.map(r=>cols.map(c=>esc(r[c])).join(',')).join('\n');
}
function toMDtable(arr){
  const cols=['day','date','network','theme','hook','hashtags'];
  return '| '+cols.join(' | ')+' |\n|'+cols.map(()=>'---').join('|')+'|\n'+arr.map(r=>'| '+cols.map(c=>String(r[c]==null?'':Array.isArray(r[c])?r[c].join(' '):r[c]).replace(/\|/g,'\\|').replace(/\n/g,' ')).join(' | ')+' |').join('\n');
}
function toICS(arr){
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//BuilderAi//FR'];
  arr.forEach((r,i)=>{
    const date=(r.date||'').replace(/-/g,'')||(new Date(Date.now()+i*86400000).toISOString().slice(0,10).replace(/-/g,''));
    const time=(r.best_time||'10:00').replace(':','')+'00';
    lines.push('BEGIN:VEVENT','UID:bbi-'+i+'@local','DTSTART:'+date+'T'+time,'SUMMARY:'+(r.network||'')+' — '+(r.theme||r.type||'Post'),'DESCRIPTION:'+((r.hook||'')+'\\n\\n'+(r.content||'')).replace(/\n/g,'\\n'),'END:VEVENT');
  });
  lines.push('END:VCALENDAR');return lines.join('\r\n');
}

async function ingestFile(file){
  const p=activeProfile();const k=p.knowledgeBase;
  let text='';
  try{text=await readFileText(file)}catch(e){toast('Lecture impossible — '+e.message,'error',5000);return}
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  k.sources.push({id:uid('src'),type:ext,name:file.name,size:file.size,text:text.slice(0,40000),addedAt:new Date().toISOString()});saveStore();
  toast('Importé: '+file.name+' — résumé en cours...','success');

function loadCDN(url){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=url;s.onload=res;s.onerror=()=>rej(new Error('CDN load fail: '+url));document.head.appendChild(s)})}

async function readFileText(file){
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(ext==='pdf'){
    if(!window.pdfjsLib){await loadCDN('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.js'}
    const buf=await file.arrayBuffer();const doc=await pdfjsLib.getDocument({data:buf}).promise;let text='';
    for(let i=1;i<=Math.min(doc.numPages,30);i++){const page=await doc.getPage(i);const c=await page.getTextContent();text+=c.items.map(it=>it.str).join(' ')+'\n'}
    return text;
  }
  if(ext==='docx'){
    if(!window.mammoth)await loadCDN('https://unpkg.com/mammoth@1.6.0/mammoth.browser.min.js');
    const buf=await file.arrayBuffer();const r=await mammoth.extractRawText({arrayBuffer:buf});return r.value;
  }
  return await file.text();
}

function openPalette(){
  const root=document.getElementById('paletteRoot');
  const p=activeProfile();if(!p)return;
  const items=[];
  modulesForProfile(p).forEach(m=>items.push({label:t(MODULE_LABELS[m]||m),hint:'module',action:()=>navigate(m)}));
  ['dashboard','knowledge','history','settings','module_builder'].forEach(m=>items.push({label:t(MODULE_LABELS[m]||m),hint:'system',action:()=>navigate(m)}));
  Object.values(STORE.profiles).forEach(pp=>items.push({label:pp.name,hint:'profil',action:()=>{STORE.activeProfileId=pp.id;saveStore();applyTheme();renderTopbar();renderSidebar();renderRoute()}}));
  items.push({label:'Toggle theme',hint:'⌘T',action:toggleTheme});
  const wrap=el('div',{class:'palette'});
  const inp=el('input',{type:'text',placeholder:'Rechercher modules, profils...'});
  const ul=el('ul');wrap.append(inp,ul);
  let sel=0;let view=items;
  function draw(){ul.innerHTML='';view.forEach((it,i)=>ul.appendChild(el('li',{class:i===sel?'sel':'',onclick:()=>{it.action();closePalette()}},el('span',{},it.label),el('span',{class:'hint'},it.hint||''))))}
  inp.oninput=()=>{const q=inp.value.toLowerCase();view=items.filter(i=>i.label.toLowerCase().includes(q));sel=0;draw()};
  inp.onkeydown=e=>{if(e.key==='ArrowDown'){sel=Math.min(sel+1,view.length-1);draw();e.preventDefault()}else if(e.key==='ArrowUp'){sel=Math.max(0,sel-1);draw();e.preventDefault()}else if(e.key==='Enter'&&view[sel]){view[sel].action();closePalette()}else if(e.key==='Escape'){closePalette()}};
  draw();root.innerHTML='';root.appendChild(wrap);root.classList.add('show');inp.focus();
  root.onclick=e=>{if(e.target===root)closePalette()};
}
function closePalette(){const r=document.getElementById('paletteRoot');r.classList.remove('show');r.innerHTML=''}

   ============================================================ */
window.addEventListener('keydown',e=>{
  const cmd=e.metaKey||e.ctrlKey;
  if(cmd&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette()}
  else if(cmd&&e.key.toLowerCase()==='t'){e.preventDefault();toggleTheme()}
  else if(cmd&&e.key.toLowerCase()==='f'){e.preventDefault();toggleFocus()}
  else if(cmd&&e.key.toLowerCase()==='b'){e.preventDefault();toggleSidebarCollapse()}
  else if(cmd&&e.key==='/'){e.preventDefault();shortcutsHelp()}
  else if(e.key==='Escape'&&document.body.classList.contains('focus-mode')){toggleFocus()}

/* ============================================================
   PWA — minimal SW via blob
   ============================================================ */
(function registerSW(){
  if(!('serviceWorker' in navigator))return;
  const sw=`
    self.addEventListener('install',e=>self.skipWaiting());
    self.addEventListener('activate',e=>self.clients.claim());
    self.addEventListener('fetch',e=>{
      const u=new URL(e.request.url);
      if(u.origin===location.origin)e.respondWith(caches.open('bbi').then(c=>c.match(e.request).then(r=>r||fetch(e.request).then(rr=>{c.put(e.request,rr.clone());return rr}).catch(()=>r))));
    });
  `;
  try{
    const blob=new Blob([sw],{type:'text/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
  }catch(e){}
})();

/* ============================================================
   BRAND COLOR EXTRACTION
   ============================================================ */
function extractBrandColor(imgEl){
  const cv=document.createElement('canvas');const w=cv.width=64,h=cv.height=64;
  const ctx=cv.getContext('2d');ctx.drawImage(imgEl,0,0,w,h);
  const data=ctx.getImageData(0,0,w,h).data;
  const buckets={};let bestKey=null,bestN=0;
  for(let i=0;i<data.length;i+=4){
    const r=data[i],g=data[i+1],b=data[i+2],a=data[i+3];
    if(a<128)continue;
    const max=Math.max(r,g,b),min=Math.min(r,g,b);
    if(max-min<25)continue; // skip greys/whites/blacks
    if(max<40||min>215)continue;
    const key=(r>>5)+'-'+(g>>5)+'-'+(b>>5);
    buckets[key]=(buckets[key]||{n:0,r:0,g:0,b:0});
    const bk=buckets[key];bk.n++;bk.r+=r;bk.g+=g;bk.b+=b;
    if(bk.n>bestN){bestN=bk.n;bestKey=key}
  }
  if(!bestKey)return null;
  const bk=buckets[bestKey];
  const r=Math.round(bk.r/bk.n),g=Math.round(bk.g/bk.n),b=Math.round(bk.b/bk.n);
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}

/* ============================================================
   BATCH CALENDAR — generate full content for each day
   ============================================================ */
async function batchGenerateCalendar(arr,outNode){
  if(!confirm('Générer un post complet pour les '+arr.length+' jours ? (Ça peut être long et coûteux)'))return;
  const progress=el('div',{class:'card'});progress.innerHTML='<div class="row"><strong>Batch en cours...</strong><span id="batchProg" class="right mono">0/'+arr.length+'</span></div><div class="skel" style="height:6px"></div>';
  outNode.insertBefore(progress,outNode.firstChild);
  const concurrency=2;
  let done=0;
  const queue=arr.map((d,i)=>({d,i}));
  async function worker(){
    while(queue.length){
      const {d,i}=queue.shift();
      const sys=buildSystemPrompt('calendar','Tu rédiges un post complet, prêt à publier, pour le jour donné. Format markdown clair avec sections.');
      const usr=`Jour ${d.day||i+1} — ${d.date||''} — Réseau: ${d.network||'multi'} — Thème: ${d.theme||d.type||''}\nHook: ${d.hook||''}\nGénère le post complet (titre/hook + corps + CTA + hashtags).`;
      const job=newJob({moduleId:'calendar',label:`J${d.day||i+1} ${d.network||''}`});
      try{
        const res=await aiCall({moduleId:'calendar',system:sys,user:usr,onChunk:(_,f)=>jobOnChunk(job,f),controller:job.controller});
        d.content=res.text;jobDone(job);
      }catch(e){jobDone(job,e)}
      done++;document.getElementById('batchProg').textContent=done+'/'+arr.length;
    }
  }
  await Promise.all(Array.from({length:concurrency},worker));
  progress.querySelector('div').innerHTML='✓ Batch terminé ('+done+'/'+arr.length+'). Ouvre le drawer ⚡ pour réutiliser, ou re-export le calendrier.';
  toast('Batch terminé ✓','success');
}

/* --- Encryption keys (master password) --- */
async function deriveKey(pw,salt){const enc=new TextEncoder();const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptStr(s,pw){const salt=crypto.getRandomValues(new Uint8Array(16));const iv=crypto.getRandomValues(new Uint8Array(12));const k=await deriveKey(pw,salt);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(s));return 'enc:'+btoa(String.fromCharCode(...salt))+'.'+btoa(String.fromCharCode(...iv))+'.'+btoa(String.fromCharCode(...new Uint8Array(ct)))}
async function decryptStr(blob,pw){const [_,sa,iv,ct]=blob.split(/[:.]/);const salt=Uint8Array.from(atob(sa),c=>c.charCodeAt(0));const ivb=Uint8Array.from(atob(iv),c=>c.charCodeAt(0));const ctb=Uint8Array.from(atob(ct),c=>c.charCodeAt(0));const k=await deriveKey(pw,salt);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ivb},k,ctb);return new TextDecoder().decode(pt)}
async function lockKeys(){const pw=prompt('Master password (chiffre toutes les clés API) :');if(!pw||pw.length<6)return toast('≥6 char','error');for(const pid in STORE.profiles){const p=STORE.profiles[pid];for(const k in p.providers.keys){const v=p.providers.keys[k];if(v&&!v.startsWith('enc:'))p.providers.keys[k]=await encryptStr(v,pw)}}saveStore();sessionStorage.setItem('bbi_pw',pw);toast('Clés chiffrées ✓','success')}
async function unlockKeys(){const pw=prompt('Master password :');if(!pw)return;try{for(const pid in STORE.profiles){const p=STORE.profiles[pid];for(const k in p.providers.keys){const v=p.providers.keys[k];if(v&&v.startsWith('enc:'))p.providers.keys[k]=await decryptStr(v,pw)}}saveStore();sessionStorage.setItem('bbi_pw',pw);toast('Déchiffré ✓','success')}catch(e){toast('Mot de passe incorrect','error')}}

      itemsBox.appendChild(row);
    });
    const subtotal=inv.items.reduce((s,it)=>s+it.qty*it.price,0);
    const vat=subtotal*(inv.vatRate||0)/100;
    inv.subtotal=subtotal;inv.vat=vat;inv.total=subtotal+vat;
    totalsBox.innerHTML='';
    totalsBox.append(
      el('p',{class:'mono'},'Sous-total HT : '+subtotal.toFixed(2)+' €'),
      el('p',{class:'mono'},'TVA ('+inv.vatRate+'%) : '+vat.toFixed(2)+' €'),
      el('p',{class:'mono',style:{fontWeight:'700',fontSize:'17px'}},'TOTAL TTC : '+inv.total.toFixed(2)+' €'));
  }
  c2.appendChild(el('button',{class:'btn sm',style:{marginTop:'4px'},onclick:()=>{inv.items.push({label:'',qty:1,price:0});update()}},'+ Ligne'));
  const totalsBox=el('div',{style:{padding:'10px 0',borderTop:'1px solid var(--border)',marginTop:'10px'}});c2.appendChild(totalsBox);
  c2.appendChild(el('div',{class:'field'},el('label',{},'Notes / mentions légales'),el('textarea',{value:'TVA non applicable, art. 293 B du CGI (si auto-entrepreneur). Pénalités de retard : 3x taux d\'intérêt légal. Pas d\'escompte.',oninput:e=>{inv.notes=e.target.value}})));
  c2.appendChild(el('div',{class:'row',style:{marginTop:'10px'}},
    el('button',{class:'btn primary',onclick:()=>{p.invoices.push({...inv});saveStore();toast('Facture sauvée ✓','success');renderRoute()}},'💾 Sauver'),
    el('button',{class:'btn',onclick:()=>printInvoice(inv,p)},'📄 Aperçu PDF')));
  app.appendChild(c2);
  update();
});
function printInvoice(inv,profile){
  const w=window.open('','_blank');if(!w)return toast('Popup bloqué','error');
  const accent=profile.info.accentColor||'#FF6B35';
  const logo=profile.info.logoDataUrl?`<img src="${profile.info.logoDataUrl}" style="max-height:60px"/>`:'';
  const itemsHtml=inv.items.map(it=>`<tr><td>${escHtml(it.label)}</td><td style="text-align:right">${it.qty}</td><td style="text-align:right">${(it.price||0).toFixed(2)} €</td><td style="text-align:right">${(it.qty*it.price).toFixed(2)} €</td></tr>`).join('');
  w.document.write(`<html><head><title>Facture ${inv.number}</title><style>
    body{font-family:system-ui,-apple-system,sans-serif;padding:40px;max-width:780px;margin:0 auto;color:#222}
    .head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:30px}
    h1{color:${accent};margin:0;font-size:28px}
    table{width:100%;border-collapse:collapse;margin:20px 0}
    th,td{padding:10px;border-bottom:1px solid #ddd}
    th{text-align:left;background:#f5f5f5}
    .totals{margin-left:auto;width:300px;font-size:15px}
    .totals .total{border-top:2px solid ${accent};padding-top:8px;font-weight:700;font-size:18px;color:${accent}}
    .notes{margin-top:30px;padding:14px;background:#f9f9f9;border-radius:6px;font-size:12px;color:#666}
    @media print{.no-print{display:none}}
  </style></head><body>
    <div class="head">
      <div>${logo}<h1>FACTURE</h1>
        <p><strong>${escHtml(profile.name||'')}</strong><br>${escHtml(profile.info.url||'')}</p>
      </div>
      <div style="text-align:right">
        <p><strong>N° ${escHtml(inv.number)}</strong></p>
        <p>Date : ${inv.date}<br>Échéance : ${inv.dueDate}</p>
      </div>
    </div>
    <div><strong>Facturé à :</strong><br><strong>${escHtml(inv.client)}</strong><br>${escHtml(inv.clientAddress||'').replace(/\n/g,'<br>')}</div>
    <table><thead><tr><th>Description</th><th style="text-align:right">Qté</th><th style="text-align:right">PU HT</th><th style="text-align:right">Total HT</th></tr></thead><tbody>${itemsHtml}</tbody></table>
    <div class="totals">
      <p>Sous-total HT : <strong style="float:right">${inv.subtotal.toFixed(2)} €</strong></p>
      <p>TVA (${inv.vatRate}%) : <strong style="float:right">${inv.vat.toFixed(2)} €</strong></p>
      <p class="total">TOTAL TTC : <strong style="float:right">${inv.total.toFixed(2)} €</strong></p>
    </div>
    <p>Conditions de paiement : ${escHtml(inv.paymentTerms||'')}</p>
    ${inv.notes?'<div class="notes">'+escHtml(inv.notes).replace(/\n/g,'<br>')+'</div>':''}
    <button class="no-print" onclick="window.print()" style="margin-top:30px;padding:10px 20px;background:${accent};color:#fff;border:0;border-radius:6px;cursor:pointer;font-weight:600">🖨️ Imprimer / Sauver en PDF</button>
  </body></html>`);
  w.document.close();
}

function boot(){
  applyTheme();
  applySidebarCollapsed();
  renderTopbar();
  // Global error guards
  window.addEventListener('error',e=>{console.error(e.error);toast('Erreur inattendue — voir console','error')});
  window.addEventListener('unhandledrejection',e=>{console.error(e.reason);if(e.reason&&e.reason.name!=='AbortError')toast('Erreur async — voir console','error')});
  if(STORE.activeProfileId&&STORE.profiles[STORE.activeProfileId]){
    renderSidebar();
    if(!location.hash)location.hash='#/dashboard';
    renderRoute();
  }else{
    renderOnboarding();
  }
  // load marked + JSZip lazily for export
  loadCDN('https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js').catch(()=>{});
}
boot();
