<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0db77b" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0a0b0d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chartLine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0db77b"/>
      <stop offset="100%" stop-color="#1cd092"/>
    </linearGradient>
    <linearGradient id="chartFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0db77b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0db77b" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="#0a0b0d"/>
  <rect width="1024" height="1024" fill="url(#bgGlow)"/>

  <!-- Subtle horizontal grid lines (Bloomberg vibes) -->
  <g stroke="#25282e" stroke-width="1" opacity="0.5">
    <line x1="80" y1="280" x2="944" y2="280"/>
    <line x1="80" y1="440" x2="944" y2="440"/>
    <line x1="80" y1="600" x2="944" y2="600"/>
    <line x1="80" y1="760" x2="944" y2="760"/>
  </g>

  <!-- Big '$' sign in subtle gold -->
  <text x="512" y="600"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-style="italic"
        font-weight="700"
        font-size="540"
        fill="#d4a843"
        opacity="0.10"
        letter-spacing="-10">$</text>

  <!-- Ascending chart line — the hero -->
  <g filter="url(#glow)">
    <!-- Filled area -->
    <path d="M 120 720
             L 220 690
             L 320 720
             L 420 640
             L 520 580
             L 620 600
             L 720 480
             L 820 380
             L 904 280
             L 904 800
             L 120 800 Z"
          fill="url(#chartFill)"/>

    <!-- Line stroke -->
    <path d="M 120 720
             L 220 690
             L 320 720
             L 420 640
             L 520 580
             L 620 600
             L 720 480
             L 820 380
             L 904 280"
          stroke="url(#chartLine)"
          stroke-width="14"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>
  </g>

  <!-- Last point glow dot -->
  <circle cx="904" cy="280" r="22" fill="#1cd092" filter="url(#glow)"/>
  <circle cx="904" cy="280" r="14" fill="#1cd092"/>
  <circle cx="904" cy="280" r="8" fill="#ffffff"/>

  <!-- Bottom label -->
  <text x="512" y="900"
        text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', monospace"
        font-weight="700"
        font-size="38"
        fill="#8a8b8f"
        letter-spacing="10">CT·TYCOON</text>

  <!-- Top right ticker -->
  <text x="120" y="180"
        font-family="ui-monospace, 'SF Mono', monospace"
        font-weight="600"
        font-size="42"
        fill="#0db77b">▲</text>
  <text x="180" y="180"
        font-family="ui-monospace, 'SF Mono', monospace"
        font-weight="700"
        font-size="42"
        fill="#0db77b">+247.83%</text>
</svg>
